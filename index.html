        }
        if (h.fond_caisse_ouverture !== null && h.fond_caisse_ouverture !== undefined){
          html += '<div class="hint" style="margin:-4px 0 6px;">Fond de caisse au départ : <b class="num">' + fmt(h.fond_caisse_ouverture) + '</b></div>';
        }
        if (h.total_depenses){
          html += '<div class="hint" style="margin:-4px 0 6px;">Dépenses de caisse : <b class="num">' + fmt(h.total_depenses) + '</b></div>';
        }
        if (h.nb_cartes !== null && h.nb_cartes !== undefined){
          html += '<div class="hint" style="margin:-4px 0 6px;">Nombre de cartes : <b class="num">' + h.nb_cartes + '</b></div>';
        }
        if (h.montant_depot !== null && h.montant_depot !== undefined){
          html += '<div class="hint" style="margin:-4px 0 6px;">Dépôt en banque : <b class="num">' + fmt(h.montant_depot) + '</b>' +
            (h.depot_reference ? ' — ' + escapeHtml(h.depot_reference) : '') + '</div>';
        }
        html += '<div class="empreinte">' + h.empreinte + '</div>';
      });
      html += '</div>';
    }

    el.innerHTML = html;
    const btnOuvrirComptage = document.getElementById("btn-ouvrir-comptage");
    if (btnOuvrirComptage) btnOuvrirComptage.addEventListener("click", ouvrirComptageCaisse);
    if (ui.comptageOuvert) wireComptageCaisse(el.querySelector(".comptage-panel"), tOuverts);

    const btnOuvrirDepense = el.querySelector("#btn-ouvrir-depense");
    if (btnOuvrirDepense) btnOuvrirDepense.addEventListener("click", ouvrirDepense);
    const btnAnnulerDepense = el.querySelector("#btn-annuler-depense");
    if (btnAnnulerDepense) btnAnnulerDepense.addEventListener("click", fermerDepense);
    const btnValiderDepense = el.querySelector("#btn-valider-depense");
    if (btnValiderDepense) btnValiderDepense.addEventListener("click", enregistrerDepense);
    const depenseMotifInp = el.querySelector("#depense-motif");
    if (depenseMotifInp) depenseMotifInp.addEventListener("input", () => { ui.depenseMotif = depenseMotifInp.value; });
    const depenseMontantInp = el.querySelector("#depense-montant");
    if (depenseMontantInp) depenseMontantInp.addEventListener("input", () => { ui.depenseMontant = depenseMontantInp.value; });
    const depensePhotoInp = el.querySelector("#depense-photo");
    if (depensePhotoInp) depensePhotoInp.addEventListener("change", () => onDepensePhotoChange(depensePhotoInp));
    const btnRetirerDepensePhoto = el.querySelector("#btn-retirer-depense-photo");
    if (btnRetirerDepensePhoto) btnRetirerDepensePhoto.addEventListener("click", retirerDepensePhoto);

    // ---- arrhes / acomptes ----
    const btnOuvrirDepotForm = el.querySelector("#btn-ouvrir-depot-form");
    if (btnOuvrirDepotForm) btnOuvrirDepotForm.addEventListener("click", ouvrirDepotForm);
    const btnAnnulerDepotForm = el.querySelector("#depot-annuler-form");
    if (btnAnnulerDepotForm) btnAnnulerDepotForm.addEventListener("click", fermerDepotForm);
    const btnValiderDepotForm = el.querySelector("#depot-valider-form");
    if (btnValiderDepotForm) btnValiderDepotForm.addEventListener("click", enregistrerDepot);
    if (ui.depotForm){
      const f = ui.depotForm;
      const depotType = el.querySelector("#depot-type"); if (depotType) depotType.addEventListener("change", () => { f.type = depotType.value; });
      const depotMontant = el.querySelector("#depot-montant"); if (depotMontant) depotMontant.addEventListener("input", () => { f.montant = depotMontant.value; });
      const depotMoyen = el.querySelector("#depot-moyen"); if (depotMoyen) depotMoyen.addEventListener("change", () => { f.moyenPaiement = depotMoyen.value; });
      const depotNomClient = el.querySelector("#depot-nom-client"); if (depotNomClient) depotNomClient.addEventListener("input", () => { f.nomClient = depotNomClient.value; });
      const depotNote = el.querySelector("#depot-note"); if (depotNote) depotNote.addEventListener("input", () => { f.note = depotNote.value; });
    }
    el.querySelectorAll("[data-depot-action]").forEach(btn => {
      btn.addEventListener("click", () => ouvrirActionDepot(btn.getAttribute("data-depot-action")));
    });
    el.querySelectorAll("[data-depot-conserver]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-depot-conserver");
        const motifInp = el.querySelector("#depot-motif-" + id);
        conserverDepot(id, motifInp ? motifInp.value : "");
      });
    });
    el.querySelectorAll("[data-depot-annuler]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-depot-annuler");
        const motifInp = el.querySelector("#depot-motif-" + id);
        annulerDepot(id, motifInp ? motifInp.value : "");
      });
    });

    el.querySelectorAll("[data-journal-jour]").forEach(btn => {
      btn.addEventListener("click", () => {
        const [y,m,d] = ui.journalDate.split("-").map(Number);
        const dt = new Date(y, m-1, d);
        dt.setDate(dt.getDate() + Number(btn.getAttribute("data-journal-jour")));
        const nouvelle = fmtDateInput(dt);
        if (nouvelle > fmtDateInput(new Date())) return;
        naviguerJournalDate(nouvelle);
      });
    });
    const dateInput = el.querySelector("#journal-date-input");
    if (dateInput) dateInput.addEventListener("change", () => { if (dateInput.value) naviguerJournalDate(dateInput.value); });
    const btnAujourdhui = el.querySelector("#btn-journal-aujourdhui");
    if (btnAujourdhui) btnAujourdhui.addEventListener("click", () => naviguerJournalDate(fmtDateInput(new Date())));

    el.querySelectorAll("[data-corriger-ticket]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-corriger-ticket");
        if (ui.correctionTicket && ui.correctionTicket.ticketId === id){ fermerCorrectionTicket(); return; }
        const tk = ticketsJour.find(t => t.id === id);
        if (tk) ouvrirCorrectionTicket(tk);
      });
    });

    el.querySelectorAll("[data-facture-ticket]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-facture-ticket");
        const tk = ticketsJour.find(t => t.id === id);
        if (!tk) return;
        const factureExistante = (tk.factures || [])[0] || null;
        if (factureExistante){
          // bascule simple : ouvrir/fermer l'aperçu de la facture déjà générée
          ui.factureTicket = (ui.factureTicket && ui.factureTicket.ticketId === id) ? null : { ticketId: id, mention: null };
          renderJournalView();
          return;
        }
        if (ui.factureTicket && ui.factureTicket.ticketId === id){ fermerFactureTicket(); return; }
        ouvrirFactureTicket(tk);
      });
    });

    el.querySelectorAll("[data-ticket-imprimer]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-ticket-imprimer");
        ui.ticketImprime = (ui.ticketImprime && ui.ticketImprime.ticketId === id) ? null : { ticketId: id, mention: null };
        renderJournalView();
      });
    });

    el.querySelectorAll("[data-mail-ticket]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-mail-ticket");
        if (ui.emailForm && ui.emailForm.typeDocument === "ticket" && ui.emailForm.documentId === id){ fermerEnvoiEmail(); return; }
        const tk = ticketsJour.find(t => t.id === id);
        if (!tk) return;
        const email = await resoudreEmailClient(tk.client_id);
        ouvrirEnvoiEmail("ticket", tk.id, tk.numero, email);
      });
    });

    el.querySelectorAll("[data-mail-facture]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const id = btn.getAttribute("data-mail-facture");
        if (ui.emailForm && ui.emailForm.typeDocument === "facture" && ui.emailForm.documentId === id){ fermerEnvoiEmail(); return; }
        const tk = ticketsJour.find(t => (t.factures || [])[0] && t.factures[0].id === id);
        const facture = tk ? tk.factures[0] : null;
        if (!facture) return;
        const email = await resoudreEmailClient(tk.client_id);
        ouvrirEnvoiEmail("facture", facture.id, facture.numero, email);
      });
    });

    if (ui.emailForm){
      const fermerMailBtn = document.getElementById("email-fermer");
      if (fermerMailBtn) fermerMailBtn.addEventListener("click", fermerEnvoiEmail);
      const envoyerMailBtn = document.getElementById("email-envoyer");
      if (envoyerMailBtn) envoyerMailBtn.addEventListener("click", envoyerEmailDocument);
    }

    if (ui.factureTicket){
      const fermerFactBtn = document.getElementById("facture-fermer");
      if (fermerFactBtn) fermerFactBtn.addEventListener("click", fermerFactureTicket);
      const imprimerBtn = document.getElementById("facture-imprimer");
      if (imprimerBtn) imprimerBtn.addEventListener("click", () => {
        const f = ui.factureTicket;
        const tk = ticketsJour.find(t => t.id === f.ticketId);
        const factureExistante = tk ? (tk.factures || [])[0] : null;
        if (!factureExistante) return;
        imprimerDocumentEtMarquer("facture", factureExistante.id, (m) => { f.mention = m; });
      });

      const f = ui.factureTicket;
      const nomInput = document.getElementById("facture-nom-client");
      if (nomInput) nomInput.addEventListener("input", () => { f.nomClient = nomInput.value; });
      const adresseInput = document.getElementById("facture-adresse-client");
      if (adresseInput) adresseInput.addEventListener("input", () => { f.adresseClient = adresseInput.value; });
      const annulerBtn = document.getElementById("facture-annuler");
      if (annulerBtn) annulerBtn.addEventListener("click", fermerFactureTicket);
      const genererBtn = document.getElementById("facture-generer");
      if (genererBtn) genererBtn.addEventListener("click", genererFactureTicket);
    }

    if (ui.ticketImprime){
      const fermerTiBtn = document.getElementById("ticket-impr-fermer");
      if (fermerTiBtn) fermerTiBtn.addEventListener("click", () => { ui.ticketImprime = null; renderJournalView(); });
      const imprimerTiBtn = document.getElementById("ticket-impr-imprimer");
      if (imprimerTiBtn) imprimerTiBtn.addEventListener("click", () => {
        imprimerDocumentEtMarquer("ticket", ui.ticketImprime.ticketId, (m) => { ui.ticketImprime.mention = m; });
      });
    }

    if (ui.correctionTicket){
      const c = ui.correctionTicket;
      const moyenSel = document.getElementById("corr-moyen");
      if (moyenSel) moyenSel.addEventListener("change", () => { c.moyen = moyenSel.value; });
      el.querySelectorAll("[data-corr-ligne]").forEach(sel => {
        sel.addEventListener("change", () => { c.lignes[sel.getAttribute("data-corr-ligne")] = sel.value || null; });
      });
      const motifInput = document.getElementById("corr-motif");
      if (motifInput) motifInput.addEventListener("input", () => { c.motif = motifInput.value; });
      const fermerBtn = document.getElementById("corr-fermer");
      if (fermerBtn) fermerBtn.addEventListener("click", fermerCorrectionTicket);
      const enregistrerBtn = document.getElementById("corr-enregistrer");
      if (enregistrerBtn) enregistrerBtn.addEventListener("click", enregistrerCorrectionTicket);

      const ouvrirAnnulerBtn = document.getElementById("corr-ouvrir-annuler");
      if (ouvrirAnnulerBtn) ouvrirAnnulerBtn.addEventListener("click", ouvrirAnnulationTicket);
      const motifAnnulInput = document.getElementById("corr-motif-annul");
      if (motifAnnulInput) motifAnnulInput.addEventListener("input", () => { c.motifAnnul = motifAnnulInput.value; });
      const renoncerBtn = document.getElementById("corr-annuler-annuler");
      if (renoncerBtn) renoncerBtn.addEventListener("click", fermerAnnulationTicket);
      const confirmerAnnulerBtn = document.getElementById("corr-confirmer-annuler");
      if (confirmerAnnulerBtn) confirmerAnnulerBtn.addEventListener("click", confirmerAnnulationTicket);
    }
  }

  function ouvrirCorrectionTicket(tk){
    const lignes = {};
    (tk.lignes_ticket || []).forEach(l => { lignes[l.id] = l.collaborateur_id || null; });
    ui.correctionTicket = {
      ticketId: tk.id, moyen: tk.moyen_paiement, lignes,
      motif: "", erreur: "", enCours: false,
      annulerOuvert: false, motifAnnul: "", erreurAnnul: "", enCoursAnnul: false
    };
    renderJournalView();
  }

  function fermerCorrectionTicket(){ ui.correctionTicket = null; renderJournalView(); }

  function ouvrirFactureTicket(tk){
    ui.factureTicket = { ticketId: tk.id, nomClient: "", adresseClient: "", erreur: "", enCours: false };
    renderJournalView();
  }

  function fermerFactureTicket(){ ui.factureTicket = null; renderJournalView(); }

  async function genererFactureTicket(){
    const f = ui.factureTicket; if (!f) return;
    if (!f.nomClient || !f.nomClient.trim()){ f.erreur = "Le nom du client est obligatoire."; renderJournalView(); return; }

    f.erreur = ""; f.enCours = true; renderJournalView();
    try{
      const { error } = await supa.rpc("generer_facture", {
        p_ticket_id: f.ticketId,
        p_nom_client: f.nomClient.trim(),
        p_adresse_client: f.adresseClient ? f.adresseClient.trim() : null,
        p_demandee_par_id: ui.collaborateurConnecte ? ui.collaborateurConnecte.id : null
      });
      if (error) throw error;
      await refreshTicketsEtHistorique();
      ui.factureTicket = { ticketId: f.ticketId }; // bascule sur l'aperçu de la facture tout juste créée
      showStatus("ok", "Facture générée.");
    }catch(err){
      f.enCours = false;
      f.erreur = err.message || String(err);
    }
    renderJournalView();
  }

  function ouvrirAnnulationTicket(){
    const c = ui.correctionTicket; if (!c) return;
    c.annulerOuvert = true; c.erreurAnnul = "";
    renderJournalView();
  }

  function fermerAnnulationTicket(){
    const c = ui.correctionTicket; if (!c) return;
    c.annulerOuvert = false; c.erreurAnnul = "";
    renderJournalView();
  }

  async function enregistrerCorrectionTicket(){
    const c = ui.correctionTicket; if (!c) return;
    const tk = ticketsJour.find(t => t.id === c.ticketId);
    if (!tk){ ui.correctionTicket = null; renderJournalView(); return; }

    if (!c.motif || !c.motif.trim()){ c.erreur = "Le motif est obligatoire."; renderJournalView(); return; }
    if (!peut("modifier_ticket")){ c.erreur = "Ton rôle ne permet pas de corriger une fiche."; renderJournalView(); return; }

    const changePaiement = c.moyen !== tk.moyen_paiement;
    const changesLignes = (tk.lignes_ticket || []).filter(l => (c.lignes[l.id] || null) !== (l.collaborateur_id || null));
    if (!changePaiement && changesLignes.length === 0){
      c.erreur = "Aucune modification à enregistrer.";
      renderJournalView();
      return;
    }

    const collaborateurId = ui.collaborateurConnecte.id;
    c.erreur = ""; c.enCours = true; renderJournalView();
    try{
      if (changePaiement){
        const { error } = await supa.rpc("modifier_paiement_ticket", { p_ticket_id: c.ticketId, p_nouveau_moyen: c.moyen, p_collaborateur_id: collaborateurId, p_motif: c.motif });
        if (error) throw error;
      }
      for (const l of changesLignes){
        const { error } = await supa.rpc("modifier_collaborateur_ligne", { p_ligne_id: l.id, p_nouveau_collaborateur_id: c.lignes[l.id] || null, p_collaborateur_id: collaborateurId, p_motif: c.motif });
        if (error) throw error;
      }
      ui.correctionTicket = null;
      await refreshTicketsEtHistorique();
      showStatus("ok", "Ticket corrigé.");
    }catch(err){
      c.enCours = false;
      c.erreur = err.message || String(err);
    }
    renderJournalView();
  }

  async function confirmerAnnulationTicket(){
    const c = ui.correctionTicket; if (!c) return;
    if (!c.motifAnnul || !c.motifAnnul.trim()){ c.erreurAnnul = "Le motif est obligatoire."; renderJournalView(); return; }
    if (!peut("annuler_ticket")){ c.erreurAnnul = "Ton rôle ne permet pas d'annuler un ticket."; renderJournalView(); return; }

    c.erreurAnnul = ""; c.enCoursAnnul = true; renderJournalView();
    try{
      const { error } = await supa.rpc("annuler_ticket", { p_ticket_id: c.ticketId, p_collaborateur_id: ui.collaborateurConnecte.id, p_motif: c.motifAnnul });
      if (error) throw error;
      ui.correctionTicket = null;
      await refreshTicketsEtHistorique();
      showStatus("ok", "Ticket annulé.");
    }catch(err){
      c.enCoursAnnul = false;
      c.erreurAnnul = err.message || String(err);
    }
    renderJournalView();
  }

  function tickClock(){
    const el = document.getElementById("clock");
    if (el) el.textContent = new Date().toLocaleTimeString("fr-FR");
  }

  // ---- déconnexion automatique par inactivité ----
  // Un poste resté ouvert et sans surveillance ne doit jamais permettre qu'une vente soit
  // enregistrée sous l'identité de qui était connecté avant : au bout de 5 minutes sans la
  // moindre interaction (clic, saisie, tactile -- quel que soit l'écran affiché), retour à
  // l'Accueil et code personnel redemandé, exactement comme un "Changer" manuel.
  const DELAI_INACTIVITE_MS = 5 * 60 * 1000;
  function signalerActivite(){ ui.derniereActivite = Date.now(); }
  function verifierInactivite(){
    if (!ui.collaborateurConnecte) return;
    if (Date.now() - ui.derniereActivite < DELAI_INACTIVITE_MS) return;
    ui.salonSection = "accueil";
    changerCollaborateur();
  }
  ["click","keydown","touchstart"].forEach(evt => document.addEventListener(evt, signalerActivite, true));
  setInterval(verifierInactivite, 15000);

  document.getElementById("tab-encaissement").addEventListener("click", () => setTab("encaissement"));
  document.getElementById("tab-activite").addEventListener("click", () => setTab("activite"));
  tickClock(); setInterval(tickClock, 1000);
  // supabase-js et xlsx sont chargées en "defer" (voir <head>) pour que l'app affiche tout de
  // suite son squelette (en-tête, pied de page) même si le CDN est lent, au lieu de laisser le
  // navigateur bloqué sur une page blanche le temps du chargement de ces scripts. Sur un
  // <script defer>, DOMContentLoaded n'est déclenché qu'une fois ces scripts exécutés (ou
  // définitivement échoués) : si l'évènement est déjà passé quand ce code s'exécute (peu
  // probable ici puisqu'on est encore en plein parsing du document, mais gardé par sécurité),
  // on démarre immédiatement plutôt que d'attendre un évènement qui ne viendra plus.
  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
