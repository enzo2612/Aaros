<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caisse Just Hair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<style>
  :root{
    /* Identité AAROS — or/noir, une seule identité pour tous les clients (cf. design system AAROS). */
    --accent:#D4AF37; --accent-ink:#0B0B0B; --ink:#0B0B0B; --ink-soft:#8A8A8A;
    --paper:#F7F5F2; --surface:#ffffff; --surface-2:#F2EEE8; --line:#E7E2DA;
    --success:#1E7A4C; --success-soft:#E6F4EC; --warn:#B76E00; --warn-soft:#FBF1DE; --warn-line:#E6CF9E;
    --danger:#B3261E; --danger-soft:#FBEAE7;
    --accent-2:#0f6e8c; --accent-2-soft:#e6f1f5;
    --shadow: 0 1px 2px rgba(11,11,11,.06), 0 8px 24px -12px rgba(11,11,11,.18);
  }
  *{box-sizing:border-box;}
  /* overflow-x:hidden seulement sur body, jamais sur html : dès que html a aussi un
     overflow différent de "visible", le débordement de body ne se "propage" plus au
     viewport (règle CSS standard) et body devient lui-même un conteneur de scroll
     séparé -- ce qui casse silencieusement tout position:sticky à l'intérieur (ex: le
     bandeau latéral, qui ne suivait plus le scroll). */
  body{margin:0; background:var(--paper); color:var(--ink); font-family:"Inter",-apple-system,"Segoe UI",system-ui,sans-serif; overflow-x:hidden;}
  /* Filet de sécurité : certains tableaux larges (ex: "Détail par collaborateur") peuvent
     pousser leur conteneur au-delà de la largeur de l'écran même quand ils défilent
     correctement dans leur propre cadre (.table-scroll) -- ceci empêche que ça fasse aussi
     défiler toute la page horizontalement sur un téléphone. */
  .num{font-variant-numeric:tabular-nums;}
  .shell{width:100%; max-width:1600px; margin-inline:auto; padding:16px 32px 40px; flex:1 1 0%; min-width:0; box-sizing:border-box;}
  /* .table-scroll doit faire défiler ses tableaux dans leur propre cadre à TOUTE largeur d'écran,
     pas seulement sur mobile : sur la page Stock par exemple, la colonne de gauche (grille à 2
     colonnes avec le graphique de répartition à droite) est plus étroite que la largeur totale de
     l'écran -- sans ce défilement, un tableau un peu chargé (beaucoup de boutons d'action sur une
     ligne) déborde par-dessus le graphique et rend ses boutons incliquables, même en plein écran
     de bureau. */
  .table-scroll{ overflow-x:auto; max-width:100%; }
  /* .table-scroll-tall : pour un tableau potentiellement très long (ex: Stock salon, des
     centaines/milliers de lignes) -- sans hauteur bornée, la page entière grandit avec le
     tableau et la barre de défilement horizontale (utile pour voir les colonnes qui débordent
     à droite) se retrouve tout en bas, après toutes les lignes. On borne la hauteur du cadre
     et on le fait défiler lui-même, en-tête inclus (sticky), pour que tout reste accessible
     sans avoir à descendre toute la page. */
  .table-scroll-tall{ max-height:62vh; overflow-y:auto; border:1px solid var(--line); border-radius:12px; }
  .table-scroll-tall thead th{ position:sticky; top:0; background:var(--surface); z-index:1; box-shadow:0 1px 0 var(--line); }

  /* ---- Fonction école (mode formation) : bandeau impossible à manquer, au-dessus de tout,
     y compris le menu latéral -- une fiche de formation ne doit jamais pouvoir être confondue
     avec une vraie vente (BOI-TVA-DECLA-30-10-30 §150 : marquage clair des données fictives). */
  #formation-banner{position:sticky; top:0; z-index:100; background:var(--warn); color:var(--ink); font-weight:800; font-size:13px; padding:10px 16px; display:flex; align-items:center; justify-content:center; gap:14px; text-align:center;}
  #formation-banner[hidden]{display:none;}
  #formation-banner .btn{flex:0 0 auto;}
  .formation-tag{display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:6px; background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line); margin-left:6px;}

  header.topbar{position:sticky; top:0; z-index:20; background:var(--paper); border-bottom:1px solid var(--line); margin:0 -16px; padding:12px 16px 0;}
  .brandrow{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .wordmark{display:flex; gap:8px; flex:1; min-width:0;}
  .wordmark .bar{width:5px; background:var(--accent); border-radius:2px;}
  .wordmark b{font-size:20px; font-weight:900;}
  .wordmark span{display:block; font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); margin-top:3px;}
  #salon-nom.salon-badge{display:inline-block; font-size:11.5px; font-weight:800; letter-spacing:.02em; text-transform:none; color:var(--salon-color-ink, var(--accent-ink)); background:var(--salon-color, var(--accent)); padding:3px 10px; border-radius:20px; margin-left:2px;}
  .clock{font-size:13px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
  .who{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700;}
  .who .chg{background:none; border:1px solid var(--line); border-radius:8px; padding:4px 9px; font-size:11px; font-weight:700; cursor:pointer;}
  .tabs{display:flex; gap:4px; margin-top:12px;}
  .tabs[hidden]{display:none;}
  .tabs button{appearance:none; border:1px solid var(--line); border-bottom:none; background:var(--surface); color:var(--ink-soft); font-weight:700; font-size:13px; padding:9px 16px; border-radius:10px 10px 0 0; cursor:pointer; position:relative; top:1px;}
  .tabs button[aria-selected="true"]{color:var(--ink); background:var(--paper);}
  .tabline{border-bottom:1px solid var(--line); margin-top:-1px;}

  .status-banner{display:flex; align-items:center; gap:10px; border-radius:12px; padding:10px 14px; margin:16px 0; font-size:13px;}
  .status-banner.ok{background:var(--success-soft); color:var(--success); border:1px solid var(--success);}
  .status-banner.err{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line);}
  .status-banner.loading{background:var(--accent-2-soft); color:var(--accent-2); border:1px solid var(--accent-2);}
  .status-spin{width:13px; height:13px; border-radius:50%; border:2px solid var(--accent-2-soft); border-top-color:var(--accent-2); animation:status-spin .7s linear infinite; flex:none;}
  @keyframes status-spin{to{transform:rotate(360deg);}}

  /* ---- écran de connexion collaborateur ---- */
  .gate{max-width:420px; margin:40px auto; text-align:center;}
  .gate h1{font-size:18px; font-weight:800; margin-bottom:18px;}
  .gate-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .gate-tile{appearance:none; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 10px; font-size:15px; font-weight:800; cursor:pointer; box-shadow:var(--shadow);}
  .gate-tile:hover{border-color:var(--accent);}
  .gate-empty{font-size:13px; color:var(--ink-soft);}
  .pin-name{font-weight:800; font-size:16px; margin-bottom:14px;}
  .pin-dots{display:flex; justify-content:center; gap:12px; margin-bottom:20px;}
  .pin-dot{width:14px; height:14px; border-radius:50%; border:2px solid var(--line); background:var(--surface);}
  .pin-dot.filled{background:var(--accent); border-color:var(--accent);}
  .pin-dot.err{background:var(--warn); border-color:var(--warn);}
  .pin-textbox-row{display:flex; gap:8px; max-width:260px; margin:0 auto 16px;}
  .pin-textbox{flex:1; text-align:center; letter-spacing:.3em; font-size:20px; font-weight:800; padding:10px; border-radius:10px; border:1px solid var(--line); font-family:inherit;}
  .pin-textbox-row .btn{flex:0 0 auto; padding:10px 16px;}
  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto;}
  .pin-key{appearance:none; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 0; font-size:18px; font-weight:800; cursor:pointer; box-shadow:var(--shadow);}
  .pin-key.ghost{background:none; box-shadow:none; font-size:13px; font-weight:700; color:var(--ink-soft);}
  .pin-error{color:var(--warn); font-size:12.5px; font-weight:700; margin-top:10px; min-height:16px;}
  .gate-admin-link{display:block; margin:22px auto 0; background:none; border:none; color:var(--ink-soft); font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline;}

  .realisateur-bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .realisateur-bar .lbl{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-right:2px;}
  .chip{appearance:none; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:700; cursor:pointer;}
  .chip.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .client-bar{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:18px; position:relative;}
  .client-bar h2{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin:0 0 8px;}
  .client-search{display:flex; gap:8px; flex-wrap:wrap;}
  .client-search input{flex:1; min-width:180px; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-size:14px; font-family:inherit;}
  .client-search button{appearance:none; border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:10px 14px; font-weight:700; font-size:13px; cursor:pointer;}
  .client-results{position:absolute; z-index:10; left:16px; right:16px; top:100%; margin-top:4px; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); overflow:hidden;}
  .client-results button{display:block; width:100%; text-align:left; padding:10px 14px; border:none; background:none; cursor:pointer; font-size:13px; border-bottom:1px solid var(--line);}
  .client-results button:hover{background:var(--surface-2);}
  .client-card{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:10px;}
  .client-card .name{font-weight:800; font-size:15px;}
  .badge{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-soft);}
  .badge.vip{background:var(--warn-soft); color:var(--warn);}
  .client-card .meta{font-size:12px; color:var(--ink-soft);}
  .client-card .clear{margin-left:auto; background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer;}
  .client-form{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px;}
  .client-form input, .client-form select{padding:9px 10px; border-radius:8px; border:1px solid var(--line); font-size:13px; font-family:inherit;}
  .client-form .full{grid-column:1 / -1; display:flex; gap:8px;}
  /* Bloc client en deux colonnes : identité + note à gauche, alertes/habitudes
     en "bulles" bien visibles sur le côté droit (au lieu d'être tassées sous le
     pavé en petits badges). En dessous de 860px, la colonne latérale repasse en
     pleine largeur sous les informations client. */
  .client-bar-cols{display:flex; align-items:flex-start; gap:22px; margin-top:10px;}
  .client-bar-main{flex:1 1 auto; min-width:0;}
  .client-bar-main .client-card{margin-top:0;}
  .client-bar-side{flex:0 0 280px; display:flex; flex-direction:column; gap:10px;}
  @media (max-width:860px){ .client-bar-cols{flex-direction:column;} .client-bar-side{flex:1 1 auto; width:100%;} }
  .suggestions-box{display:flex; flex-direction:column; gap:10px;}
  .suggestions-alertes{display:flex; flex-direction:column; gap:8px;}
  .badge.alerte{display:flex; align-items:center; gap:8px; background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn-line); text-transform:none; letter-spacing:0; font-size:13px; font-weight:700; line-height:1.3; padding:10px 14px; border-radius:14px; white-space:normal;}
  .badge.alerte svg{flex:0 0 auto; width:15px; height:15px;}
  .suggestions-items{display:flex; flex-direction:column; gap:8px; font-size:12px;}
  .suggestions-items .lbl{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);}
  .suggestions-items .lbl svg{width:13px; height:13px; color:var(--accent);}
  .suggestion-chip{display:flex; align-items:center; gap:8px; appearance:none; text-align:left; border:1.5px solid var(--accent); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; padding:9px 14px; border-radius:14px; cursor:pointer; font-family:inherit;}
  .suggestion-chip:hover{background:var(--surface-2);}
  .suggestion-chip .plus{color:var(--accent); font-weight:800;}
  .client-form .champ-bloc{display:flex; flex-direction:column;}
  .client-form .champ-bloc input, .client-form .champ-bloc select{width:100%;}
  .mini-label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:4px; display:block;}
  .mini-label.achat{color:#946200;}
  .mini-label.vente{color:var(--success);}
  .client-note{width:100%; margin-top:8px; font-size:13px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-family:inherit; resize:vertical; min-height:44px;}

  .encaissement-grid{display:grid; grid-template-columns:1fr 340px; gap:20px; align-items:start;}
  /* Sous 800px, la grille passe en une seule colonne (le panier suit le catalogue au lieu
     d'être à côté) : le panier ne doit alors plus être "collant" (sticky), sinon il se fige
     à mi-écran pendant qu'on défile dans une longue liste de prestations -- ce qui donne
     l'impression que le défilement "répond mal" en remontant. */
  @media (max-width:800px){ .encaissement-grid{grid-template-columns:1fr;} .panier{position:static; top:auto;} }
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px;}
  .section-head h2{font-size:15px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;}
  .section-head .hint{font-size:12px; color:var(--ink-soft);}
  .cat-block + .cat-block{margin-top:22px;}
  .cat-title{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); margin-bottom:10px;}
  .tile-list{display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px;}
  .row-item{appearance:none; text-align:left; cursor:pointer; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:13px 16px; display:flex; align-items:center; justify-content:space-between; gap:14px; min-height:52px; width:100%;}
  .row-item:hover{border-color:var(--accent);}
  .row-item .row-name{font-size:14px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .row-item .row-icon{font-size:15px; flex:0 0 auto;}
  .row-item .row-price{font-size:15.5px; font-weight:800; color:var(--ink); flex:0 0 auto;}
  .row-item.forfait .row-price{color:var(--accent-2);}
  .row-tag{font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 7px; border-radius:6px; background:var(--accent-2-soft); color:var(--accent-2); flex:0 0 auto;}

  .recherche-bar{margin-bottom:16px;}
  .recherche-bar input{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); font-size:14px; font-family:inherit;}
  .recherche-bar input:focus{outline:2px solid var(--accent); outline-offset:1px;}

  /* Cases homogènes : grille à colonnes de largeur égale plutôt que des pastilles de
     largeur variable, pour que chaque catégorie (et le bouton Forfaits) occupe la même
     taille de case quel que soit le nombre de lettres dans son nom. */
  .categorie-tabs{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; margin-bottom:18px;}
  .categorie-tab{appearance:none; cursor:pointer; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:5px; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:12px 14px; min-height:72px; text-align:left;}
  .categorie-tab:hover{border-color:var(--accent);}
  .categorie-tab.active{border-color:var(--accent); background:var(--surface-2);}
  .categorie-tab .cat-label{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; align-items:center; gap:8px; font-size:13.5px; font-weight:700; color:var(--ink); line-height:1.25; max-width:100%; overflow:hidden;}
  .categorie-tab .cat-label .cat-icon{display:inline-block; margin-right:6px; vertical-align:middle; font-size:16px;}
  .categorie-tab .cat-count{font-size:12px; font-weight:500; color:var(--ink-soft);}
  /* Bouton "Forfaits" : même case, même comportement qu'un onglet de catégorie (un clic,
     affichage inline, pas de fenêtre) mais volontairement différencié visuellement -- les
     forfaits ne sont pas une catégorie comme les autres, ils traversent toutes les catégories. */
  .categorie-tab.forfaits-tab{background:var(--accent-2); border-color:var(--accent-2); color:#fff;}
  .categorie-tab.forfaits-tab .cat-label{color:#fff;}
  .categorie-tab.forfaits-tab .cat-count{color:rgba(255,255,255,.85);}
  .categorie-tab.forfaits-tab:hover{border-color:var(--accent-2); opacity:.92;}
  .categorie-tab.forfaits-tab.active{box-shadow:0 0 0 2px var(--accent-2-soft);}
  .forfaits-groupe-titre{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin:0 0 8px;}
  .forfaits-groupe + .forfaits-groupe{margin-top:18px;}

  .modal-recherche{margin:-4px 0 14px;}
  .modal-recherche input{width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); font-size:13.5px; font-family:inherit;}
  .modal-recherche input:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .modal-backdrop{position:fixed; inset:0; background:rgba(22,20,20,.45); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding:24px 16px; overflow-y:auto;}
  .modal-panel{background:var(--surface); border-radius:16px; box-shadow:var(--shadow); width:100%; max-width:760px; padding:20px; margin-top:20px;}
  .modal-panel.wide{max-width:980px;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .modal-head h2{font-size:16px; font-weight:800; margin:0;}
  .modal-sub-title{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin:0 0 10px;}
  .modal-sub-block + .modal-sub-block{margin-top:20px;}
  .extension-groupe + .extension-groupe{margin-top:14px;}
  .extension-groupe-titre{font-size:12px; font-weight:700; color:var(--ink); border-left:3px solid var(--accent-2); padding-left:8px; margin-bottom:8px;}

  .panier{position:sticky; top:150px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:12px;}
  .panier h2{font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; margin:0;}
  .panier-lines{display:flex; flex-direction:column; gap:8px; max-height:240px; overflow-y:auto;}
  .panier-empty{font-size:13px; color:var(--ink-soft);}
  .pline{display:flex; align-items:center; gap:8px; font-size:13px;}
  .pline .lwrap{flex:1; min-width:0;}
  .pline .lname{display:block;}
  .pline .lreal{display:block; font-size:11px; color:var(--ink-soft); font-weight:600;}
  .pline select.lreal-select{display:block; font-size:11px; color:var(--ink); font-weight:600; margin-top:2px; padding:2px 4px; border-radius:6px; border:1px solid var(--line); font-family:inherit; max-width:160px;}
  .pline button{appearance:none; border:1px solid var(--line); background:var(--paper); width:24px; height:24px; border-radius:7px; cursor:pointer; font-weight:800;}
  .remise-box{border:1px dashed var(--line); border-radius:10px; padding:10px; font-size:12.5px;}
  .remise-box select{width:100%; padding:7px; border-radius:8px; border:1px solid var(--line); font-family:inherit; font-size:12.5px; margin-top:6px;}
  .remise-active{display:flex; justify-content:space-between; align-items:center; background:var(--success-soft); color:var(--success); border-radius:8px; padding:6px 10px; font-weight:700; font-size:12.5px;}
  .remise-active button{background:none; border:none; color:inherit; cursor:pointer; font-weight:800;}
  .total-row{display:flex; justify-content:space-between; align-items:baseline; border-top:1px solid var(--line); padding-top:12px;}
  .total-row .label{font-size:12px; font-weight:700; text-transform:uppercase; color:var(--ink-soft);}
  .total-row .amount{font-size:26px; font-weight:900;}
  .subtotal-row{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft);}
  .pay-grid{display:grid; grid-template-columns:1fr; gap:8px;}
  .pay-btn{appearance:none; border:1px solid var(--line); background:var(--surface-2); border-radius:10px; padding:13px 6px; font-size:13.5px; font-weight:800; cursor:pointer;}
  .pay-btn:disabled{opacity:.4; cursor:not-allowed;}
  .confirm-box{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px;}
  .confirm-box .amt{font-size:22px; font-weight:900;}
  .confirm-actions{display:flex; gap:8px;}

  .admin-list{display:flex; flex-direction:column; gap:10px;}

  /* ---- statistique de caisse mensuelle (export imprimable, tient sur une page A4) ---- */
  .stat-caisse-page, .facture-page{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; max-width:760px; margin:10px 0 0;}
  .facture-page h3{margin:0 0 4px;}
  .facture-page .facture-meta{font-size:12.5px; color:var(--ink-soft); margin-bottom:14px;}
  .facture-page table{width:100%; border-collapse:collapse; margin:10px 0;}
  .facture-page th, .facture-page td{padding:7px 4px; text-align:left; border-bottom:1px solid var(--line); font-size:13px;}
  .facture-page th.num, .facture-page td.num{text-align:right;}
  .facture-page .facture-total{display:flex; justify-content:flex-end; gap:12px; font-size:16px; font-weight:800; margin-top:8px;}
  .facture-panel-form{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-top:8px;}
  .mention-badge{display:inline-block; font-size:11px; font-weight:800; letter-spacing:1px; padding:3px 10px; border-radius:20px; margin-bottom:10px;}
  .mention-badge.original{background:var(--success-soft); color:var(--success); border:1px solid var(--success);}
  .mention-badge.duplicata{background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);}
  .stat-caisse-entete{margin-bottom:10px;}
  .stat-caisse-entete h2{margin:0 0 2px; font-size:16px;}
  .stat-caisse-entete p{margin:0; color:var(--ink-soft); font-weight:700; text-transform:capitalize; font-size:12.5px;}
  /* Les deux demi-tableaux (1re/2e moitié du mois) côte à côte : coupe en deux la hauteur que
     prendrait un tableau unique de ~31 lignes, condition nécessaire pour tenir sur une page A4. */
  .stat-caisse-jours{display:flex; gap:14px; margin-bottom:12px;}
  .stat-caisse-jours .stat-caisse-table{flex:1; min-width:0;}
  .stat-caisse-table{width:100%; border-collapse:collapse; font-size:10.5px;}
  .stat-caisse-table th, .stat-caisse-table td{padding:2px 5px; text-align:right; border-bottom:1px solid var(--line);}
  .stat-caisse-table th:first-child, .stat-caisse-table td:first-child{text-align:left;}
  .stat-caisse-table th{font-size:8.5px; text-transform:uppercase; color:var(--ink-soft); font-weight:800;}
  .stat-caisse-resume h3{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; margin:0 0 6px;}
  .stat-caisse-grille{display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 16px;}
  .stat-caisse-grille div{display:flex; flex-direction:column; gap:1px; padding:4px 0; border-top:1px solid var(--line); font-size:11px;}
  .stat-caisse-grille div span{font-size:9.5px; color:var(--ink-soft); text-transform:uppercase; font-weight:700;}
  .stat-caisse-controle{margin-top:10px; padding:10px 12px; border-radius:10px; background:var(--surface-2); font-size:11px;}
  .stat-caisse-controle p{margin:0 0 4px;}
  .stat-caisse-controle p:last-child{margin-bottom:0;}
  .stat-caisse-ok{color:var(--success); font-weight:800;}
  .stat-caisse-alerte{color:var(--danger); font-weight:800;}
  .stat-caisse-controle-alerte{background:var(--danger-soft, #fde7e7); border:1px solid var(--danger);}
  @page{ size:A4; margin:10mm; }
  @media print{
    body *{visibility:hidden;}
    .stat-caisse-page, .stat-caisse-page *{visibility:visible;}
    .stat-caisse-page{position:absolute; top:0; left:0; width:190mm; box-shadow:none; border:none; padding:0; margin:0;}
    .facture-page, .facture-page *{visibility:visible;}
    .facture-page{position:absolute; top:0; left:0; width:190mm; box-shadow:none; border:none; padding:0; margin:0;}
    .no-print{display:none !important;}
  }

  .dashboard-periode{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 20px;}

  .genre-btn{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:13px; padding:8px 18px; border-radius:10px; cursor:pointer;}
  .genre-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .devis-tabs{display:flex; gap:6px; margin:2px 0 8px; flex-wrap:wrap;}
  .devis-tab{appearance:none; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; font-size:12.5px; padding:7px 12px; border-radius:9px; cursor:pointer;}
  .devis-tab.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .devis-actions{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}

  .salon-select{margin-top:12px;}
  .salon-select-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft);}
  .salon-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:6px 12px; background:var(--surface-2); border-radius:10px; padding:10px 12px;}
  .salon-check{display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; cursor:pointer;}
  /* ---- Statistiques (vue salon) : présentation façon tableau de bord Power BI existant
     -- gros chiffres colorés groupés par bandeau, barres pleines par collaborateur -- en
     gardant un code couleur à sens unique : rouge = chiffre clé du salon, bleu = comparaison
     entre collaborateurs (une magnitude, jamais un classement bon/mauvais), vert/rouge
     réservés à un écart réel (htmlDiffBadge, évolution N-1), jamais à une simple position.
     (Anciennes classes .classement-* retirées : "classement-label" entrait en collision avec
     le widget "Classement du mois" de la barre latérale -- couleur claire héritée à tort,
     d'où le texte délavé signalé sur les listes par collaborateur.) */
  .dash-kpi-band{background:var(--danger-soft); border-radius:18px; padding:18px 22px; margin:0 0 16px; display:flex; flex-wrap:wrap; gap:16px 34px;}
  .dash-kpi-band.alt{background:var(--surface-2);}
  .dash-kpi{min-width:98px;}
  .dash-kpi .v{font-size:22px; font-weight:800; color:var(--ink); line-height:1.15; font-variant-numeric:tabular-nums;}
  .dash-kpi .v.ink{color:var(--ink);}
  .dash-kpi .v.accent2{color:var(--accent-2);}
  .dash-kpi .k{font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-top:3px;}
  .dash-kpi .hint-sm{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .dash-panel{background:var(--surface-2); border-radius:18px; padding:16px 18px; margin:0 0 18px;}
  .dash-panel .dashboard-section-title{margin-top:0;}
  .dash-bar-list{display:flex; flex-direction:column; gap:10px;}
  .dash-bar-row{display:grid; grid-template-columns:132px 1fr auto; align-items:center; gap:12px;}
  .dash-bar-row .lbl{font-size:13px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dash-bar-row .track{background:var(--surface); border-radius:8px; height:26px; overflow:hidden;}
  .dash-bar-row .fill{height:100%; background:var(--accent-2); border-radius:8px; min-width:4px;}
  .dash-bar-row .val{font-size:13.5px; font-weight:800; color:var(--ink); min-width:70px; text-align:right; font-variant-numeric:tabular-nums;}
  .dash-panel .table-scroll{background:var(--surface); border-radius:12px; padding:2px 10px;}
  .dash-panel .collab-table{margin-top:0;}
  @media (max-width:520px){
    .dash-kpi-band{padding:14px 16px; gap:12px 24px;}
    .dash-kpi .v{font-size:19px;}
    .dash-bar-row{grid-template-columns:86px 1fr auto; gap:8px;}
    .dash-bar-row .lbl{font-size:11.5px;}
    .dash-bar-row .val{font-size:11.5px; min-width:54px;}

  function bornesPeriode(periode, debutPerso, finPerso){
    const maintenant = new Date();
    if (periode === "personnalise" && debutPerso && finPerso){
      const d = new Date(debutPerso + "T00:00:00");
      const f = new Date(finPerso + "T00:00:00");
      f.setDate(f.getDate() + 1);
      return {debut: d.toISOString(), fin: f.toISOString()};
    }
    const debut = new Date(maintenant);
    debut.setHours(0,0,0,0);
    if (periode === "semaine"){
      const jour = (debut.getDay() + 6) % 7; // lundi = 0
      debut.setDate(debut.getDate() - jour);
    } else if (periode === "mois"){
      debut.setDate(1);
    }
    const fin = new Date(maintenant);
    fin.setDate(fin.getDate() + 1);
    fin.setHours(0,0,0,0);
    return {debut: debut.toISOString(), fin: fin.toISOString()};
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function nomCollab(id){ const c = collaborateurs.find(x=>x.id===id); return c ? (c.prenom ? c.prenom+" "+c.nom : c.nom) : ""; }

  function panierTotal(){ return ui.panier.reduce((s,l)=>s+l.prix,0); }
  function totalPanierNet(){ return panierTotal() - remiseMontant(); }
  function remiseMontant(){
    if (!ui.remiseChoisie) return 0;
    const r = ui.remiseChoisie;
    if (ui.remisePortee === "total"){
      const st = panierTotal();
      const m = r.type === "pourcentage" ? st * r.valeur/100 : r.valeur;
      return Math.min(m, st);
    }
    if (ui.remisePortee === "prestation" && ui.remiseLigneIndex != null){
      const ligne = ui.panier[ui.remiseLigneIndex];
      if (!ligne) return 0;
      const m = r.type === "pourcentage" ? ligne.prix * r.valeur/100 : r.valeur;
      return Math.min(m, ligne.prix);
    }
    return 0;
  }

  // ---------------- devis (3 formules) & mise en attente ----------------
  // Convertit les lignes du panier (format interne UI) au format attendu par les RPC
  // (creer_ticket ET caisse_enregistrer_ticket_attente utilisent tous les deux cette forme).
  function lignesPourEnvoi(panier){
    return panier.map(l => ({nom:l.nom, prix:l.prix, collaborateur_id:l.collaborateurId || null, categorie:l.categorie || null, type_item:l.type || "prestation", produit_id:l.produitId || null}));
  }
  // Sens inverse : une ligne stockée dans tickets_attente_lignes -> une ligne de panier UI.
  // Remarque : l'id de la prestation/forfait/produit d'origine n'est volontairement pas
  // conservé (seul produit_id l'est, pour le stock) -- une remise "sur cette prestation"
  // précise peut donc ne plus apparaître comme option après reprise d'un ticket en attente ;
  // la remise sur le total, elle, reste toujours disponible.
  function ligneDepuisAttente(l){
    return { id: l.produit_id || null, nom: l.nom, prix: Number(l.prix), type: l.type_item || "prestation",
      categorie: l.categorie || null, collaborateurId: l.collaborateur_id || null, produitId: l.produit_id || null };
  }
  // Remet le panier/devis en cours à zéro (après une vente finalisée, un changement de
  // collaborateur, ou juste après une mise en attente réussie) -- sans toucher au client
  // sélectionné, exactement comme le faisait l'ancien "ui.panier = []" ponctuel.
  function reinitialiserPanierEtDevis(){
    ui.devisFormules = {1:[], 2:[], 3:[]};
    ui.panier = ui.devisFormules[1];
    ui.estDevis = false;
    ui.formuleActive = 1;
    ui.formulesLibelles = {1:"Formule 1", 2:"Formule 2", 3:"Formule 3"};
    ui.ticketAttenteId = null; ui.ticketAttenteNumero = null;
    ui.confirming = null; ui.remiseChoisie = null; ui.remisePortee = null; ui.remiseLigneIndex = null;
    ui.clientGenre = null; ui.genreManque = false;
    ui.choixMoyen = false; ui.carteCadeauPaiement = null; ui.carteCadeauAppliquee = null;
    ui.depotApplique = null; ui.depotPickerOuvert = false;
  }
  // Passe le ticket en cours en mode devis (3 formules proposées au client) : la formule 1
  // garde le contenu déjà présent dans le panier, les formules 2/3 démarrent vides.
  function demarrerDevis(){
    if (ui.estDevis || ui.confirming || ui.choixMoyen) return;
    ui.estDevis = true;
    ui.formuleActive = 1;
    ui.panier = ui.devisFormules[1];
    renderPanier();
  }
  // Revient à un ticket simple : les formules 2/3 (non retenues) sont abandonnées.
  function annulerModeDevis(){
    if (!ui.estDevis || ui.confirming || ui.choixMoyen) return;
    const f1 = ui.devisFormules[1];
    ui.devisFormules = {1:f1, 2:[], 3:[]};
    ui.estDevis = false;
    ui.formuleActive = 1;
    ui.panier = f1;
    renderPanier();
  }
  function activerFormuleDevis(formule){
    if (!ui.estDevis || ui.confirming || ui.choixMoyen) return;
    if (!ui.devisFormules[formule]) return;
    ui.formuleActive = formule;
    ui.panier = ui.devisFormules[formule];
    ui.remiseChoisie = null; ui.remisePortee = null; ui.remiseLigneIndex = null;
    renderPanier();
  }
  // Met le ticket/devis en cours en attente (nouveau, ou mise à jour d'un ticket déjà en
  // attente en cours de reprise) puis libère l'écran pour le client suivant -- c'est tout
  // l'intérêt de la fonctionnalité : pouvoir enchaîner sans perdre le travail en cours.
  async function mettreEnAttente(){
    if (ui.attenteEnCours || ui.confirming || ui.choixMoyen) return;
    const maxFormule = ui.estDevis ? 3 : 1;
    const formules = [];
    for (let f = 1; f <= maxFormule; f++){
      const lignes = ui.devisFormules[f] || [];
      formules.push({ formule:f, libelle: ui.estDevis ? (ui.formulesLibelles[f] || ("Formule " + f)) : null, lignes: lignesPourEnvoi(lignes) });
    }
    if (!formules.some(f => f.lignes.length > 0)){
      ui.attenteMsg = "Ajoute au moins une prestation avant de mettre en attente."; ui.attenteMsgErr = true; renderPanier(); return;
    }
    ui.attenteEnCours = true; ui.attenteMsg = ""; renderPanier();
    try{
      const { data, error } = await supa.rpc("caisse_enregistrer_ticket_attente", {
        p_id: ui.ticketAttenteId,
        p_salon_id: salon.id,
        p_client_id: ui.clientSelectionne ? ui.clientSelectionne.id : null,
        p_collaborateur_id: ui.collaborateurConnecte.id,
        p_est_devis: ui.estDevis,
        p_formules: formules
      });
      if (error) throw error;
      ui.attenteEnCours = false;
      reinitialiserPanierEtDevis();
      deselectionnerClient();
      ui.attenteToast = "Ticket mis en attente. Retrouve-le dans « Devis & tickets en attente » sur l'Accueil.";
      await chargerTicketsAttente();
      render();
    }catch(err){
      ui.attenteEnCours = false;
      ui.attenteMsg = "Erreur : " + (err.message || err); ui.attenteMsgErr = true;
      renderPanier();
    }
  }
  // Recharge la liste des devis/tickets en attente du salon (alimente la carte Accueil).
  async function chargerTicketsAttente(){
    if (!salon) return;
    ui.ticketsAttenteChargement = true;
    try{
      const { data, error } = await supa.rpc("caisse_lister_tickets_attente", {p_salon_id: salon.id});
      if (error) throw error;
      ui.ticketsAttente = data || [];
    }catch(err){ /* silencieux, comme les autres chargements de l'Accueil */ }
    ui.ticketsAttenteChargement = false;
  }
  // Recharge un ticket en attente/devis dans l'encaissement, exactement comme il a été laissé.
  async function reprendreTicketAttente(id){
    try{
      const { data, error } = await supa.rpc("caisse_charger_ticket_attente", {p_id: id});
      if (error) throw error;
      if (!data){
        ui.attenteMsg = "Ce ticket en attente n'existe plus (déjà repris ou annulé ailleurs)."; ui.attenteMsgErr = true;
        await chargerTicketsAttente(); render(); return;
      }
      reinitialiserPanierEtDevis();
      ui.ticketAttenteId = data.id;
      ui.ticketAttenteNumero = data.numero;
      ui.estDevis = !!data.est_devis;
      const libelles = data.formules_libelles || {};
      ui.formulesLibelles = {
        1: libelles["1"] || "Formule 1", 2: libelles["2"] || "Formule 2", 3: libelles["3"] || "Formule 3"
      };
      (data.formules || []).forEach(f => { ui.devisFormules[f.formule] = (f.lignes || []).map(ligneDepuisAttente); });
      ui.formuleActive = 1;
      ui.panier = ui.devisFormules[1];
      ui.salonSection = "caisse"; ui.tab = "encaissement";
      if (data.client_id){
        const { data: cli } = await supa.from("clients").select("*").eq("id", data.client_id).limit(1);
        if (cli && cli[0]) await selectionnerClient(cli[0]); else deselectionnerClient();
      } else {
        deselectionnerClient();
      }
      render();
    }catch(err){
      ui.attenteMsg = "Erreur : " + (err.message || err); ui.attenteMsgErr = true;
      render();
    }
  }

  // ---------------- boot ----------------
  async function boot(){
    if (!window.supabase){
      // Les librairies externes (Supabase, xlsx) sont chargées en "defer" depuis un CDN : sur un
      // réseau qui bloque/ralentit fortement cdn.jsdelivr.net (bloqueur de pub, wifi filtrant,
      // etc.), window.supabase peut manquer même quand la page elle-même s'est bien affichée.
      // Message dédié (plutôt que "configuration manquante", trompeur ici) + bouton pour réessayer.
      showStatus("err", "Impossible de charger les librairies nécessaires (cdn.jsdelivr.net). Vérifie la connexion ou un éventuel bloqueur de contenu, puis réessaie.");
      return;
    }
    if (SUPABASE_URL.indexOf("COLLER_ICI") === 0 || SUPABASE_ANON_KEY.indexOf("COLLER_ICI") === 0){
      showStatus("err", "Configuration manquante : renseigne SUPABASE_URL et SUPABASE_ANON_KEY en haut du fichier index.html.");
      return;
    }
    // Affiché tout de suite, avant le moindre appel réseau : sur une connexion lente, l'écran
    // ne doit jamais rester silencieux entre l'en-tête (statique) et les données -- un silence
    // total est ce qui donne l'impression d'un gel, même quand tout se charge normalement.
    showStatus("chargement", "Connexion à Supabase…");
    supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Numéro de version affiché en pied de page (conforme Partie 9 §4.3.4/§4.4.1.8 du
    // référentiel NF525 : la version du logiciel doit être identifiable par le client).
    // Volontairement non bloquant : un souci réseau ici ne doit jamais retarder le boot.
    (async function afficherVersionAaros(){
      try{
        const { data, error } = await supa.rpc("version_courante_aaros");
        if (error || !data || !data.length) return;
        const v = data[0];
        const pied = document.getElementById("piedVersion");
        if (pied) pied.textContent = "Groupe Just Hair — SEA HAIR. — AAROS " + v.numero_version;
      }catch(e){ /* silencieux : affichage non essentiel au fonctionnement de la caisse */ }
    })();

    // Paramétrage générique (secteur d'activité) : libellés de rôles et seuils de relance
    // propres à ce client, s'ils ont été configurés (patch généricité secteur). Volontairement
    // non bloquant et silencieux en cas d'échec -- sur un client qui n'a pas encore ce patch,
    // l'app continue avec les valeurs par défaut (coiffure) définies plus haut.
    (async function chargerParametresGeneriques(){
      try{
        const { data, error } = await supa.from("parametres_entreprise").select("*").limit(1);
        if (!error && data && data.length){
          const p = data[0];
          ROLE_LABELS = {
            collaborateur: p.libelle_role_collaborateur || ROLE_LABELS.collaborateur,
            responsable: p.libelle_role_responsable || ROLE_LABELS.responsable,
            direction: p.libelle_role_direction || ROLE_LABELS.direction
          };
        }
      }catch(e){ /* silencieux */ }
      try{
        const { data, error } = await supa.from("categories_relance").select("categorie,seuil_jours").eq("actif", true);
        if (!error && data && data.length){
          const seuils = {};
          data.forEach(r => { seuils[r.categorie] = r.seuil_jours; });
          SEUILS_RELANCE_JOURS = seuils;
        }
      }catch(e){ /* silencieux */ }
    })();

    let salonIdLocal = null;
    try{ salonIdLocal = window.localStorage.getItem(CLE_SALON_LOCAL); }catch(e){ /* stockage indisponible, on repart sur la configuration */ }

    if (salonIdLocal){
      try{
        const { data, error } = await avecDelaiMax(supa.from("salons").select("*").eq("id", salonIdLocal).limit(1));
        if (error) throw error;
        if (data && data.length) salon = data[0];
      }catch(err){
        showStatus("err", "Erreur de connexion Supabase : " + (err.message || err));
        return;
      }
      if (!salon){
        // le salon enregistré sur cet appareil n'existe plus (supprimé) -> on repasse par la configuration
        try{ window.localStorage.removeItem(CLE_SALON_LOCAL); }catch(e){}
      }
    }

    if (!salon){
      await chargerListeSalonsPoste();
      render();
      return;
    }

    await chargerDonneesSalon();
    render();
  }

  // Recharge la liste de tous les salons pour l'écran de configuration du poste
  // (choix initial, ou après une réinitialisation depuis le back-office).
  async function chargerListeSalonsPoste(){
    try{
      const { data, error } = await avecDelaiMax(supa.from("salons").select("id,nom,ville").order("nom"));
      if (error) throw error;
      ui.posteConfig.salons = data || [];
      const el = document.getElementById("status-zone");
      if (el) el.innerHTML = "";
    }catch(err){
      showStatus("err", "Erreur de connexion Supabase : " + (err.message || err));

  // Charge tout ce qui dépend du salon une fois qu'il est connu (au boot, ou juste après
  // la configuration du poste). Séparé de boot() pour pouvoir être rappelé sans recharger la page.
  async function chargerDonneesSalon(){
    const badge = document.getElementById("salon-nom");
    if (badge){ badge.textContent = salon.nom; badge.style.setProperty("--salon-color", couleurCategorie(salon.nom)); }

    try{
      // Catalogue et tickets/clôtures repartent en DEUX phases séparées (et non plus fusionnées
      // dans un seul Promise.all) : sur une connexion mobile limitée en débit (pas seulement en
      // latence), faire partir les 7 requêtes en même temps les fait toutes ramer ensemble --
      // Enzo a confirmé un chargement très long sur téléphone avec la version fusionnée. Deux
      // phases plus légères, chacune avec sa propre marge de 25s (contre 15s avant -- un salon
      // avec beaucoup d'historique de tickets peut légitimement dépasser 15s sur un réseau
      // mobile lent), profitent mieux de la bande passante disponible que 7 requêtes en concurrence.
      showStatus("chargement", "Chargement du catalogue…");
      const [{data: prest, error: e3}, {data: rem, error: e4}, {data: collabs, error: e5}, {data: forf, error: e6}, {data: prod, error: e7}] = await avecDelaiMax(Promise.all([
        supa.rpc("lister_catalogue", {p_salon_id: salon.id}),
        supa.rpc("lister_remises_actives", {p_salon_id: salon.id}),
        supa.rpc("lister_collaborateurs", {p_salon_id: salon.id}),
        supa.rpc("lister_forfaits_actifs", {p_salon_id: salon.id}),
        supa.rpc("lister_produits_actifs", {p_salon_id: salon.id})
      ]), 25000);
      if (e3) throw e3;
      if (e4) throw e4;
      if (e5) throw e5;
      if (e6) throw e6;
      if (e7) throw e7;
      catalogue = prest || [];
      remisesDispo = rem || [];
      collaborateurs = collabs || [];
      forfaitsCatalogue = forf || [];
      produitsCatalogue = prod || [];

      showStatus("chargement", "Chargement des tickets du jour…");
      await avecDelaiMax(chargerJournalPourDate(fmtDateInput(new Date())), 25000);
      showStatus("ok", "Connecté à Supabase.");
    }catch(err){
      showStatus("err", "Erreur de connexion Supabase : " + (err.message || err));
    }
    // L'Accueil est désormais la toute première page (avant même de choisir qui encaisse) :
    // on précharge ses données dès que le salon est connu, sans bloquer le reste du boot.
    Promise.all([chargerAccueilKpis(), chargerAdminStock(), chargerTicketsAttente()]).then(renderSalonSection);
    chargerClassements();
    // Rafraîchi régulièrement pour rester "temps réel" (une vente faite sur un autre poste du
    // même salon, ou dans un autre salon, doit finir par se refléter même sans action locale).
    // Un seul intervalle par salon chargé : chargerDonneesSalon() n'est rappelée qu'au changement
    // de salon sur ce poste, donc pas de risque d'empiler plusieurs minuteurs.
    if (classementIntervalId) clearInterval(classementIntervalId);
    classementIntervalId = setInterval(chargerClassements, 3 * 60 * 1000);
  }
  // produitsCatalogue (utilisé à la fois par la page salon "Produits" ET par le sélecteur de
  // produits de l'encaissement) n'était chargé qu'une seule fois, au boot du salon : si un produit
  // était lié/délié d'un salon (via le back-office, un import, ou l'outil d'affectation en masse)
  // pendant que l'app restait ouverte, "Produits" et la Caisse continuaient d'afficher l'ancienne
  // photo, alors que la page Stock (rechargée à chaque visite) reflétait déjà l'état réel — d'où
  // l'impression trompeuse qu'un même produit "existe" à un endroit et pas à l'autre. On recharge
  // donc ce catalogue à chaque fois qu'on revient sur "Produits" ou qu'on ouvre la Caisse, comme
  // c'est déjà le cas pour Stock/Accueil/Statistiques.
  async function rafraichirProduitsCatalogue(){
    try{
      const { data, error } = await supa.rpc("lister_produits_actifs", {p_salon_id: salon.id});
      if (!error) produitsCatalogue = data || [];
    }catch(err){ /* silencieux : on garde la dernière version connue plutôt que de bloquer l'écran */ }
  }

  // Charge le Journal & clôture pour UNE journée précise : "aujourd'hui" garde le
  // comportement historique (les fiches encore en attente de clôture, quel que soit leur
  // jour réel -- rien ne se perd si une clôture a été oubliée), tout autre jour interroge
  // directement les fiches de cette date (clôturées ou non) pour consultation/correction.
  // L'historique des clôtures est lui aussi filtré sur cette même journée (fini le "tout à
  // la suite").
  // Fiches à afficher pour le jour sélectionné dans le Journal.
  // - Un jour passé : toutes les fiches datées de ce jour-là (quel que soit leur état de clôture).
  // - Aujourd'hui : toutes les fiches encore ouvertes (même laissées ouvertes depuis un jour
  //   précédent -- comportement historique, à ne pas casser) ET toutes les fiches datées
  //   d'aujourd'hui même déjà rattachées à une clôture (plusieurs clôtures peuvent avoir eu
  //   lieu dans la même journée : sans ça, leurs fiches redeviennent invisibles et
  //   inaccessibles dès qu'on les clôture).
  // Version générique du merge ci-dessus, réutilisée pour les dépenses de caisse (même
  // logique exacte : ouvertes + celles du jour, quel que soit leur état de clôture).
  async function lignesDuJourAffiche(table, select, estAuj, debutJour, finJour, orderCol){
    if (!estAuj){
      const { data, error } = await supa.from(table).select(select).eq("salon_id", salon.id)
        .gte("horodatage", debutJour.toISOString()).lt("horodatage", finJour.toISOString()).order(orderCol);
      if (error) throw error;
      return data || [];
    }
    const [{data: ouvertes, error: eo}, {data: duJour, error: ej}] = await Promise.all([
      supa.from(table).select(select).eq("salon_id", salon.id).is("cloture_id", null).order(orderCol),
      supa.from(table).select(select).eq("salon_id", salon.id)
        .gte("horodatage", debutJour.toISOString()).lt("horodatage", finJour.toISOString()).order(orderCol)
    ]);
    if (eo) throw eo;
    if (ej) throw ej;
    const parId = {};
    (ouvertes || []).concat(duJour || []).forEach(r => { parId[r.id] = r; });
    return Object.values(parId);
  }

  async function ticketsDuJourAffiche(estAuj, debutJour, finJour){
    const rows = await lignesDuJourAffiche("tickets", "*, lignes_ticket(*), factures(*)", estAuj, debutJour, finJour, "numero");
    return rows.sort((a, b) => a.numero - b.numero);
  }
  async function depensesDuJourAffiche(estAuj, debutJour, finJour){
    const rows = await lignesDuJourAffiche("depenses_caisse", "*", estAuj, debutJour, finJour, "horodatage");
    return rows.sort((a, b) => new Date(a.horodatage) - new Date(b.horodatage));
  }

  async function chargerJournalPourDate(date){
    const estAuj = (date === fmtDateInput(new Date()));
    const debutJour = new Date(date + "T00:00:00");
    const finJour = new Date(debutJour); finJour.setDate(finJour.getDate() + 1);

    const [tj, dj, {data: hc, error: e2}, {data: tfj, error: e3}] = await Promise.all([
      ticketsDuJourAffiche(estAuj, debutJour, finJour),
      depensesDuJourAffiche(estAuj, debutJour, finJour),
      supa.from("clotures").select("*").eq("salon_id", salon.id)
        .gte("horodatage", debutJour.toISOString()).lt("horodatage", finJour.toISOString())
        .order("horodatage", {ascending:false}),
      // Tickets de formation : jamais chaînés à la clôture (voir supabase-patch-fonction-ecole),
      // on les récupère juste sur la plage horaire du jour consulté, pour les afficher à part.
      supa.from("tickets_formation").select("*, lignes_formation(*)").eq("salon_id", salon.id)
        .gte("horodatage", debutJour.toISOString()).lt("horodatage", finJour.toISOString())
        .order("numero"),
      // Arrhes/acomptes ouverts : pas limités à ce jour (pris parfois des semaines avant), mais
      // rechargés ici pour rester à jour chaque fois que le Journal se rafraîchit.
      chargerDepotsOuverts()
    ]);
    if (e2) throw e2;
    if (e3) throw e3;
    ui.journalDate = date;
    ticketsJour = tj || [];
    depensesJour = dj || [];
    historiqueClotures = hc || [];
    ticketsFormationJour = tfj || [];

    if (ticketsJour.length > 0){
      const { data: mods } = await supa.from("historique_modifications_ticket").select("*").in("ticket_id", ticketsJour.map(t => t.id));
      const parTicket = {};
      (mods || []).forEach(m => { (parTicket[m.ticket_id] = parTicket[m.ticket_id] || []).push(m); });
      ticketsJour.forEach(tk => { tk.modifications = parTicket[tk.id] || []; });
    }
  }

  function showStatus(kind, msg){
    const el = document.getElementById("status-zone");
    if (kind === "chargement"){
      el.innerHTML = '<div class="status-banner loading"><span class="status-spin"></span>' + escapeHtml(msg) + '</div>';
      return;
    }
    el.innerHTML = '<div class="status-banner ' + (kind === "ok" ? "ok" : "err") + '">' +
      (kind === "ok" ? "✓ " : "⚠ ") + escapeHtml(msg) +
      (kind === "ok" ? "" : ' <button type="button" class="btn ghost sm" id="status-retry" style="margin-left:8px;">↻ Réessayer</button>') +
      '</div>';
    if (kind === "ok") setTimeout(() => { if (el.firstChild) el.innerHTML = ""; }, 3000);
    const retry = document.getElementById("status-retry");
    if (retry) retry.addEventListener("click", () => window.location.reload());
  }
  // Sur un réseau mobile lent/instable, un fetch qui ne répond jamais (ni succès ni erreur)
  // laissait l'écran figé indéfiniment sur l'en-tête, sans aucun message -- ceci transforme un
  // silence réseau trop long en une erreur explicite (avec bouton "Réessayer") plutôt qu'un gel
  // silencieux difficile à distinguer d'un bug.
  function avecDelaiMax(promesse, ms){
    ms = ms || 15000;
    let minuteur;
    const delaiDepasse = new Promise((_, reject) => {
      minuteur = setTimeout(() => reject(new Error("La connexion met trop de temps à répondre (réseau lent ou indisponible).")), ms);
    });
    return Promise.race([promesse, delaiDepasse]).finally(() => clearTimeout(minuteur));
  }

  // rend soit un input texte libre (ex: marque), soit une liste déroulante de catégories connues
  // + une option "Nouvelle catégorie…" qui révèle un champ texte, pour éviter les fautes de saisie.
  function htmlChampExtra(c, nom, valeurActuelle){
    if (!c.champExtraListe){
      return '<input type="text" ' + nom + '="' + (nom === "id" ? "cat-extra" : "cat-edit-extra") + '" value="' + escapeHtml(valeurActuelle || "") + '" placeholder="' + c.champExtraPlaceholder + '">';
    }
    const idBase = nom === "id" ? "cat-extra" : "cat-edit-extra";
    const attrSel = nom + '="' + idBase + '"';
    const attrTxt = nom + '="' + idBase + '-nouvelle"';
    const cats = categoriesConnues();
    let html = '<select ' + attrSel + '>';
    html += '<option value=""' + (!valeurActuelle ? ' selected' : '') + '>— Choisir une catégorie —</option>';
    cats.forEach(cat => { html += '<option value="' + escapeHtml(cat) + '"' + (cat === valeurActuelle ? ' selected' : '') + '>' + escapeHtml(cat) + '</option>'; });
    html += '<option value="__nouvelle__">+ Nouvelle catégorie…</option>';
    html += '</select>';
    html += '<input type="text" ' + attrTxt + ' placeholder="Nom de la nouvelle catégorie" hidden>';
    return html;
  }

  async function importerCatalogueExcel(cle, file){
    const c = CATALOGUES[cle];
    const rpc = rpcCatalogue(cle);
    let salonId = null;
    if (!c.prixGlobal){
      const salonSel = document.getElementById("cat-io-salon");
      salonId = salonSel ? salonSel.value : null;
      if (!salonId){ ui.catalogueImportMsg = "Choisis un salon."; ui.catalogueImportMsgErr = true; renderAdminEquipe(); return; }
    }
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      if (rows.length === 0) throw new Error("Fichier vide.");
      const lignes = rows.map(r => {
        let code = "", prix = null, dispo = true;
        Object.keys(r).forEach(k => {
          const nk = normKey(k);
          if (nk === "code") code = String(r[k]).trim();
          else if (nk === "prix") prix = parseFloat(String(r[k]).replace(",", "."));
          else if (nk === "disponible"){
            const v = normKey(r[k]);
            dispo = !(v === "non" || v === "false" || v === "0" || v === "faux");
          }
        });
        return {code: code, prix: prix, disponible: dispo};
      }).filter(l => l.code && !isNaN(l.prix));
      if (lignes.length === 0) throw new Error("Aucune ligne exploitable (colonnes Code/Prix introuvables ou vides).");
      const rpcArgs = c.prixGlobal ? {p_lignes: lignes} : {p_salon_id: salonId, p_lignes: lignes};
      const { data, error } = await supa.rpc(rpc.importerPrix, rpcArgs);
      if (error) throw error;
      const manquants = (data && data[0] && data[0].codes_non_trouves) || [];
      if (manquants.length){
        ui.catalogueImportMsg = lignes.length + " ligne(s) traitée(s). Codes non reconnus : " + manquants.join(", ");
        ui.catalogueImportMsgErr = true;
      } else {
        ui.catalogueImportMsg = lignes.length + " tarif(s) mis à jour pour ce salon.";
        ui.catalogueImportMsgErr = false;
      }
      await chargerAdminCatalogue(cle);
    }catch(err){
      ui.catalogueImportMsg = "Erreur import : " + (err.message || err); ui.catalogueImportMsgErr = true;
    }
    const fileInput = document.getElementById("cat-import-file"); if (fileInput) fileInput.value = "";
    renderAdminEquipe();
  }

  // ---------------- assistant devis : analyse de consommation du client ----------------
  // Première version volontairement "à règles" (pas d'IA générative) : entièrement calculée
  // côté client depuis l'historique déjà en base (tickets + lignes_ticket, comme la fiche
  // client), sans appel réseau supplémentaire, sans coût, et sans envoyer aucune donnée client
  // à un service externe. Seuils de relance par catégorie -- valeurs par défaut (coiffure),
  // écrasées au démarrage par categories_relance si la table existe (patch généricité secteur).
  let SEUILS_RELANCE_JOURS = { "Couleur": 42, "Mèches / Balayage": 56, "Soins": 56 };
  function formatDureeJours(jours){
    if (jours >= 60) return Math.floor(jours / 30) + " mois";
    if (jours >= 14) return Math.floor(jours / 7) + " semaines";
    return jours + " jour" + (jours > 1 ? "s" : "");
  }
  function analyserClient(historique, genre){
    const actifs = (historique || []).filter(t => !t.annule);
    const maintenant = new Date();
    const derniereParCategorie = {};
    const compteParPrestation = {};
    const compteParProduit = {};
    actifs.forEach(t => {
      (t.lignes_ticket || []).forEach(l => {
        if (l.categorie){
          if (!derniereParCategorie[l.categorie] || new Date(t.horodatage) > new Date(derniereParCategorie[l.categorie])){
            derniereParCategorie[l.categorie] = t.horodatage;
          }
        }
        if (l.type_item === "prestation" || l.type_item === "forfait"){
          const e = compteParPrestation[l.nom_prestation] || { nom:l.nom_prestation, count:0 };
          e.count++; compteParPrestation[l.nom_prestation] = e;
        } else if (l.type_item === "produit"){
          const e = compteParProduit[l.nom_prestation] || { nom:l.nom_prestation, count:0 };
          e.count++; compteParProduit[l.nom_prestation] = e;
        }
      });
    });

    // Alertes de relance (couleur / mèches-balayage / soins) : pour le moment réservées aux
    // clientes (genre "femme") -- pas encore de préconisation définie pour les clients hommes,
    // à construire plus tard si besoin. Le texte utilise "Elle" explicitement plutôt qu'une
    // formulation neutre, maintenant que l'alerte est toujours au féminin.
    const alertes = [];
    if (genre === "femme"){
      Object.keys(SEUILS_RELANCE_JOURS).forEach(cat => {
        const derniere = derniereParCategorie[cat];
        if (!derniere){
          // pas d'alerte "jamais essayé" pour un tout nouveau client : seulement s'il est
          // déjà venu plusieurs fois sans jamais avoir pris cette catégorie.
          if (actifs.length >= 2) alertes.push({ categorie:cat, texte:"Elle n'a jamais pris de " + cat.toLowerCase() + "." });
          return;
        }
        const jours = Math.floor((maintenant - new Date(derniere)) / 86400000);
        if (jours >= SEUILS_RELANCE_JOURS[cat]){
          alertes.push({ categorie:cat, texte:"Elle n'a pas pris de " + cat.toLowerCase() + " depuis " + formatDureeJours(jours) + "." });
        }
      });
    }

    return {
      nbVisites: actifs.length,
      alertes,
      prestationsFavorites: Object.values(compteParPrestation).sort((a,b) => b.count - a.count).slice(0,3),
      produitsFavoris: Object.values(compteParProduit).sort((a,b) => b.count - a.count).slice(0,3)
    };
  }
  // Recoupe les favoris/habitudes du client avec le catalogue réellement disponible dans CE
  // salon (prix à jour) -- un favori qui n'existe plus ou plus dans ce salon n'est pas proposé.
  function suggestionsPourFormule(){
    if (!ui.clientAnalyse) return [];
    const dispoPrestations = catalogueTout();
    const sugg = [];
    ui.clientAnalyse.prestationsFavorites.forEach(f => {
      const item = dispoPrestations.find(d => d.nom === f.nom);
      if (item && !sugg.some(s => s.nom === item.nom)) sugg.push(item);
    });
    ui.clientAnalyse.produitsFavoris.forEach(f => {
      const item = produitsCatalogue.find(d => d.nom === f.nom);
      if (item && !sugg.some(s => s.nom === item.nom)) sugg.push(Object.assign({type:"produit"}, item));
    });
    return sugg;
  }

    if (!ui.ficheEditGenre){ ui.ficheMsg = "Précise si le client est une femme ou un homme."; ui.ficheMsgErr = true; renderFicheClient(); return; }
    const maj = {

      refuse_sms: document.getElementById("fiche-refuse-sms").checked,

    if (error){ ui.ficheMsg = "Erreur : " + (error.message || error); ui.ficheMsgErr = true; renderFicheClient(); return; }
    const updated = (data && data[0]) || Object.assign({}, c, maj);

    // si c'est le client rattaché à la vente en cours, on garde l'encaissement synchronisé

  async function creerClientTab(nom, prenom, telephone, genre){

    const { data, error } = await supa.from("clients").insert({nom, prenom, telephone, categorie:"classique", genre}).select().limit(1);

  // ---------------- onglet Clients : indicateurs + liste (RPC compter_clients_stats / lister_clients_stats) ----------------
  const CLIENTS_FILTRES = [
    ["tous", "Tous"], ["nouveaux", "Nouveaux"], ["vip", "VIP"], ["vip_expire", "Carte VIP à renouveler"],
    ["reactiver", "À réactiver"], ["anniversaires", "Anniversaires"], ["meilleurs", "Meilleurs clients"]
  ];
  // Statut VIP calculé à la volée depuis carte_vip_achat_le (jamais depuis l'ancien champ
  // categorie, désormais vestigial) : la carte est valable exactement 1 an à partir de sa
  // date d'achat. Centralise ce calcul ici pour qu'il soit identique partout (liste clients,
  // badge client de l'encaissement, fiche client).
  function clientVipInfo(c){
    const dateAchat = c && c.carte_vip_achat_le;
    if (!dateAchat) return { dateAchat:null, dateExpiration:null, actif:false, expiree:false };
    const expiration = new Date(dateAchat + "T00:00:00");
    expiration.setFullYear(expiration.getFullYear() + 1);
    const actif = expiration >= new Date();
    return { dateAchat: dateAchat, dateExpiration: expiration.toISOString().slice(0,10), actif: actif, expiree: !actif };
  }

  async function chargerClientsStats(){
    ui.clientsListe.statsChargement = true;
    try{
      const { data, error } = await supa.rpc("compter_clients_stats", {});
      if (error) throw error;
      ui.clientsListe.stats = (data && data[0]) || null;

  async function chargerClientsListe(){
    const cl = ui.clientsListe;
    cl.chargement = true;
    if (ui.tab === "client") renderClientTab();
    try{
      const { data, error } = await supa.rpc("lister_clients_stats", {
        p_recherche: cl.recherche.trim() || null,
        p_filtre: cl.filtre,
        p_limite: cl.parPage,
        p_offset: cl.page * cl.parPage
      });
      if (error) throw error;
      cl.items = data || [];
      cl.totalCount = (cl.items.length && cl.items[0].total_count != null) ? Number(cl.items[0].total_count) : 0;
    }catch(err){
      cl.items = []; cl.totalCount = 0;
    }
    cl.chargement = false;
    if (ui.tab === "client") renderClientTab();
  }
  function changerFiltreClientsListe(cle){
    const cl = ui.clientsListe;
    if (cl.filtre === cle) return;
    cl.filtre = cle; cl.page = 0;
    chargerClientsListe();
  }
  function changerPageClientsListe(delta){
    const cl = ui.clientsListe;
    const nbPages = Math.max(1, Math.ceil(cl.totalCount / cl.parPage));
    const next = Math.min(Math.max(cl.page + delta, 0), nbPages - 1);
    if (next === cl.page) return;
    cl.page = next;
    chargerClientsListe();
  }
  // Statut affiché en liste : priorité à ce qui demande une action (réactivation, puis carte
  // VIP expirée à renouveler), puis VIP actif, puis nouveauté ; sinon "Fidèle" par défaut
  // (client déjà venu, sans alerte).
  function statutClientListe(c){
    const seuil = new Date(); seuil.setMonth(seuil.getMonth() - 6);
    const debutMois = new Date(); debutMois.setDate(1); debutMois.setHours(0,0,0,0);
    const aReactiver = c.dernier_passage ? (new Date(c.dernier_passage) < seuil) : (new Date(c.created_at) < seuil);
    if (aReactiver) return { cle:"reactiver", label:"À réactiver", classe:"faible" };
    const vip = clientVipInfo(c);
    if (vip.expiree) return { cle:"vip_expire", label:"Carte VIP à renouveler", classe:"faible" };
    if (vip.actif) return { cle:"vip", label:"VIP", classe:"vip" };
    if (new Date(c.created_at) >= debutMois) return { cle:"nouveau", label:"Nouvelle", classe:"nouveau" };
    return { cle:"fidele", label:"Fidèle", classe:"ok" };
  }

    if (!cp) return;
    const code = (cp.code || "").trim();
    if (!code){ cp.erreur = "Merci de saisir un code."; renderPanier(); return; }
    cp.erreur = null;
    try{
      const { data, error } = await supa.rpc("verifier_carte_cadeau_paiement", { p_salon_id: salon.id, p_code: code });
      if (error) throw error;
      const carte = (data && data[0]) || null;
      if (!carte){
        cp.erreur = "Carte introuvable, déjà utilisée entièrement, ou non valable dans ce salon.";
        renderPanier();
        return;
      }
      const total = totalPanierNet();
      cp.info = carte;
      cp.montant = Math.min(Number(carte.solde), total).toFixed(2);
      cp.etape = "montant";
    }catch(err){
      cp.erreur = err.message || String(err);
    }
    renderPanier();
  }
  function validerMontantCarteCadeauPaiement(){
    const cp = ui.carteCadeauPaiement;
    if (!cp || !cp.info) return;
    const total = totalPanierNet();
    const montant = Number(String(cp.montant).replace(",", "."));
    if (!(montant > 0)){ cp.erreur = "Le montant doit être supérieur à 0."; renderPanier(); return; }
    if (montant > Number(cp.info.solde) + 0.001){ cp.erreur = "Ce montant dépasse le solde de la carte."; renderPanier(); return; }
    if (montant > total + 0.001){ cp.erreur = "Ce montant dépasse le total du ticket."; renderPanier(); return; }
    ui.carteCadeauAppliquee = { id: cp.info.id, code: cp.info.code, montant: Number(montant.toFixed(2)) };
    ui.carteCadeauPaiement = null;
    if (montant >= total - 0.001){
      ui.confirming = "carte_cadeau";
      ui.choixMoyen = false;
    }
    render();
  }

  // Traduit un message d'erreur technique (ex. échec de l'appel de signature NF525, HTTP, réseau)
  // en message compréhensible pour le caissier -- voir supabase-patch-resilience-signature-nf525.sql.
  // Les erreurs métier (stock insuffisant, solde carte cadeau...) restent affichées telles quelles :
  // elles sont déjà rédigées pour l'écran de caisse, pas besoin de les reformuler.
  function messageErreurEncaissement(raw){
    const msg = raw || "";
    if (/signature électronique|signature JET|HTTP \d|http_request|extensions\.http/i.test(msg)){
      return "Problème de connexion avec le service de sécurisation des ventes. Réessayez dans un instant — si ça persiste, contactez le bureau.";
    }
    return msg;
  }

  // Ticket réduit d'un dépôt déjà encaissé : circuit séparé (creer_ticket_avec_depot), limité
  // aux prestations/forfaits, sans remise ni carte cadeau -- voir supabase-patch-arrhes-acomptes.sql.
  async function confirmPaymentAvecDepot(){
    const mode = ui.confirming;
    const depot = ui.depotApplique;
    if (!mode || !depot) return;
    const lignes = lignesPourEnvoi(ui.panier);
    try{
      const { data, error } = await supa.rpc("creer_ticket_avec_depot", {
        p_salon_id: salon.id,
        p_depot_id: depot.id,
        p_client_id: ui.clientSelectionne ? ui.clientSelectionne.id : null,
        p_lignes: lignes,
        p_moyen_paiement: mode,
        p_collaborateur_encaissant_id: ui.collaborateurConnecte.id,
        p_remise_id: null,
        p_montant_remise: 0,
        p_client_genre: ui.clientGenre
      });
      if (error) throw error;
      ui.lastReceipt = data;
      ui.lastError = null;
      ui.depotApplique = null;
      reinitialiserPanierEtDevis();
      // Remis à zéro tout de suite (pas seulement à la fermeture du reçu) : le catalogue reste
      // cliquable derrière le reçu, personne ne doit pouvoir ajouter une prestation à la vente
      // suivante sans re-choisir explicitement qui l'a réalisée.
      ui.prestataireActifId = null;
      await refreshTicketsEtHistorique();
      await chargerDepotsOuverts();
      chargerClassements();
    }catch(err){
      ui.lastError = messageErreurEncaissement(err.message || String(err));
    }
    render();
  }

  async function confirmPayment(){
    const mode = ui.confirming;
    if (!mode) return;
    if (ui.depotApplique){ await confirmPaymentAvecDepot(); return; }
    const lignes = lignesPourEnvoi(ui.panier);

    // Mode formation : circuit totalement séparé (tickets_formation), jamais de carte
    // cadeau réelle ni de client réel ni de décompte de stock -- voir
    // supabase-patch-fonction-ecole.sql. Le reste de l'écran (catalogue, panier, remises)
    // est identique à l'encaissement réel, pour des conditions d'entraînement fidèles.
    if (ui.modeFormation){
      try{
        const { data, error } = await supa.rpc("creer_ticket_formation", {
          p_salon_id: salon.id,
          p_lignes: lignes,
          p_moyen_paiement: mode,
          p_collaborateur_encaissant_id: ui.collaborateurConnecte.id,
          p_formateur_id: ui.collaborateurConnecte.id,
          p_remise_id: ui.remiseChoisie ? ui.remiseChoisie.id : null,
          p_remise_portee: ui.remisePortee,
          p_remise_ligne_index: ui.remiseLigneIndex
        });
        if (error) throw error;
        ui.lastReceipt = Object.assign({}, data, {formation: true});
        ui.lastError = null;
        reinitialiserPanierEtDevis();
        ui.prestataireActifId = null;
        await refreshTicketsEtHistorique();
      }catch(err){
        ui.lastError = messageErreurEncaissement(err.message || String(err));
      }
      render();
      return;
    }

    const params = {
      p_salon_id: salon.id,
      p_client_id: ui.clientSelectionne ? ui.clientSelectionne.id : null,
      p_lignes: lignes,
      p_moyen_paiement: mode,
      p_collaborateur_encaissant_id: ui.collaborateurConnecte.id,
      p_remise_id: ui.remiseChoisie ? ui.remiseChoisie.id : null,
      p_remise_portee: ui.remisePortee,
      p_remise_ligne_index: ui.remiseLigneIndex,
      p_client_genre: ui.clientGenre
    };
    if (ui.carteCadeauAppliquee){
      params.p_carte_cadeau_code = ui.carteCadeauAppliquee.code;
      params.p_montant_carte_cadeau = ui.carteCadeauAppliquee.montant;
    }
    const ligneCarteCreation = ui.panier.find(l => l.type === "carte_cadeau");
    if (ligneCarteCreation){
      params.p_creation_carte_code = ligneCarteCreation.carteCadeauCode;
      params.p_creation_carte_montant_depot = ligneCarteCreation.carteCadeauDepot;
    }
    try{
      const { data, error } = await supa.rpc("creer_ticket", params);
      if (error) throw error;
      ui.lastReceipt = data;
      ui.lastError = null;
      // Si cette vente provient d'un devis/ticket en attente repris, on le marque converti
      // (les autres formules éventuelles restent tracées mais ne génèrent aucune vente) --
      // une étape secondaire : si elle échoue, la vente elle-même reste acquise.
      const ticketAttenteConverti = ui.ticketAttenteId;
      reinitialiserPanierEtDevis();
      ui.prestataireActifId = null;
      if (ticketAttenteConverti){
        try{ await supa.rpc("caisse_marquer_ticket_attente_converti", {p_id: ticketAttenteConverti, p_ticket_id: data.id}); }
        catch(e){ /* la vente est déjà faite, ne pas bloquer sur cette étape secondaire */ }
      }
      await refreshTicketsEtHistorique();
      await chargerTicketsAttente();
      chargerClassements();
    }catch(err){
      ui.lastError = messageErreurEncaissement(err.message || String(err));
    }
    render();
  }

  // l'Accueil et code personnel redemandé (même si c'est le même collaborateur qui enchaîne) --
  // pour qu'une prestation ne puisse jamais s'attribuer par erreur à qui était connecté avant.
  function dismissReceipt(){

    renderPanier();

  function totauxJour(){
    const t = {especes:0, cb:0, cheque:0};
    const actifs = ticketsJour.filter(tk => !tk.annule);
    actifs.forEach(tk => { t[tk.moyen_paiement] += Number(tk.total); });
    return {especes:t.especes, cb:t.cb, cheque:t.cheque, general:t.especes+t.cb+t.cheque, nb: actifs.length};
  }
  // Comme totauxJour(), mais uniquement sur les fiches pas encore clôturées : c'est exactement
  // ce que cloturer_journee() va totaliser côté serveur. Sert de référence "système" pour la
  // caisse du soir -- si on utilisait totauxJour() ici, une journée avec plusieurs clôtures
  // successives montrerait un écart faux (mélangeant des montants déjà encaissés dans une
  // clôture précédente).
  function totauxOuverts(){
    const t = {especes:0, cb:0, cheque:0};
    const ouverts = ticketsJour.filter(tk => !tk.annule && !tk.cloture_id);
    ouverts.forEach(tk => { t[tk.moyen_paiement] += Number(tk.total); });
    return {especes:t.especes, cb:t.cb, cheque:t.cheque, general:t.especes+t.cb+t.cheque, nb: ouverts.length};
  }
  // Dépenses de caisse pas encore rattachées à une clôture : ce sont exactement celles que
  // cloturer_journee() va prendre en compte (et déduire de l'espèce attendue) ce soir.
  function depensesOuvertes(){
    return depensesJour.filter(d => !d.cloture_id);
  }
  function totalDepensesOuvertes(){
    return depensesOuvertes().reduce((s, d) => s + Number(d.montant), 0);
  }

  // ---------------- comptage de caisse (aide à la fermeture) ----------------
  const DENOMS_BILLETS = [50, 20, 10, 5];
  const DENOMS_PIECES = [2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];

  async function ouvrirComptageCaisse(){
    ui.comptageOuvert = true;
    ui.comptageDenoms = {};
    DENOMS_BILLETS.concat(DENOMS_PIECES).forEach(d => { ui.comptageDenoms[d] = ""; });

    ui.comptageMontantDepot = ""; ui.comptageDepotReference = ""; ui.comptageNbCartes = "";
    ui.comptageFondCaisse = ""; // préreempli juste après (fond de caisse de la veille), reste modifiable
    ui.comptageMsg = ""; ui.comptageMsgErr = false;
    render();
    try{
      const { data, error } = await supa.rpc("dernier_fond_caisse", {p_salon_id: salon.id});
      if (!error && data != null) { ui.comptageFondCaisse = String(data); render(); }

  function totalComptageEspeces(){
    return Object.keys(ui.comptageDenoms).reduce((s, d) => s + (Number(d) * (Number(ui.comptageDenoms[d]) || 0)), 0);
  }
  // Référence "système" pour l'écart espèces : fond de caisse de départ + ventes espèces du
  // jour encore ouvertes - dépenses de caisse encore ouvertes - dépôt en banque du soir.
  // On compte la caisse en dernier, une fois le dépôt et les dépenses déjà sortis du tiroir :
  // le montant compté doit donc être comparé à ce qui reste APRÈS avoir retiré ces deux montants.
  function especesAttenduesComptage(t){
    return (Number(ui.comptageFondCaisse) || 0) + t.especes - totalDepensesOuvertes() - (Number(ui.comptageMontantDepot) || 0);
  }

  // Redimensionne/compresse la photo du justificatif AVANT l'envoi (max 1400px de large,
  // JPEG qualité 0.72) : une photo de téléphone brute pèse plusieurs Mo, ce qui alourdirait
  // le stockage et la connexion des salons pour rien -- le justificatif reste lisible à cette
  // taille. Uniquement pour les dépenses de caisse (pas un outil photo général).
  function prepareDepensePhoto(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const maxDim = 1400;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim){
          if (w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => {
          if (!blob){ reject(new Error("Impossible de traiter la photo.")); return; }
          resolve(blob);
        }, "image/jpeg", 0.72);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Impossible de lire la photo.")); };
      img.src = url;
    });
  }
  async function onDepensePhotoChange(inputEl){
    const file = inputEl.files && inputEl.files[0];
    if (!file) return;
    try{
      const blob = await prepareDepensePhoto(file);
      depensePhotoBlobEnCours = blob;
      if (ui.depensePhotoApercu) URL.revokeObjectURL(ui.depensePhotoApercu);
      ui.depensePhotoApercu = URL.createObjectURL(blob);
    }catch(err){
      resetDepensePhoto();
      ui.depenseMsg = "Erreur : " + (err.message || err); ui.depenseMsgErr = true;
    }
    renderJournalView();
  }

  async function enregistrerDepense(){
    const montant = Number(ui.depenseMontant);
    if (!montant || montant <= 0){ ui.depenseMsg = "Indique un montant."; ui.depenseMsgErr = true; renderJournalView(); return; }
    if (!ui.depenseMotif || !ui.depenseMotif.trim()){ ui.depenseMsg = "Le motif est obligatoire."; ui.depenseMsgErr = true; renderJournalView(); return; }
    if (!ui.collaborateurConnecte){ ui.depenseMsg = "Connecte-toi (onglet Caisse) pour enregistrer une dépense."; ui.depenseMsgErr = true; renderJournalView(); return; }
    ui.depenseEnCours = true; ui.depenseMsg = ""; renderJournalView();
    try{
      let photoChemin = null;
      if (depensePhotoBlobEnCours){
        // Nom lisible -- "depense-<salon>-<date>-<heure>" -- plutôt qu'un identifiant
        // technique : c'est ce nom qui apparaît en enregistrant la photo depuis le navigateur,
        // et dans le bucket si le bureau va y jeter un œil directement.
        const maintenant = new Date();
        const dateStr = fmtDateInput(maintenant);
        const heureStr = String(maintenant.getHours()).padStart(2,"0") + String(maintenant.getMinutes()).padStart(2,"0") + String(maintenant.getSeconds()).padStart(2,"0");
        const salonSlug = slugify(salon.nom) || "salon";
        const nomFichier = "depense-" + salonSlug + "-" + dateStr + "-" + heureStr + ".jpg";
        const chemin = salonSlug + "/" + nomFichier;
        const { error: errUpload } = await supa.storage.from("factures-depenses").upload(chemin, depensePhotoBlobEnCours, {contentType:"image/jpeg"});
        if (errUpload) throw new Error("Photo : " + (errUpload.message || errUpload));
        photoChemin = chemin;
      }
      const { error } = await supa.rpc("enregistrer_depense_caisse", {
        p_salon_id: salon.id, p_montant: montant, p_motif: ui.depenseMotif.trim(), p_collaborateur_id: ui.collaborateurConnecte.id,
        p_photo_chemin: photoChemin
      });
      if (error) throw error;
      ui.depenseOuvert = false;
      ui.depenseEnCours = false;
      resetDepensePhoto();
      await refreshTicketsEtHistorique();
      showStatus("ok", "Dépense enregistrée.");
      render();
    }catch(err){
      ui.depenseEnCours = false;
      ui.depenseMsg = "Erreur : " + (err.message || err); ui.depenseMsgErr = true;
      renderJournalView();
    }
  }

  function htmlEcart(compte, systeme){
