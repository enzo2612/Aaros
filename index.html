  // Écart espèces spécifiquement, en "perte / profit" : une fois dépôt et dépenses retirés du
  // tiroir, si le compte ne tombe pas juste, c'est soit de la perte (moins que prévu), soit du
  // profit (plus que prévu) -- jamais un simple +/-.
  function htmlEcartPerteProfit(compte, systeme){
    return htmlEcartPerteProfitValeur(compte - systeme);
  }
  function htmlEcartPerteProfitValeur(ecart){
    if (Math.abs(ecart) < 0.005) return '<span class="ecart-ok">Caisse juste</span>';
    if (ecart < 0) return '<span class="ecart-warn">Perte de ' + fmt(Math.abs(ecart)) + '</span>';
    return '<span class="ecart-warn">Profit de ' + fmt(ecart) + '</span>';
  }

  function htmlComptageCaisse(t){
    let html = '<div class="cloture-card comptage-panel"><h3>🧮 Caisse du soir</h3>' +
      '<p class="hint" style="margin-bottom:14px;">Compte la caisse réelle : l\'app calcule l\'écart avec le système avant de valider la clôture. Les montants ci-dessous sont ceux à recopier sur la feuille de caisse.</p>';

    html += '<div class="comptage-autre"><label>Fond de caisse au démarrage (prérempli depuis hier soir, modifiable)</label>' +
      '<input type="number" min="0" step="0.01" inputmode="decimal" id="comptage-fond-caisse" value="' + ui.comptageFondCaisse + '"></div>';

    const depOuvertes = depensesOuvertes();
    const totalDep = totalDepensesOuvertes();
    html += '<div class="comptage-autre"><h4 style="margin-bottom:6px;">Dépenses de caisse du jour</h4>';

      html += '<p class="hint">Aucune dépense enregistrée aujourd\'hui.</p>';
    } else {
      html += '<div class="depense-liste">' + depOuvertes.map(d =>
        '<div class="depense-item"><span>' + escapeHtml(d.motif) + '</span><span class="num">' + fmt(d.montant) + '</span></div>'
      ).join("") + '</div><div class="comptage-total">Total dépenses : <b class="num">' + fmt(totalDep) + '</b></div>';
    }
    html += '</div>';

    html += '<div class="comptage-depot"><h4>Dépôt en banque</h4>' +
      '<p class="hint" style="margin-bottom:10px;">Le dépôt est déjà sorti du tiroir avant de compter les espèces ci-dessous : indique ici ce qui a été déposé (ou à déposer).</p>' +
      '<div class="comptage-autre"><label>Montant déposé (optionnel)</label>' +
      '<input type="number" min="0" step="0.01" inputmode="decimal" id="comptage-montant-depot" value="' + ui.comptageMontantDepot + '"></div>' +
      '<div class="comptage-autre"><label>Référence du dépôt (bordereau, remarque…)</label>' +
      '<input type="text" id="comptage-depot-reference" value="' + escapeHtml(ui.comptageDepotReference) + '"></div></div>';

    html += '<div class="comptage-especes"><h4>Espèces</h4>' +
      '<p class="hint" style="margin-bottom:10px;">Compte ce qui reste dans le tiroir une fois le dépôt et les dépenses déjà mis de côté.</p>' +
      '<div class="comptage-denoms">';
    DENOMS_BILLETS.forEach(d => {
      html += '<div class="denom-row"><label>Billet ' + d + ' €</label>' +
        '<input type="number" min="0" step="1" inputmode="numeric" class="denom-input" data-denom="' + d + '" value="' + (ui.comptageDenoms[d] ?? "") + '"></div>';
    });
    DENOMS_PIECES.forEach(d => {
      html += '<div class="denom-row"><label>Pièce ' + fmt(d) + '</label>' +
        '<input type="number" min="0" step="1" inputmode="numeric" class="denom-input" data-denom="' + d + '" value="' + (ui.comptageDenoms[d] ?? "") + '"></div>';
    });
    const compteEsp = totalComptageEspeces();
    const especesAttendues = especesAttenduesComptage(t);
    html += '</div><div class="comptage-total">Compté : <b class="num" id="comptage-compte-especes">' + fmt(compteEsp) + '</b>' +
      ' · Système (fond + ventes - dépenses - dépôt) : <span class="num" id="comptage-especes-systeme">' + fmt(especesAttendues) + '</span>' +
      ' · <span id="comptage-ecart-especes">' + htmlEcartPerteProfit(compteEsp, especesAttendues) + '</span></div></div>';

    const cb = Number(ui.comptageCb) || 0;
    const cheque = Number(ui.comptageCheque) || 0;
    html += '<div class="comptage-autre"><label>Carte bancaire comptée (relevé terminal)</label>' +
      '<input type="number" min="0" step="0.01" inputmode="decimal" id="comptage-cb" value="' + ui.comptageCb + '">' +
      '<div class="comptage-total">Système : <span class="num">' + fmt(t.cb) + '</span> · Écart : <span id="comptage-ecart-cb">' + htmlEcart(cb, t.cb) + '</span></div></div>';
    html += '<div class="comptage-autre"><label>Nombre de cartes (relevé terminal)</label>' +
      '<input type="number" min="0" step="1" inputmode="numeric" id="comptage-nb-cartes" value="' + ui.comptageNbCartes + '"></div>';

    html += '<div class="comptage-autre"><label>Chèques comptés</label>' +
      '<input type="number" min="0" step="0.01" inputmode="decimal" id="comptage-cheque" value="' + ui.comptageCheque + '">' +
      '<div class="comptage-total">Système : <span class="num">' + fmt(t.cheque) + '</span> · Écart : <span id="comptage-ecart-cheque">' + htmlEcart(cheque, t.cheque) + '</span></div></div>';

    html += '<div class="comptage-autre"><label>Commentaire (optionnel)</label>' +
      '<textarea id="comptage-commentaire" rows="2" placeholder="Explication d\'un écart, remarque…">' + escapeHtml(ui.comptageCommentaire) + '</textarea></div>';

    if (ui.comptageMsg) html += '<p class="hint" style="color:' + (ui.comptageMsgErr ? 'var(--danger)' : 'var(--ink-soft)') + ';">' + escapeHtml(ui.comptageMsg) + '</p>';

    html += '<div class="comptage-actions">' +
      '<button type="button" class="btn ghost" id="btn-annuler-comptage"' + (ui.comptageEnCours ? " disabled" : "") + '>Annuler</button>' +
      '<button type="button" class="btn primary" id="btn-valider-cloture"' + (ui.comptageEnCours ? " disabled" : "") + '>Valider la clôture</button>' +
      '</div></div>';
    return html;
  }

  // Ne pas appeler render() sur chaque frappe (perdrait le focus du champ en cours de
  // saisie, comme pour tous les autres champs texte de l'app) : on recalcule juste les
  // totaux/écarts affichés directement dans le DOM.
  function wireComptageCaisse(el, t){
    function majEspeces(){
      const compte = totalComptageEspeces();
      const especesAttendues = especesAttenduesComptage(t);
      const elCompte = el.querySelector("#comptage-compte-especes");
      const elSysteme = el.querySelector("#comptage-especes-systeme");
      const elEcart = el.querySelector("#comptage-ecart-especes");
      if (elCompte) elCompte.textContent = fmt(compte);
      if (elSysteme) elSysteme.textContent = fmt(especesAttendues);
      if (elEcart) elEcart.innerHTML = htmlEcartPerteProfit(compte, especesAttendues);
    }
    el.querySelectorAll(".denom-input").forEach(inp => {
      inp.addEventListener("input", () => {
        ui.comptageDenoms[inp.getAttribute("data-denom")] = inp.value;
        majEspeces();
      });
    });
    const fondInp = el.querySelector("#comptage-fond-caisse");
    if (fondInp) fondInp.addEventListener("input", () => {
      ui.comptageFondCaisse = fondInp.value;
      majEspeces();
    });
    const nbCartesInp = el.querySelector("#comptage-nb-cartes");
    if (nbCartesInp) nbCartesInp.addEventListener("input", () => { ui.comptageNbCartes = nbCartesInp.value; });
    const cbInp = el.querySelector("#comptage-cb");
    if (cbInp) cbInp.addEventListener("input", () => {
      ui.comptageCb = cbInp.value;
      const elEcart = el.querySelector("#comptage-ecart-cb");
      if (elEcart) elEcart.innerHTML = htmlEcart(Number(ui.comptageCb) || 0, t.cb);
    });
    const chqInp = el.querySelector("#comptage-cheque");
    if (chqInp) chqInp.addEventListener("input", () => {
      ui.comptageCheque = chqInp.value;
      const elEcart = el.querySelector("#comptage-ecart-cheque");
      if (elEcart) elEcart.innerHTML = htmlEcart(Number(ui.comptageCheque) || 0, t.cheque);
    });
    const depotInp = el.querySelector("#comptage-montant-depot");
    if (depotInp) depotInp.addEventListener("input", () => {
      ui.comptageMontantDepot = depotInp.value;
      majEspeces();
    });
    const depotRefInp = el.querySelector("#comptage-depot-reference");
    if (depotRefInp) depotRefInp.addEventListener("input", () => { ui.comptageDepotReference = depotRefInp.value; });
    const comInp = el.querySelector("#comptage-commentaire");
    if (comInp) comInp.addEventListener("input", () => { ui.comptageCommentaire = comInp.value; });
    const btnAnnuler = el.querySelector("#btn-annuler-comptage");
    if (btnAnnuler) btnAnnuler.addEventListener("click", fermerComptageCaisse);
    const btnValider = el.querySelector("#btn-valider-cloture");
    if (btnValider) btnValider.addEventListener("click", () => {
      cloturerJournee({
        especes: totalComptageEspeces(),
        cb: Number(ui.comptageCb) || 0,
        cheque: Number(ui.comptageCheque) || 0,
        commentaire: ui.comptageCommentaire,
        montantDepot: Number(ui.comptageMontantDepot) || null,
        depotReference: ui.comptageDepotReference,
        fondCaisse: ui.comptageFondCaisse === "" ? null : Number(ui.comptageFondCaisse),
        nbCartes: ui.comptageNbCartes === "" ? null : Number(ui.comptageNbCartes)
      });
    });
  }

  // ---------------- rendu ----------------
  function setTab(tab){
    ui.tab = tab;
    render();
    if (tab === "activite") chargerActivite();
  }

  function render(){
    renderFormationBanner();
    renderSidebar();
    const posteZone = document.getElementById("poste-config-zone");
    if (!salon){
      posteZone.hidden = false;
      document.getElementById("tabs-zone").hidden = true;
      document.getElementById("gate-zone").hidden = true;
      document.getElementById("admin-zone").hidden = true;
      document.getElementById("fiche-client-zone").hidden = true;
      document.getElementById("view-salon-section").hidden = true;
      renderPosteConfig();
      return;
    }
    posteZone.hidden = true;

    const admin = ui.showAdminEquipe;
    const fiche = ui.ficheClientOuverte;
    // Sections libres (Accueil / Stock / Statistiques) : consultables sans code, même avant
    // d'avoir choisi qui encaisse. Seuls Caisse et Clients demandent un code personnel.
    const libre = !admin && !fiche && ui.salonSection !== "caisse" && ui.salonSection !== "clients" && ui.salonSection !== "journal";

    document.getElementById("view-salon-section").hidden = !libre;
    if (libre){
      document.getElementById("tabs-zone").hidden = true;
      document.getElementById("view-encaissement").hidden = true;
      document.getElementById("view-client").hidden = true;
      document.getElementById("view-journal").hidden = true;
      document.getElementById("view-activite").hidden = true;
      document.getElementById("gate-zone").hidden = true;
      document.getElementById("admin-zone").hidden = true;
      document.getElementById("fiche-client-zone").hidden = true;
      renderWho();
      renderSalonSection();
      return;
    }

    // Journal & clôture : section libre elle aussi (consultable sans code), mais garde son
    // propre écran dédié (view-journal) plutôt que le conteneur générique des sections libres,
    // pour ne pas dupliquer toute la logique de correction/annulation de ticket.
    if (!admin && !fiche && ui.salonSection === "journal"){
      document.getElementById("tabs-zone").hidden = true;
      document.getElementById("view-encaissement").hidden = true;
      document.getElementById("view-client").hidden = true;
      document.getElementById("view-activite").hidden = true;
      document.getElementById("view-journal").hidden = false;
      document.getElementById("gate-zone").hidden = true;
      document.getElementById("admin-zone").hidden = true;
      document.getElementById("fiche-client-zone").hidden = true;
      renderWho();
      renderJournalView();
      return;
    }

    // Monde « caisse » (encaissement / clients / activité), back-office et fiche client :
    // logique historique inchangée.
    if (ui.salonSection === "clients" && !admin && !fiche) ui.tab = "client";
    const connecte = !!ui.collaborateurConnecte;
    document.getElementById("tabs-zone").hidden = !connecte || admin || fiche || ui.tab === "client";
    document.getElementById("view-encaissement").hidden = admin || fiche || !connecte || ui.tab !== "encaissement";
    document.getElementById("view-client").hidden = admin || fiche || !connecte || ui.tab !== "client";
    document.getElementById("view-journal").hidden = true;
    document.getElementById("view-activite").hidden = admin || fiche || !connecte || ui.tab !== "activite";
    document.getElementById("gate-zone").hidden = connecte || admin || fiche;
    document.getElementById("admin-zone").hidden = !admin;
    document.getElementById("fiche-client-zone").hidden = !fiche;

    renderWho();
    if (fiche){ renderFicheClient(); return; }
    if (admin){ renderAdminEquipe(); return; }
    if (!connecte){ renderGate(); return; }

    renderTabs();
    if (ui.tab === "activite"){ renderActivite(); return; }
    if (ui.tab === "client"){ renderClientTab(); return; }
    renderClientBar();
    renderCatalogue();
    renderPanier();
  }

  function renderWho(){
    const el = document.getElementById("who-zone");
    if (!ui.collaborateurConnecte){ el.innerHTML = ""; return; }
    el.innerHTML = '<div class="who">' + escapeHtml(nomCollab(ui.collaborateurConnecte.id)) +
      (peut("activer_formation") && !ui.modeFormation ? '<button type="button" class="chg" id="btn-activer-formation">🎓 Mode formation</button>' : '') +
      '<button type="button" class="chg" id="btn-changer-collab">Changer</button></div>';
    const btn = document.getElementById("btn-changer-collab");
    if (btn) btn.addEventListener("click", changerCollaborateur);
    const btnFormation = document.getElementById("btn-activer-formation");
    if (btnFormation) btnFormation.addEventListener("click", activerModeFormation);
  }

  function renderGate(){
    const el = document.getElementById("gate-zone");
    if (!salon){ el.innerHTML = ""; return; }
    let html = '<div class="gate">';
    if (!ui.gatePinCible){
      html += '<h1>Qui encaisse ?</h1>';
      if (collaborateurs.length === 0){
        html += '<p class="gate-empty">Aucun collaborateur enregistré. Utilise « Gestion de l\'équipe » ci-dessous pour en ajouter.</p>';
      } else {
        html += '<div class="gate-grid">';
        collaborateurs.forEach(c => {
          html += '<button type="button" class="gate-tile" data-collab="' + c.id + '">' + escapeHtml(c.prenom ? c.prenom+" "+c.nom : c.nom) + '</button>';
        });
        html += '</div>';
      }
      html += '<button type="button" class="gate-admin-link" id="gate-admin-link">⚙ Gestion de l\'équipe (bureau)</button>';
    } else {
      const nom = nomCollab(ui.gatePinCible);
      html += '<div class="pin-name">' + escapeHtml(nom) + '</div>';
      html += '<div class="pin-textbox-row">' +
        '<input type="password" id="pin-input" class="pin-textbox" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" value="' + escapeHtml(ui.gatePinDigits) + '" placeholder="Code">' +
        '<button type="button" class="btn primary" id="pin-valider"' + (ui.gatePinVerification ? " disabled" : "") + '>Valider</button>' +
        '</div>';
      html += '<div class="pin-pad">';
      ["1","2","3","4","5","6","7","8","9"].forEach(d => { html += '<button type="button" class="pin-key" data-digit="' + d + '">' + d + '</button>'; });
      html += '<button type="button" class="pin-key ghost" id="pin-retour">← Retour</button>';
      html += '<button type="button" class="pin-key" data-digit="0">0</button>';
      html += '<button type="button" class="pin-key ghost" id="pin-effacer">Effacer</button>';
      html += '</div>';
      html += '<div class="pin-error">' + (ui.gatePinErreur ? escapeHtml(ui.gatePinErreurMsg) : "") + '</div>';
    }
    html += '</div>';
    el.innerHTML = html;

    el.querySelectorAll("[data-collab]").forEach(btn => btn.addEventListener("click", () => choisirCollaborateurGate(btn.getAttribute("data-collab"))));
    el.querySelectorAll("[data-digit]").forEach(btn => btn.addEventListener("click", () => saisirChiffreGate(btn.getAttribute("data-digit"))));
    const retour = document.getElementById("pin-retour"); if (retour) retour.addEventListener("click", retourListeGate);
    const effacer = document.getElementById("pin-effacer"); if (effacer) effacer.addEventListener("click", effacerChiffreGate);
    const adminLink = document.getElementById("gate-admin-link"); if (adminLink) adminLink.addEventListener("click", () => ouvrirAdminEquipe("salaries"));
    const pinInput = document.getElementById("pin-input");
    if (pinInput){
      pinInput.addEventListener("input", () => onGatePinInput(pinInput));
      pinInput.addEventListener("keydown", (ev) => { if (ev.key === "Enter") validerCodeGate(); });
      pinInput.focus();
      pinInput.setSelectionRange(pinInput.value.length, pinInput.value.length);
    }
    const pinValider = document.getElementById("pin-valider"); if (pinValider) pinValider.addEventListener("click", validerCodeGate);
  }

  // ---------------- configuration du poste (salon rattaché à cet appareil) ----------------
  // Ouverture initiale : n'importe quel code personnel (collaborateur ou responsable) déjà
  // rattaché au salon choisi suffit — ou le code direction. Changer le salon d'un poste déjà
  // configuré, en revanche, ne passe que par « Gestion de l'équipe », donc uniquement le code
  // direction (voir demanderChangementSalonPoste / changerSalonPoste plus bas).
  function renderPosteConfig(){
    const el = document.getElementById("poste-config-zone");
    if (!el) return;
    const c = ui.posteConfig;
    let html = '<div class="gate"><h1>Configuration du poste</h1>';

    if (c.etape === "choix"){
      html += '<p class="hint">Sélectionne le salon où se trouve ce poste.</p>';
      if (c.salons.length === 0){
        html += '<p class="gate-empty">Aucun salon enregistré pour le moment.</p>';
      } else {
        html += '<div class="gate-grid">';
        c.salons.forEach(s => {
          html += '<button type="button" class="gate-tile" data-salon-choix="' + s.id + '">' + escapeHtml(s.nom) +
            (s.ville ? '<span style="display:block;font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:3px;">' + escapeHtml(s.ville) + '</span>' : '') +
            '</button>';
        });
        html += '</div>';
      }
      html += '<button type="button" class="gate-admin-link" id="poste-nouveau-toggle">' + (c.nouveauOuvert ? "✕ Annuler" : "+ Créer un nouveau salon") + '</button>';
      if (c.nouveauOuvert){
        html += '<p class="hint" style="margin-top:10px;">Un nouveau salon n\'a pas encore de collaborateur enregistré : la création se fait avec le code direction.</p>';
        html += '<div class="client-form">' +
          '<input type="text" id="poste-nouveau-nom" placeholder="Nom du salon" value="' + escapeHtml(c.nouveauNom) + '">' +
          '<input type="text" id="poste-nouveau-ville" placeholder="Ville" value="' + escapeHtml(c.nouveauVille) + '">' +
          '<input type="password" id="poste-nouveau-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Code direction" value="' + escapeHtml(c.nouveauCode) + '">' +
          '<div class="full"><button type="button" class="btn" id="poste-nouveau-creer"' + (c.nouveauCreation ? " disabled" : "") + '>Créer et sélectionner</button></div>' +
          '</div>';
        if (c.nouveauMsg) html += '<p class="hint" style="color:' + (c.nouveauMsgErr ? "var(--warn)" : "var(--ink-soft)") + ';">' + escapeHtml(c.nouveauMsg) + '</p>';
      }
    } else if (c.etape === "code"){
      const s = c.salons.find(x => x.id === c.salonChoisiId);
      if (!s){ c.etape = "choix"; renderPosteConfig(); return; }
      html += '<p class="hint">Salon sélectionné : <b>' + escapeHtml(s.nom) + (s.ville ? " — " + escapeHtml(s.ville) : "") + '</b></p>';
      html += '<p class="hint">Confirme avec ton code personnel (celui que tu utilises pour encaisser), ou le code direction.</p>';
      html += '<div class="pin-textbox-row" style="margin-top:14px;">' +
        '<input type="password" id="poste-code" class="pin-textbox" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" value="' + escapeHtml(c.code) + '" placeholder="Ton code, ou le code direction">' +
        '<button type="button" class="btn primary" id="poste-code-valider"' + (c.codeVerification ? " disabled" : "") + '>Valider</button>' +
        '</div>';
      html += '<div class="pin-error">' + (c.codeErreur ? "Code incorrect." : "") + '</div>';
      html += '<button type="button" class="gate-admin-link" id="poste-code-retour">← Choisir un autre salon</button>';
    } else if (c.etape === "confirmation"){
      const s = c.salons.find(x => x.id === c.salonChoisiId);
      if (!s){
        c.etape = "choix";
        html = null;
      } else {
        html += '<div class="confirm-box">' +
          '<div><span class="hint">Tu as sélectionné :</span>' +
          '<div style="font-size:21px;font-weight:800;margin-top:4px;">' + escapeHtml(s.nom) + '</div>' +
          (s.ville ? '<div style="color:var(--ink-soft);font-weight:600;">' + escapeHtml(s.ville) + '</div>' : '') +
          '</div>' +
          '<p class="hint">Ce poste enregistrera désormais toutes les ventes pour ce salon. Vérifie bien avant de confirmer.</p>' +
          '<div style="display:flex; gap:10px;">' +
          '<button type="button" class="btn ghost" id="poste-confirmer-retour">← Retour</button>' +
          '<button type="button" class="btn primary" id="poste-confirmer-valider">✓ Confirmer ce salon</button>' +
          '</div></div>';
      }
      if (html === null){ renderPosteConfig(); return; }
    }

    html += '</div>';
    el.innerHTML = html;

    if (c.etape === "choix"){
      el.querySelectorAll("[data-salon-choix]").forEach(btn => btn.addEventListener("click", () => choisirSalonPoste(btn.getAttribute("data-salon-choix"))));
      const toggle = document.getElementById("poste-nouveau-toggle"); if (toggle) toggle.addEventListener("click", basculerNouveauSalonPoste);
      const nomInput = document.getElementById("poste-nouveau-nom"); if (nomInput) nomInput.addEventListener("input", () => { c.nouveauNom = nomInput.value; });
      const villeInput = document.getElementById("poste-nouveau-ville"); if (villeInput) villeInput.addEventListener("input", () => { c.nouveauVille = villeInput.value; });
      const codeInput = document.getElementById("poste-nouveau-code"); if (codeInput) codeInput.addEventListener("input", () => { const clean = codeInput.value.replace(/\D/g,"").slice(0,6); if (codeInput.value !== clean) codeInput.value = clean; c.nouveauCode = clean; });
      const creer = document.getElementById("poste-nouveau-creer"); if (creer) creer.addEventListener("click", creerSalonPoste);
    } else if (c.etape === "code"){
      const input = document.getElementById("poste-code");
      if (input){
        input.addEventListener("input", () => onPosteCodeInput(input));
        input.addEventListener("keydown", (ev) => { if (ev.key === "Enter") validerCodePoste(); });
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
      const valider = document.getElementById("poste-code-valider"); if (valider) valider.addEventListener("click", validerCodePoste);
      const retour = document.getElementById("poste-code-retour"); if (retour) retour.addEventListener("click", retourChoixPoste);
    } else if (c.etape === "confirmation"){
      const retour = document.getElementById("poste-confirmer-retour"); if (retour) retour.addEventListener("click", retourChoixPoste);
      const valider = document.getElementById("poste-confirmer-valider"); if (valider) valider.addEventListener("click", confirmerSalonPoste);
    }
  }

  function onPosteCodeInput(inputEl){
    const clean = inputEl.value.replace(/\D/g,"").slice(0,6);

  // Vérifie, dans l'ordre : un code personnel (collaborateur/responsable) rattaché à CE salon,
  // puis le code direction propre à ce salon, puis le code direction partagé par tout le groupe.
  async function validerCodePoste(){
    const c = ui.posteConfig;
    if (c.codeVerification || !c.code || !c.salonChoisiId) return;
    c.codeVerification = true;
    c.codeErreur = false;
    renderPosteConfig();
    try{
      let ok = false;
      const { data: dataStaff, error: errStaff } = await supa.rpc("verifier_ouverture_poste", {p_salon_id: c.salonChoisiId, p_code: c.code});
      if (errStaff) throw errStaff;
      ok = dataStaff === true;
      if (!ok){
        const { data: dataDir, error: errDir } = await supa.rpc("verifier_code_direction", {p_salon_id: c.salonChoisiId, p_code: c.code});
        if (errDir) throw errDir;
        ok = dataDir === true;
      }
      if (!ok){
        const { data: dataGlobal, error: errGlobal } = await supa.rpc("verifier_code_direction_global", {p_code: c.code});
        if (errGlobal) throw errGlobal;
        ok = dataGlobal === true;
      }
      c.codeVerification = false;
      if (ok){
        c.etape = "confirmation";
        renderPosteConfig();
      } else {
        c.codeErreur = true;
        c.code = "";
        renderPosteConfig();
      }
    }catch(err){
      c.codeVerification = false;
      c.codeErreur = true;
      renderPosteConfig();
    }
  }

  // Créer un nouveau salon reste réservé au code direction : un salon tout juste créé n'a
  // par définition encore aucun collaborateur à qui déléguer cette étape.
  async function creerSalonPoste(){
    const c = ui.posteConfig;
    if (c.nouveauCreation) return;
    const nom = c.nouveauNom.trim();
    if (!nom){
      c.nouveauMsg = "Le nom du salon est obligatoire.";
      c.nouveauMsgErr = true;
      renderPosteConfig();
      return;
    }
    if (!c.nouveauCode){
      c.nouveauMsg = "Le code direction est nécessaire pour créer un nouveau salon.";
      c.nouveauMsgErr = true;
      renderPosteConfig();
      return;
    }
    c.nouveauCreation = true;
    c.nouveauMsg = "";
    renderPosteConfig();
    try{
      const { data: dataGlobal, error: errGlobal } = await supa.rpc("verifier_code_direction_global", {p_code: c.nouveauCode});
      if (errGlobal) throw errGlobal;
      if (dataGlobal !== true){
        c.nouveauCreation = false;
        c.nouveauMsg = "Code direction incorrect.";
        c.nouveauMsgErr = true;
        renderPosteConfig();
        return;
      }
      const { data, error } = await supa.from("salons").insert({nom: nom, ville: c.nouveauVille.trim() || null}).select().limit(1);
      if (error) throw error;
      const nouveau = data[0];
      c.salons.push({id: nouveau.id, nom: nouveau.nom, ville: nouveau.ville});
      c.salons.sort((a,b) => a.nom.localeCompare(b.nom, "fr"));
      c.nouveauOuvert = false; c.nouveauNom = ""; c.nouveauVille = ""; c.nouveauCode = ""; c.nouveauMsg = ""; c.nouveauMsgErr = false;
      c.nouveauCreation = false;
      // Le code direction vient d'être vérifié pour cette création : on saute directement
      // à la confirmation, pas besoin de le ressaisir pour un salon qui n'a encore personne.
      c.salonChoisiId = nouveau.id;
      c.etape = "confirmation";
      renderPosteConfig();
    }catch(err){
      c.nouveauCreation = false;
      c.nouveauMsg = "Erreur : " + (err.message || err);
      c.nouveauMsgErr = true;
      renderPosteConfig();
    }
  }

  function getFiltreMarque(scope){

  function calculerFiltreMarque(items, filtre){
    const compteParMarque = {};
    items.forEach(it => { const m = it.marque || "—"; compteParMarque[m] = (compteParMarque[m]||0) + 1; });
    const marques = Object.keys(compteParMarque).sort((a,b) => a.localeCompare(b,"fr"));
    const base = (filtre.marque === null || filtre.marque === "__TOUS__") ? items : items.filter(it => (it.marque||"—") === filtre.marque);
    // type (vente / technique) : n'existe que pour les produits (items de stock) — se place
    // juste après la marque, avant gamme/catégorie qui sont recalculées après ce filtre.
    const types = Array.from(new Set(base.map(it => it.type_stock).filter(Boolean)));
    const baseType = filtre.type ? base.filter(it => it.type_stock === filtre.type) : base;
    const gammes = Array.from(new Set(baseType.map(it => it.gamme || "—"))).sort((a,b) => a.localeCompare(b,"fr"));
    const categories = Array.from(new Set(baseType.map(it => it.categorie || "—"))).sort((a,b) => a.localeCompare(b,"fr"));
    let affiches = baseType;
    if (filtre.gamme) affiches = affiches.filter(it => (it.gamme||"—") === filtre.gamme);
    if (filtre.categorie) affiches = affiches.filter(it => (it.categorie||"—") === filtre.categorie);
    return { compteParMarque, marques, types, gammes, categories, affiches };
  }

        html += '<div class="client-form" style="margin-bottom:10px;"><p class="full hint">' +

          'Colonnes reconnues : ' + (colsOk.length ? colsOk.join(', ') : 'aucune — vérifie les en-têtes du fichier') + '.<br>' +
          'Types détectés : ' + ap.compteType.retail + ' Retail, ' + ap.compteType.technical + ' Technical, ' + ap.compteType.mixed + ' Mixed' +
          (ap.compteType.vente ? ', ' + ap.compteType.vente + ' Vente' : '') + (ap.compteType.technique ? ', ' + ap.compteType.technique + ' Technique' : '') +

        if ((pi.nouvellesGammes && pi.nouvellesGammes.length) || (pi.nouvellesCategories && pi.nouvellesCategories.length)){

          '<select id="produits-import-mixed"><option value="technique"' + (pi.mixedVers==='technique'?' selected':'') + '>Convertir « Mixed » en : Technique</option><option value="vente"' + (pi.mixedVers==='vente'?' selected':'') + '>Convertir « Mixed » en : Vente</option></select>' +

        html += '<div class="client-form" style="margin-bottom:10px;">' +

          (pi.modePrixVente === 'coefficient' ? '<input type="number" step="0.01" min="0" id="produits-import-coefficient" placeholder="Coefficient (ex. 2.2)" value="' + escapeHtml(pi.coefficientPrixVente) + '">' : '') +
          (pi.modePrixVente === 'coefficient' ? '<p class="full hint">Le prix de vente de chaque ligne sera recalculé (prix d\'achat × coefficient, arrondi au centime), même si le fichier contient une colonne de prix de vente. Les lignes sans prix d\'achat sont ignorées.</p>' : '') +

        html += htmlSalonSelectNouveau("produitsImport");

      if (pi.resultat){

  // affiche/masque le champ texte "nouvelle catégorie" selon la sélection de la liste déroulante
  function wireChampExtraListe(selectEl){
    if (!selectEl) return;
    const nouvelleEl = selectEl.parentElement.querySelector(
      (selectEl.id ? "#" + selectEl.id : "." + selectEl.className) + "-nouvelle"
    );
    if (!nouvelleEl) return;
    const sync = () => { nouvelleEl.hidden = selectEl.value !== "__nouvelle__"; if (!nouvelleEl.hidden) nouvelleEl.focus(); };
    selectEl.addEventListener("change", sync);
  }
  function wireSectionCatalogue(el, cle){
    const c = CATALOGUES[cle];
    if (c.champExtraListe){
      wireChampExtraListe(document.getElementById("cat-extra"));
      wireChampExtraListe(el.querySelector(".cat-edit-extra"));
    }
    document.getElementById("cat-creer").addEventListener("click", () => creerCatalogueItem(cle));
    wireSalonSelectNouveau(el);
    el.querySelectorAll("[data-edit]").forEach(btn => btn.addEventListener("click", () => ouvrirEditionCatalogue(cle, btn.getAttribute("data-edit"))));
    const saveBtn = el.querySelector(".cat-edit-save");
    if (saveBtn) saveBtn.addEventListener("click", () => modifierCatalogueItem(cle, saveBtn.getAttribute("data-id")));
    if (cle === "produits"){
      // formulaire de création (champs par id, toujours présents) ...
      wireChampSelectionGammeCategorie(el, "marque", "id");
      wireChampSelectionGammeCategorie(el, "gamme", "id");
      wireChampSelectionGammeCategorie(el, "categorie", "id");
      // ... et panneau de modification (champs par classe, seulement si une ligne est ouverte)
      wireChampSelectionGammeCategorie(el, "marque");
      wireChampSelectionGammeCategorie(el, "gamme");
      wireChampSelectionGammeCategorie(el, "categorie");
    }
    if (c.prixGlobal){
      el.querySelectorAll(".cat-dispo-globale").forEach(chk => chk.addEventListener("change", () => definirDisponibiliteCatalogueSalon(cle, ui.catalogueEditId[cle], chk.getAttribute("data-salon"), chk.checked)));
    }
    el.querySelectorAll(".cat-salon-row").forEach(row => {
      const salonId = row.getAttribute("data-salon");
      const chk = row.querySelector(".cat-dispo");
      const prixInput = row.querySelector(".cat-prix-input");
      const save = () => {
        const prix = parseFloat(prixInput.value);
        if (isNaN(prix)) return;
        definirPrixCatalogueSalon(cle, ui.catalogueEditId[cle], salonId, prix, chk.checked);
      };
      chk.addEventListener("change", save);
      prixInput.addEventListener("change", save);
    });
    if (c.avecImportExport){
      const exportBtn = document.getElementById("cat-export-btn");
      if (exportBtn) exportBtn.addEventListener("click", () => exporterCatalogueExcel(cle));
      const importBtn = document.getElementById("cat-import-btn");
      const importFile = document.getElementById("cat-import-file");
      if (importBtn && importFile) importBtn.addEventListener("click", () => importFile.click());
      if (importFile) importFile.addEventListener("change", (ev) => { if (ev.target.files[0]) importerCatalogueExcel(cle, ev.target.files[0]); });
    }
    if (cle === "produits"){
      wireFiltreMarque(el);
      el.querySelectorAll("[data-produit-select]").forEach(chk => chk.addEventListener("change", () => toggleSelectionProduit(chk.getAttribute("data-produit-select"), chk.checked)));
      const selectTous = document.getElementById("produits-select-tous");
      if (selectTous) selectTous.addEventListener("change", () => {
        const ids = Array.from(el.querySelectorAll("[data-produit-select]")).map(chk => chk.getAttribute("data-produit-select"));
        toggleSelectionProduitsVisibles(ids, selectTous.checked);
      });
      const supprBtn = document.getElementById("produits-supprimer-selection"); if (supprBtn) supprBtn.addEventListener("click", demanderSuppressionProduits);
      const supprAnnuler = document.getElementById("produits-suppr-annuler"); if (supprAnnuler) supprAnnuler.addEventListener("click", annulerSuppressionProduits);
      const supprConfirmer = document.getElementById("produits-suppr-confirmer"); if (supprConfirmer) supprConfirmer.addEventListener("click", confirmerSuppressionProduits);
      const affectBtn = document.getElementById("produits-affecter-selection"); if (affectBtn) affectBtn.addEventListener("click", demanderAffectationProduits);
      const affectAnnuler = document.getElementById("produits-affect-annuler"); if (affectAnnuler) affectAnnuler.addEventListener("click", annulerAffectationProduits);
      const affectConfirmer = document.getElementById("produits-affect-confirmer"); if (affectConfirmer) affectConfirmer.addEventListener("click", confirmerAffectationProduits);
      el.querySelectorAll(".produits-affect-salon").forEach(chk => chk.addEventListener("change", () => toggleAffectationSalon(chk.value, chk.checked)));
    }
    if (c.avecImportMasse){
      const piChoisir = document.getElementById("produits-import-choisir");
      const piFile = document.getElementById("produits-import-file");
      if (piChoisir && piFile) piChoisir.addEventListener("click", () => piFile.click());
      if (piFile) piFile.addEventListener("change", () => { if (piFile.files && piFile.files[0]) traiterFichierImportProduits(piFile.files[0]); });
      const piReinit = document.getElementById("produits-import-reinit"); if (piReinit) piReinit.addEventListener("click", reinitialiserImportProduits);
      el.querySelectorAll(".import-mapping-gamme").forEach(sel => sel.addEventListener("change", () => { ui.produitsImport.mappingGamme[sel.getAttribute("data-brute")] = sel.value; }));
      el.querySelectorAll(".import-mapping-categorie").forEach(sel => sel.addEventListener("change", () => { ui.produitsImport.mappingCategorie[sel.getAttribute("data-brute")] = sel.value; }));
      const piMarque = document.getElementById("produits-import-marque"); if (piMarque) piMarque.addEventListener("input", () => { ui.produitsImport.marqueDefaut = piMarque.value; });
      const piPrixUnite = document.getElementById("produits-import-prix-unite"); if (piPrixUnite) piPrixUnite.addEventListener("change", () => { ui.produitsImport.prixUnite = piPrixUnite.value; });
      const piTypeDefaut = document.getElementById("produits-import-type-defaut"); if (piTypeDefaut) piTypeDefaut.addEventListener("change", () => { ui.produitsImport.typeDefaut = piTypeDefaut.value; });
      const piMixed = document.getElementById("produits-import-mixed"); if (piMixed) piMixed.addEventListener("change", () => { ui.produitsImport.mixedVers = piMixed.value; });
      const piModePrix = document.getElementById("produits-import-mode-prix"); if (piModePrix) piModePrix.addEventListener("change", () => { ui.produitsImport.modePrixVente = piModePrix.value; renderAdminEquipe(); });
      const piCoefficient = document.getElementById("produits-import-coefficient"); if (piCoefficient) piCoefficient.addEventListener("input", () => { ui.produitsImport.coefficientPrixVente = piCoefficient.value; });
      const piLancer = document.getElementById("produits-import-lancer"); if (piLancer) piLancer.addEventListener("click", lancerImportProduits);
    }
  }

  // Période de comparaison "N-1" : même période, un an plus tôt -- plus pertinent qu'une simple
  // période équivalente immédiatement précédente pour un salon de coiffure (évite de comparer
  // décembre, saisonnier, à un novembre ordinaire). Mêmes bornes [debut, fin) décalées d'un an.
  function periodeAnneeMoins1(debut, fin){
    const d = new Date(debut); d.setFullYear(d.getFullYear() - 1);
    const f = new Date(fin); f.setFullYear(f.getFullYear() - 1);
    return { debut: d.toISOString(), fin: f.toISOString() };
  }
  async function chargerDashboard(){
    ui.dashboardChargement = true;
    const { debut, fin } = bornesPeriode(ui.dashboardPeriode, ui.dashboardDebutPerso, ui.dashboardFinPerso);
    const { debut: debutN1, fin: finN1 } = periodeAnneeMoins1(debut, fin);
    try{
      const [
        {data: salonData, error: e1}, {data: collabData, error: e2}, {data: articlesData, error: e3},
        {data: salonDataN1, error: e4}, {data: collabDataN1, error: e5}, {data: fideliData, error: e6}
      ] = await Promise.all([
        supa.rpc("dashboard_salon_totaux", {p_salon_id: salon.id, p_debut: debut, p_fin: fin}),
        supa.rpc("dashboard_collaborateurs", {p_salon_id: salon.id, p_debut: debut, p_fin: fin}),
        supa.rpc("dashboard_articles_vendus", {p_salon_id: salon.id, p_debut: debut, p_fin: fin}),
        supa.rpc("dashboard_salon_totaux", {p_salon_id: salon.id, p_debut: debutN1, p_fin: finN1}),
        supa.rpc("dashboard_collaborateurs", {p_salon_id: salon.id, p_debut: debutN1, p_fin: finN1}),
        supa.rpc("dashboard_fidelisation_salon", {p_salon_id: salon.id, p_debut: debut, p_fin: fin})
      ]);
      if (e1) throw e1;
      if (e2) throw e2;
      if (e3) throw e3;
      if (e4) throw e4;
      if (e5) throw e5;
      if (e6) throw e6;
      ui.dashboardSalon = (salonData && salonData[0]) || null;
      ui.dashboardCollabs = collabData || [];
      ui.articlesData = articlesData || [];
      ui.dashboardSalonN1 = (salonDataN1 && salonDataN1[0]) || null;
      ui.dashboardCollabsN1 = collabDataN1 || [];
      ui.dashboardFidelisation = (fideliData && fideliData[0]) || null;

      // Répartition par catégorie (% Couleur/Mèches-Balayage/Soins ou équivalent propre au
      // client) : appel séparé, volontairement non bloquant -- sur un client qui n'a pas encore
      // le patch généricité secteur, le reste du tableau de bord continue de fonctionner, sans
      // ces indicateurs plutôt qu'en erreur.
      try{
        const [{data: salonCats, error: ec1}, {data: collabCats, error: ec2}] = await Promise.all([
          supa.rpc("dashboard_salon_categories", {p_salon_id: salon.id, p_debut: debut, p_fin: fin}),
          supa.rpc("dashboard_collaborateurs_categories", {p_salon_id: salon.id, p_debut: debut, p_fin: fin})
        ]);
        if (!ec1 && ui.dashboardSalon) ui.dashboardSalon.categories = salonCats || [];
        if (!ec2){
          const parCollab = {};
          (collabCats || []).forEach(row => {
            (parCollab[row.collaborateur_id] = parCollab[row.collaborateur_id] || []).push(row);
          });
          ui.dashboardCollabs.forEach(c => { c.categories = parCollab[c.collaborateur_id] || []; });
        }
      }catch(e){ /* silencieux : indicateurs non essentiels au reste du tableau de bord */ }
    }catch(err){
      ui.adminMsg = "Erreur : " + (err.message || err); ui.adminMsgErr = true;
    }
    ui.dashboardChargement = false;
  }

  }

  // Rend un champ gamme/catégorie en LISTE DE SÉLECTION (jamais en saisie libre) parmi les valeurs
  // déjà utilisées dans le catalogue, avec une option "+ Nouvelle…" qui révèle un champ texte pour
  // en créer une — ça évite qu'un même concept se retrouve sous plusieurs orthographes différentes
  // d'un salon à l'autre (ex. "Coloration" / "coloration " / "Colo"). Le champ texte est toujours
  // présent dans le DOM (juste masqué) et basculé en pur JS (wireChampSelectionGammeCategorie),
  // sans re-rendu, pour ne pas perdre les autres champs du formulaire en cours de saisie — même
  // principe que htmlChampExtra/wireChampExtraListe. Utilise des classes (pas des id) car le
  // panneau d'édition produit réutilise le gabarit générique du catalogue (cat-edit-*), commun à
  // Prestations/Forfaits/Produits.
  // Une ligne de mapping pour une gamme/catégorie du fichier d'import absente du catalogue :
  // par défaut "Créer telle quelle" (comportement historique), avec la possibilité de la
  // rattacher à une gamme/catégorie déjà utilisée ailleurs dans le catalogue à la place.
  function htmlChampMappingImport(champ, valeurBrute, options, valeurChoisie){
    const label = champ === "gamme" ? "Gamme" : "Catégorie";
    const val = valeurChoisie || "__nouveau__";
    return '<div class="champ-bloc full"><label class="mini-label">' + label + ' (nouvelle)</label>' +
      '<p class="lreal" style="margin:0 0 4px;">« ' + escapeHtml(valeurBrute) + ' »</p>' +
      '<select class="import-mapping-' + champ + '" data-brute="' + escapeHtml(valeurBrute) + '">' +
        '<option value="__nouveau__"' + (val==='__nouveau__'?' selected':'') + '>Créer cette nouvelle ' + label.toLowerCase() + ' telle quelle</option>' +
        options.map(o => '<option value="' + escapeHtml(o) + '"' + (val===o?' selected':'') + '>Utiliser la ' + label.toLowerCase() + ' existante « ' + escapeHtml(o) + ' » à la place</option>').join('') +
      '</select></div>';
  }
  // nom = "class" (formulaire de modification, panneau cat-edit-*, plusieurs peuvent exister dans
  // le DOM sans se gêner car un seul est ouvert à la fois) ou "id" (formulaire de création,
  // toujours unique sur la page). Même composant utilisé aux deux endroits pour que la création
  // d'un produit propose exactement les mêmes champs/options que sa modification.
  function htmlChampSelectionGammeCategorie(champ, label, options, valeurActuelle, nom){
    nom = nom || "class";
    const base = (nom === "id" ? "cat-" : "cat-edit-") + champ;
    const attrSel = nom + '="' + base + '"';
    const attrTxt = nom + '="' + base + '-nouveau"';
    return '<div class="champ-bloc"><label class="mini-label">' + escapeHtml(label) + '</label>' +
      '<select ' + attrSel + '>' +
        '<option value="">(aucune)</option>' +
        options.map(o => '<option value="' + escapeHtml(o) + '"' + (valeurActuelle===o ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('') +
        '<option value="__nouveau__">+ Nouvelle ' + escapeHtml(label.toLowerCase()) + '…</option>' +
      '</select>' +
      '<input type="text" ' + attrTxt + ' style="margin-top:6px;" placeholder="Nom de la nouvelle ' + escapeHtml(label.toLowerCase()) + '" hidden>' +
    '</div>';
  }
  // Lit la valeur choisie (ou la valeur du champ "nouveau" si "+ Nouvelle…" est sélectionné).
  // nom="id" : formulaire de création (lecture par id, document entier). nom="class" (défaut) :
  // formulaire de modification (lecture par classe, dans le panneau el fourni).
  function lireChampSelectionGammeCategorie(champ, nom, el){
    nom = nom || "class";
    const base = (nom === "id" ? "cat-" : "cat-edit-") + champ;
    const sel = nom === "id" ? document.getElementById(base) : el.querySelector("." + base);
    if (!sel) return "";
    if (sel.value !== "__nouveau__") return sel.value.trim();
    const txt = nom === "id" ? document.getElementById(base + "-nouveau") : el.querySelector("." + base + "-nouveau");
    return txt ? txt.value.trim() : "";
  }
  function wireChampSelectionGammeCategorie(el, champ, nom){
    nom = nom || "class";
    const base = (nom === "id" ? "cat-" : "cat-edit-") + champ;
    const sel = nom === "id" ? document.getElementById(base) : el.querySelector("." + base);
    const txt = nom === "id" ? document.getElementById(base + "-nouveau") : el.querySelector("." + base + "-nouveau");
    if (!sel || !txt) return;
    const sync = () => { txt.hidden = sel.value !== "__nouveau__"; if (!txt.hidden) txt.focus(); };
    sel.addEventListener("change", sync);
  }

  // ---------------- Réception de commande (scan produit par produit) ----------------
  // Objectif : rentrer d'un coup tous les produits d'une commande reçue, sans repasser par le
  // formulaire "un produit à la fois" ci-dessus. On scanne (ou saisit) le code-barre EAN de
  // chaque produit -- une scanette tape le code très vite, donc on détecte une correspondance
  // exacte dès l'événement "input", exactement comme pour la recherche produit à l'encaissement
  // (voir renderProduitsModal / wireStockSalon) -- la quantité par défaut est 1 et reste
  // modifiable ; un nouveau scan du même produit incrémente sa quantité plutôt que de dupliquer
  // la ligne. Tout est validé en une fois à la fin, catégorie "Réception fournisseur" (déjà
  // créée par défaut), sans étape de sélection de catégorie pour rester rapide.
  function ouvrirReceptionStock(){
    const sa = ui.stockAdmin;
    sa.receptionOuverte = true;
    sa.receptionScan = "";
    sa.receptionLignes = [];
    sa.receptionReference = "";
    sa.receptionMsg = ""; sa.receptionMsgErr = false;
    sa.receptionEnCours = false;
    renderReceptionModal();
  }
  function fermerReceptionModal(){

  function ajouterLigneReception(produitId){
    const sa = ui.stockAdmin;
    const row = sa.items.find(i => i.produit_id === produitId);
    if (!row) return;
    const existante = sa.receptionLignes.find(l => l.produit_id === produitId);
    if (existante) existante.quantite = (Number(existante.quantite) || 0) + 1;
    else sa.receptionLignes.unshift({ produit_id: produitId, nom: row.nom, code_barre: row.code_barre || "", quantite: 1 });
    sa.receptionScan = "";
    sa.receptionMsg = ""; sa.receptionMsgErr = false;
    renderReceptionModal();
  }
  function retirerLigneReception(produitId){
    ui.stockAdmin.receptionLignes = ui.stockAdmin.receptionLignes.filter(l => l.produit_id !== produitId);
    renderReceptionModal();
  }
  async function validerReceptionStock(){
    const sa = ui.stockAdmin;
    if (sa.receptionEnCours) return;
    const lignes = sa.receptionLignes.filter(l => Number(l.quantite) > 0);
    if (lignes.length === 0){ sa.receptionMsg = "Scanne au moins un produit avant de valider."; sa.receptionMsgErr = true; renderReceptionModal(); return; }
    const categorie = sa.categories.find(c => c.actif && c.sens === "entree" && c.libelle === "Réception fournisseur") ||
      sa.categories.find(c => c.actif && c.sens === "entree");
    if (!categorie){ sa.receptionMsg = "Aucune catégorie d'entrée de stock active (Paramètres → Mouvements de stock)."; sa.receptionMsgErr = true; renderReceptionModal(); return; }
    sa.receptionEnCours = true; sa.receptionMsg = ""; renderReceptionModal();
    const reference = sa.receptionReference.trim() || null;
    const nbProduits = lignes.length;
    const nbUnites = lignes.reduce((s, l) => s + Number(l.quantite), 0);
    // Une par une : si l'une échoue (ex. souci réseau), les autres déjà validées ne repassent pas
    // et celles qui restent ne sont pas perdues -- rien à ressaisir, il suffit de refaire "Valider".
    while (lignes.length){
      const ligne = lignes[0];
      try{
        const { error } = await supa.rpc("stock_enregistrer_mouvement", {
          p_produit_id: ligne.produit_id, p_salon_id: salon.id, p_categorie_id: categorie.id, p_quantite: Number(ligne.quantite),
          p_collaborateur_id: ui.collaborateurConnecte ? ui.collaborateurConnecte.id : null, p_commentaire: reference
        });
        if (error) throw error;
        lignes.shift();
        sa.receptionLignes = sa.receptionLignes.filter(l => l.produit_id !== ligne.produit_id);
      }catch(err){
        sa.receptionEnCours = false;
        sa.receptionMsg = "Erreur sur « " + ligne.nom + " » : " + (err.message || err) + " — le reste de la liste est conservé, réessaie.";
        sa.receptionMsgErr = true;
        renderReceptionModal();
        return;
      }
    }
    sa.receptionOuverte = false;
    sa.receptionEnCours = false;
    renderReceptionModal();
    await chargerAdminStock();
    ui.adminMsg = "Réception enregistrée : " + nbProduits + " produit(s), " + nbUnites + " unité(s).";
    ui.adminMsgErr = false;
    renderSectionStockHote();
  }

  // ---------------- import en masse d'un catalogue de produits ----------------
  function normHeaderKey(s){ return normKey(s).replace(/[^a-z0-9]/g, ""); }
  const IMPORT_SYNONYMES = {
    nom: ["name","nom","designation","libelle","produit","article"],
    codeBarre: ["barcode","codebarre","eannumber","ean","codeean"],
    code: ["code","reference","ref","sku"],
    type: ["type"],
    marque: ["marque","brand"],
    gamme: ["range","gamme"],
    famille: ["family","famille"],
    prix: ["prixvente","prix","pvttc","prixttc","prixpublic"],
    prixAchat: ["prixachatht","prixachat","achat","coutachat","cout"],
    archive: ["archived","archive","inactif"]
  };
  function detecterColonnesImport(headersRaw){
    const norm = headersRaw.map(normHeaderKey);
    const idx = {};
    Object.keys(IMPORT_SYNONYMES).forEach(champ => {
      const syns = IMPORT_SYNONYMES[champ];
      let found = -1;
      for (let i = 0; i < norm.length; i++){ if (syns.indexOf(norm[i]) > -1){ found = i; break; } }
      idx[champ] = found;
    });
    // "code" ne doit pas pointer sur la même colonne que "codeBarre"
    if (idx.code === idx.codeBarre) idx.code = -1;
    return idx;
  }
  // Convertit une cellule Excel (nombre ou texte) en texte SANS jamais passer par une
  // représentation d'affichage type notation scientifique : pour un code-barre, .xlsx
  // stocke la vraie valeur numérique en entier (précision exacte jusqu'à 15-16 chiffres),
  // c'est uniquement le format d'AFFICHAGE de la cellule (ou un export CSV depuis Excel)
  // qui la transforme en "3,47464E+12". En lisant le classeur binaire directement (au lieu
  // d'un CSV déjà "cassé" par Excel), on récupère le nombre exact.
  function celluleImportVersTexte(v){
    if (v == null) return "";
    if (typeof v === "number") return String(v);
    return String(v).trim();
  }
  function parseClasseurImportProduits(buf){
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const grille = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true, blankrows: false });
    if (grille.length < 2) throw new Error("Fichier vide ou illisible.");
    const headersRaw = grille[0].map(celluleImportVersTexte);
    const idx = detecterColonnesImport(headersRaw);
    const rows = grille.slice(1).map(ligne => ligne.map(celluleImportVersTexte));
    // sourceNumerique:true signale que les prix viennent de vraies cellules NOMBRE d'un
    // classeur : un prix rond (22) redevient "22" sans séparateur décimal une fois transformé
    // en texte, ce qui fausserait l'heuristique euros/centimes (qui suppose un CSV où la
    // présence d'un séparateur reflète l'écriture d'origine). Pour un classeur, on part donc
    // du principe que les prix sont en euros (cas normal d'un tableur), modifiable via le
    // sélecteur si le fichier utilise vraiment des centimes.
    return { idx, rows, sourceNumerique: true };
  }
  function parseTexteImportProduits(buf){
    const bytes = new Uint8Array(buf);
    let text;
    if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) text = new TextDecoder("utf-16le").decode(new Uint8Array(buf, 2));
    else if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) text = new TextDecoder("utf-16be").decode(new Uint8Array(buf, 2));
    else if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) text = new TextDecoder("utf-8").decode(new Uint8Array(buf, 3));
    else text = new TextDecoder("utf-8").decode(buf);
    const lines = text.split(/\r\n|\r|\n/).filter(l => l.length > 0);
    if (lines.length < 2) throw new Error("Fichier vide ou illisible.");
    const delim = lines[0].indexOf("\t") > -1 ? "\t" : (lines[0].indexOf(";") > -1 && lines[0].indexOf(",") === -1 ? ";" : ",");
    const headersRaw = lines[0].split(delim);
    const idx = detecterColonnesImport(headersRaw);
    const rows = lines.slice(1).map(line => line.split(delim));
    return { idx, rows };
  }
  function parseFichierImportProduits(file){
    const nomFichier = (file.name || "").toLowerCase();
    const estClasseurExcel = /\.(xlsx|xls|xlsm)$/.test(nomFichier);
    return file.arrayBuffer().then(buf => {
      if (estClasseurExcel) return parseClasseurImportProduits(buf);
      return parseTexteImportProduits(buf);
    });
  }
  function analyserApercuImport(parsed){
    const idx = parsed.idx;
    let nbNom = 0, nbPrix = 0, nbCodeBarre = 0, prixAvecSeparateur = 0, prixSansSeparateur = 0;
    const compteType = { retail:0, technical:0, mixed:0, vente:0, technique:0, autre:0 };
    parsed.rows.forEach(cells => {
      const nom = idx.nom > -1 ? (cells[idx.nom]||"").trim() : "";
      const prixRaw = idx.prix > -1 ? (cells[idx.prix]||"").trim() : "";
      const codeBarre = idx.codeBarre > -1 ? (cells[idx.codeBarre]||"").trim() : "";
      if (nom) nbNom++;
      if (prixRaw !== ""){ nbPrix++; if (/[.,]/.test(prixRaw)) prixAvecSeparateur++; else prixSansSeparateur++; }
      if (codeBarre) nbCodeBarre++;
      const typeRaw = idx.type > -1 ? normHeaderKey(cells[idx.type]||"") : "";
      if (typeRaw === "retail") compteType.retail++;
      else if (typeRaw === "vente") compteType.vente++;
      else if (typeRaw === "technical") compteType.technical++;
      else if (typeRaw === "technique") compteType.technique++;
      else if (typeRaw === "mixed" || typeRaw === "mixte") compteType.mixed++;
      else compteType.autre++;
    });
    return {
      totalLignes: parsed.rows.length, nbNom, nbPrix, nbCodeBarre, compteType,
      prixUniteDetectee: parsed.sourceNumerique ? "euros" : ((prixAvecSeparateur > prixSansSeparateur) ? "euros" : "centimes"),
      colonnesReconnues: idx
    };
  }
  // Repère, parmi les gammes/catégories du fichier, celles qui n'existent pas encore dans le
  // catalogue (toutes marques/salons confondus) : on les signale avant l'import plutôt que de les
  // créer silencieusement, pour laisser Enzo choisir de les rattacher à une gamme/catégorie
  // existante (évite les doublons/variantes d'orthographe qui mélangeraient les salons).
  function extraireGammesCategoriesNouvelles(parsed){
    const idx = parsed.idx;
    const gammesExistantes = new Set(listeGammesExistantes());
    const categoriesExistantes = new Set(listeCategoriesExistantes());
    const gammesVues = new Set(), categoriesVues = new Set();
    parsed.rows.forEach(cells => {
      let gamme = idx.gamme > -1 ? (cells[idx.gamme]||"").trim() : "";
      const categorie = idx.famille > -1 ? (cells[idx.famille]||"").trim() : "";
      if (!gamme && idx.famille > -1) gamme = (cells[idx.famille]||"").trim();
      if (gamme) gammesVues.add(gamme);
      if (categorie) categoriesVues.add(categorie);
    });
    return {
      nouvellesGammes: Array.from(gammesVues).filter(g => !gammesExistantes.has(g)).sort((a,b) => a.localeCompare(b,"fr")),
      nouvellesCategories: Array.from(categoriesVues).filter(c => !categoriesExistantes.has(c)).sort((a,b) => a.localeCompare(b,"fr"))
    };
  }
  async function traiterFichierImportProduits(file){
    const pi = ui.produitsImport;
    pi.fichierNom = file.name;
    pi.chargement = true; pi.apercu = null; pi.resultat = null;
    pi.nouvellesGammes = []; pi.nouvellesCategories = []; pi.mappingGamme = {}; pi.mappingCategorie = {};
    ui.adminMsg = ""; ui.adminMsgErr = false;
    renderAdminEquipe();
    try{
      const parsed = await parseFichierImportProduits(file);
      pi._parsed = parsed;
      pi.apercu = analyserApercuImport(parsed);
      pi.prixUnite = pi.apercu.prixUniteDetectee;
      const nouvelles = extraireGammesCategoriesNouvelles(parsed);
      pi.nouvellesGammes = nouvelles.nouvellesGammes;
      pi.nouvellesCategories = nouvelles.nouvellesCategories;
    }catch(err){
      pi._parsed = null;
      ui.adminMsg = "Erreur de lecture du fichier : " + (err.message || err); ui.adminMsgErr = true;
    }
    pi.chargement = false;
    renderAdminEquipe();
  }
  function reinitialiserImportProduits(){
    const pi = ui.produitsImport;
    pi.fichierNom = ""; pi.apercu = null; pi._parsed = null; pi.resultat = null;
    pi.nouvellesGammes = []; pi.nouvellesCategories = []; pi.mappingGamme = {}; pi.mappingCategorie = {};
    ui.adminMsg = ""; ui.adminMsgErr = false;
    const fileInput = document.getElementById("produits-import-file"); if (fileInput) fileInput.value = "";
    renderAdminEquipe();
  }
  function construireLignesImportFinal(){
    const pi = ui.produitsImport;
    const parsed = pi._parsed;
    if (!parsed) return [];
    const idx = parsed.idx;
    const diviseur = pi.prixUnite === "centimes" ? 100 : 1;
    const lignes = [];
    parsed.rows.forEach(cells => {
      const nom = idx.nom > -1 ? (cells[idx.nom]||"").trim() : "";
      if (!nom) return;
      const archiveRaw = idx.archive > -1 ? normHeaderKey(cells[idx.archive]||"") : "";
      if (archiveRaw === "1" || archiveRaw === "true" || archiveRaw === "oui") return;
      const prixRaw = idx.prix > -1 ? (cells[idx.prix]||"").trim().replace(",", ".") : "";
      const prix = prixRaw === "" ? null : parseFloat(prixRaw) / diviseur;
      const prixAchatRaw = idx.prixAchat > -1 ? (cells[idx.prixAchat]||"").trim().replace(",", ".") : "";
      const prixAchat = prixAchatRaw === "" ? null : parseFloat(prixAchatRaw) / diviseur;
      const codeBarre = idx.codeBarre > -1 ? (cells[idx.codeBarre]||"").trim() : "";
      const code = idx.code > -1 ? (cells[idx.code]||"").trim() : "";
      const marqueFichier = idx.marque > -1 ? (cells[idx.marque]||"").trim() : "";
      const marque = marqueFichier || pi.marqueDefaut.trim();
      let gamme = idx.gamme > -1 ? (cells[idx.gamme]||"").trim() : "";
      let categorie = idx.famille > -1 ? (cells[idx.famille]||"").trim() : "";
      if (!gamme && idx.famille > -1) gamme = (cells[idx.famille]||"").trim();
      // gamme/catégorie absentes du catalogue : rattachées à une valeur existante si Enzo l'a
      // choisi dans l'aperçu (voir extraireGammesCategoriesNouvelles), sinon créées telles quelles.
      if (gamme && pi.mappingGamme[gamme] && pi.mappingGamme[gamme] !== "__nouveau__") gamme = pi.mappingGamme[gamme];
      if (categorie && pi.mappingCategorie[categorie] && pi.mappingCategorie[categorie] !== "__nouveau__") categorie = pi.mappingCategorie[categorie];
      const typeRaw = idx.type > -1 ? normHeaderKey(cells[idx.type]||"") : "";
      let typeStock;
      if (typeRaw === "retail" || typeRaw === "vente") typeStock = "vente";
      else if (typeRaw === "technical" || typeRaw === "technique") typeStock = "technique";
      else if (typeRaw === "mixed" || typeRaw === "mixte") typeStock = pi.mixedVers;
      else typeStock = pi.typeDefaut;
      const prixAchatArrondi = (prixAchat == null || isNaN(prixAchat)) ? null : Math.round(prixAchat*100)/100;
      let prixFinal = (prix == null || isNaN(prix)) ? null : Math.round(prix*100)/100;
      // mode coefficient : le prix de vente est TOUJOURS recalculé depuis le prix d'achat de la
      // ligne, même si le fichier contient une colonne de prix de vente (on l'ignore alors) ;
      // sans prix d'achat sur la ligne, impossible de calculer -> prix laissé à null (la RPC
      // ignorera la ligne, comme pour toute ligne sans prix, avec le motif habituel).
      if (pi.modePrixVente === "coefficient"){
        const coefficient = parseFloat(String(pi.coefficientPrixVente).replace(",", "."));
        prixFinal = (prixAchatArrondi != null && !isNaN(coefficient)) ? Math.round(prixAchatArrondi * coefficient * 100) / 100 : null;
      }
      lignes.push({
        nom, marque: marque || null, gamme: gamme || null, categorie: categorie || null, type_stock: typeStock,
        prix: prixFinal,
        prix_achat: prixAchatArrondi,
        code: code || null, code_barre: codeBarre || null
      });
    });
    return lignes;
  }
  // Regroupe les lignes par code_barre et signale celles portées par plusieurs noms de produit
  // distincts (normalisés) : un vrai code-barre identifie un seul produit, donc plusieurs noms
  // différents sur le même code-barre trahit presque toujours une colonne corrompue plutôt que
  // de vraies lignes dupliquées (celles-ci, elles, partagent le même nom).
  function detecterCollisionsCodeBarreImport(lignes){
    const parCode = {};
    lignes.forEach(l => {
      if (!l.code_barre) return;
      if (!parCode[l.code_barre]) parCode[l.code_barre] = [];
      parCode[l.code_barre].push(l.nom);
    });
    const collisions = [];
    Object.keys(parCode).forEach(code => {
      const noms = parCode[code];
      const distincts = Array.from(new Set(noms.map(n => normKey(n))));
      if (distincts.length > 1){
        collisions.push({ code_barre: code, noms: Array.from(new Set(noms)) });
      }
    });
    return collisions;
  }
  async function lancerImportProduits(){
    const pi = ui.produitsImport;
    if (!pi._parsed){ ui.adminMsg = "Choisis d'abord un fichier."; ui.adminMsgErr = true; renderAdminEquipe(); return; }
    const salonIds = Array.from(pi.salonIds);
    if (salonIds.length === 0){ ui.adminMsg = "Choisis au moins un salon."; ui.adminMsgErr = true; renderAdminEquipe(); return; }
    if (pi.modePrixVente === "coefficient"){
      const coefficient = parseFloat(String(pi.coefficientPrixVente).replace(",", "."));
      if (!pi.coefficientPrixVente || isNaN(coefficient) || coefficient <= 0){
        ui.adminMsg = "Indique un coefficient valide (ex. 2.2) pour calculer le prix de vente depuis le prix d'achat.";
        ui.adminMsgErr = true; renderAdminEquipe(); return;
      }
    }
    const lignes = construireLignesImportFinal();
    if (lignes.length === 0){ ui.adminMsg = "Aucune ligne exploitable dans ce fichier."; ui.adminMsgErr = true; renderAdminEquipe(); return; }
    // Garde-fou : un même code-barre partagé par plusieurs produits DIFFÉRENTS dans le fichier
    // est presque toujours un signe de corruption (ex. Excel qui convertit la colonne code-barre
    // en notation scientifique, ce qui fait qu'un seul produit sur X survit et écrase tous les
    // autres au fil de l'import). On bloque plutôt que de laisser cet écrasement silencieux se
    // produire — voir le motif du 61 créés / 1154 mis à jour rencontré en pratique.
    const collisions = detecterCollisionsCodeBarreImport(lignes);
    if (collisions.length > 0){
      const exemple = collisions[0];
      ui.adminMsg = "Import bloqué : " + collisions.length + (collisions.length > 1 ? " codes-barres sont partagés" : " code-barre est partagé") + " par plusieurs produits différents dans le fichier " +
        "(ex. « " + exemple.code_barre + " » porté par " + exemple.noms.length + " produits différents, dont " + exemple.noms.slice(0,3).map(n => '"' + n + '"').join(", ") + "). " +
        "C'est le signe d'une colonne code-barre corrompue (souvent une conversion en notation scientifique dans Excel, ex. « 3,47464E+12 »). " +
        "Le plus simple : réimporte directement le fichier .xlsx d'origine (pas un .csv réexporté depuis Excel) — il est lu tel quel et les codes-barres restent exacts. " +
        "Sinon, ouvre le fichier source, formate la colonne code-barre en TEXTE (pas Nombre), réexporte, puis réimporte.";
      ui.adminMsgErr = true; renderAdminEquipe(); return;
    }
    pi.chargement = true; pi.resultat = null;
    ui.adminMsg = ""; ui.adminMsgErr = false;
    renderAdminEquipe();
    try{
      const { data, error } = await supa.rpc("admin_importer_catalogue_produits", { p_lignes: lignes, p_salon_ids: salonIds });
      if (error) throw error;
      const r = (data && data[0]) || { crees:0, mis_a_jour:0, ignores:[] };
      pi.resultat = r;
      ui.adminMsg = r.crees + " produit(s) créé(s), " + r.mis_a_jour + " mis à jour" + ((r.ignores && r.ignores.length) ? ", " + r.ignores.length + " ignoré(s)." : ".");
      ui.adminMsgErr = false;
      await chargerAdminCatalogue("produits");
    }catch(err){
      ui.adminMsg = "Erreur import : " + (err.message || err); ui.adminMsgErr = true;
    }
    pi.chargement = false;
    renderAdminEquipe();
  }

  // ---------------- Stock (page libre du menu salon) ----------------
  // Reprend les données et actions du Stock back-office (ui.stockAdmin, ouvrirMouvementStock,
  // chargerHistoriqueStock…) dans une mise en page plus lisible (KPI, actions recommandées,
  // filtres, recherche, répartition par catégorie) — sans aucune donnée inventée : tout vient
  // de admin_lister_stock_salon (stock, seuil, prix, prix d'achat, catégorie, type).
  const STOCK_DONUT_PALETTE = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#4a3aa7"];
  const STOCK_DONUT_GRIS = "#898781";
  function calculerVueStockSalon(){
    const sa = ui.stockAdmin;
    const enrichis = (sa.items || []).map(it => {
      // Un produit jamais réellement stocké dans ce salon (catalogue groupe importé mais jamais
      // commandé ici) ne doit jamais remonter en "Rupture" ni "Stock faible" -- sinon, dès que le
      // catalogue complet du groupe est rattaché à tous les salons, les Actions recommandées de
      // l'Accueil se retrouvent polluées de produits qu'un salon n'a en réalité jamais utilisés.
      const rupture = !!it.deja_stocke && it.stock <= 0;
      const faible = !rupture && !!it.deja_stocke && !!it.alerte;
      return Object.assign({}, it, { rupture: rupture, faible: faible });
    });
    const compte = {
      tous: enrichis.length,
      faible: enrichis.filter(it => it.faible).length,
      rupture: enrichis.filter(it => it.rupture).length,
      vente: enrichis.filter(it => it.type_stock === "vente").length,
      technique: enrichis.filter(it => it.type_stock === "technique").length
    };
    let filtres = enrichis;
    if (sa.salonFiltreStatut === "faible") filtres = filtres.filter(it => it.faible);
    else if (sa.salonFiltreStatut === "rupture") filtres = filtres.filter(it => it.rupture);
    else if (sa.salonFiltreStatut === "vente") filtres = filtres.filter(it => it.type_stock === "vente");
    else if (sa.salonFiltreStatut === "technique") filtres = filtres.filter(it => it.type_stock === "technique");
    const qNorm = normKey(sa.salonRecherche || "");
    const qBrut = (sa.salonRecherche || "").trim();
    if (qNorm){
      filtres = filtres.filter(it =>
        normKey(it.nom).indexOf(qNorm) > -1 ||
        normKey(it.marque || "").indexOf(qNorm) > -1 ||
        normKey(it.gamme || "").indexOf(qNorm) > -1 ||
        (it.code_barre || "").indexOf(qBrut) > -1
      );
    }
    filtres = filtres.slice().sort((a,b) => a.nom.localeCompare(b.nom, "fr"));
    const valeurStock = enrichis.reduce((s,it) => s + it.stock * (it.prix_achat != null ? it.prix_achat : it.prix), 0);
    return { enrichis: enrichis, compte: compte, filtres: filtres, valeurStock: valeurStock };
  }
  function calculerRepartitionCategoriesStock(enrichis){
    const parCat = {};
    enrichis.forEach(it => {
      const valeur = it.stock * (it.prix_achat != null ? it.prix_achat : it.prix);
      if (!(valeur > 0)) return;
      const cat = it.categorie || "Sans catégorie";
      parCat[cat] = (parCat[cat] || 0) + valeur;
    });
    let entries = Object.keys(parCat).map(k => ({ label: k, valeur: parCat[k] })).sort((a,b) => b.valeur - a.valeur);
    if (entries.length > 6){
      const tete = entries.slice(0, 5);
      const reste = entries.slice(5).reduce((s,e) => s + e.valeur, 0);
      entries = tete.concat([{ label: "Autres", valeur: reste }]);
    }
    const total = entries.reduce((s,e) => s + e.valeur, 0);
    return { entries: entries, total: total };
  }

    } else {

  function htmlDonutCategoriesStock(repartition){
    const entries = repartition.entries, total = repartition.total;
    let html = '<div class="stock-donut-card"><h3>Répartition du stock par catégorie</h3>';
    if (entries.length === 0 || total <= 0){
      html += '<p class="panier-empty">Pas encore de valeur de stock à répartir.</p></div>';
      return html;
    }
    const size = 160, r = 58, cx = size/2, cy = size/2, sw = 22, C = 2*Math.PI*r, gap = 3;
    let cum = 0, cercles = "";
    entries.forEach((e,i) => {
      const frac = e.valeur / total;
      const segLen = Math.max(frac * C - gap, 0);
      const color = e.label === "Autres" ? STOCK_DONUT_GRIS : (STOCK_DONUT_PALETTE[i] || STOCK_DONUT_GRIS);
      cercles += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + sw +
        '" stroke-dasharray="' + segLen + ' ' + (C - segLen) + '" stroke-dashoffset="' + (-cum) +
        '" transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + escapeHtml(e.label) + ' — ' + fmt(e.valeur) + '</title></circle>';
      cum += frac * C;
    });
    html += '<div class="donut-wrap"><svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="Répartition de la valeur du stock par catégorie">' + cercles + '</svg>' +
      '<div class="donut-center"><div class="v">' + fmt(total) + '</div><div class="k">Valeur totale</div></div></div>';
    html += '<div class="donut-legend">' + entries.map((e,i) => {
      const color = e.label === "Autres" ? STOCK_DONUT_GRIS : (STOCK_DONUT_PALETTE[i] || STOCK_DONUT_GRIS);
      const pct = Math.round(e.valeur / total * 100);
      return '<div class="donut-legend-row"><span class="sw" style="background:' + color + ';"></span>' +
        '<span class="lbl">' + escapeHtml(e.label) + '</span><span class="pct">' + pct + '%</span><span class="val num">' + fmt(e.valeur) + '</span></div>';
    }).join('') + '</div>';
    html += '</div>';
    return html;
  }

  // ---------------- Classement du mois (menu latéral, desktop) ----------------
  // Deux positions affichées en continu : celle du salon face aux autres salons du groupe
  // (CA total du mois), et celle du collaborateur connecté face à son équipe du salon (CA total
  // ET CA vente produits). Toujours sur le mois en cours, visible de tout collaborateur connecté.
  // Confort d'affichage, jamais bloquant : une erreur réseau garde le dernier classement connu
  // sans jamais perturber le reste de l'app (voir catch ci-dessous).
  async function chargerClassements(){
    if (!salon) return;
    try{
      const { debut, fin } = bornesPeriode("mois");
      const [{ data: salonsClasses, error: e1 }, { data: equipe, error: e2 }] = await Promise.all([
        supa.rpc("classement_salons_mois"),
        ui.collaborateurConnecte
          ? supa.rpc("dashboard_collaborateurs", {p_salon_id: salon.id, p_debut: debut, p_fin: fin})
          : Promise.resolve({data: null, error: null})
      ]);
      if (e1) throw e1;
      if (e2) throw e2;

      let classSalon = null;
      if (salonsClasses && salonsClasses.length){
        const idx = salonsClasses.findIndex(s => s.salon_id === salon.id);
        // idx === -1 pour le Salon Pilote (volontairement hors classement, cf.
        // supabase-patch-classement.sql) -- classSalon reste null, "hors classement" à l'affichage.
        if (idx >= 0){
          classSalon = {
            rang: salonsClasses[idx].rang, total: salonsClasses.length, ca_total: Number(salonsClasses[idx].ca_total),
            ecart: idx > 0 ? Number(salonsClasses[idx - 1].ca_total) - Number(salonsClasses[idx].ca_total) : 0
          };
        }
      }

      let classCollabTotal = null, classCollabVente = null;
      if (equipe && equipe.length && ui.collaborateurConnecte){
        const parTotal = equipe.slice().sort((a,b) => Number(b.ca_total) - Number(a.ca_total));
        const parVente = equipe.slice().sort((a,b) => Number(b.ca_produits) - Number(a.ca_produits));
        const iTotal = parTotal.findIndex(c => c.collaborateur_id === ui.collaborateurConnecte.id);
        const iVente = parVente.findIndex(c => c.collaborateur_id === ui.collaborateurConnecte.id);
        if (iTotal >= 0) classCollabTotal = {rang: iTotal + 1, total: parTotal.length};
        if (iVente >= 0) classCollabVente = {rang: iVente + 1, total: parVente.length};
      }

      ui.classement = {salon: classSalon, collabTotal: classCollabTotal, collabVente: classCollabVente};
    }catch(err){
      if (!ui.classement) ui.classement = {salon:null, collabTotal:null, collabVente:null};
    }
    renderSidebar();
  }

  function wireSectionAccueil(el){
    el.querySelectorAll("[data-accueil-tuile]").forEach(btn => btn.addEventListener("click", () => activerSidebarItem(btn.getAttribute("data-accueil-tuile"))));
    el.querySelectorAll("[data-accueil-voir-tout]").forEach(btn => btn.addEventListener("click", () => {
      const cible = btn.getAttribute("data-accueil-voir-tout");
      if (cible === "journal"){
        activerSidebarItem("journal");
      } else if (cible === "stocks"){
        activerSidebarItem("stock");
      }
    }));
    // ---- devis & tickets en attente ----
    el.querySelectorAll("[data-reprendre-attente]").forEach(row => row.addEventListener("click", (e) => {
      if (e.target.closest("[data-annuler-attente]")) return;
      const id = row.getAttribute("data-reprendre-attente");
      if (ui.collaborateurConnecte){ reprendreTicketAttente(id); return; }
      // pas encore de collaborateur connecté sur ce poste : on retient le ticket à reprendre,
      // on ouvre la Caisse (qui demandera le code personnel), et validerCodeGate() enchaînera.
      ui.reprendreApresConnexionId = id;
      activerSidebarItem("caisse");
    }));
    el.querySelectorAll("[data-annuler-attente]").forEach(btn => btn.addEventListener("click", (e) => {
      e.stopPropagation();
      demanderAnnulationAttente(btn.getAttribute("data-annuler-attente"));
    }));
    const attenteAnnulerNon = document.getElementById("attente-annuler-non");
    if (attenteAnnulerNon) attenteAnnulerNon.addEventListener("click", annulerConfirmationAttente);
    const attenteAnnulerOui = document.getElementById("attente-annuler-oui");
    if (attenteAnnulerOui) attenteAnnulerOui.addEventListener("click", confirmerAnnulationAttente);
  }

  // ---------------- Produits (menu salon : consultation seule, sans code) ----------------
  // Le catalogue produits (prix, marque, code…) est géré uniquement depuis le back-office
  // (Paramètres → Produits) ; ici, en salon, on consulte juste ce qui est disponible et son prix.
  // Classement horizontal générique -- un seul indicateur, trié décroissant, barre pleine
  // colorée selon un statut optionnel (haut/bas d'une moyenne) plutôt qu'un dégradé arbitraire.
  function htmlBarreClassement(titre, items, opts){
    opts = opts || {};
    const fv = opts.formatValeur || (v => fmt(v));
    let html = '<div class="dash-panel">';
    html += '<div class="dashboard-section-title">' + escapeHtml(titre) + '</div>';
    if (!items || items.length === 0){
      return html + '<p class="panier-empty">Pas encore de données sur cette période.</p></div>';
    }
    const maxV = Math.max(1, ...items.map(it => Number(it.valeur) || 0));
    html += '<div class="dash-bar-list">';
    items.forEach(it => {
      const v = Number(it.valeur) || 0;
      const pct = Math.max(2, Math.round((v / maxV) * 100));
      html += '<div class="dash-bar-row">' +
        '<div class="lbl">' + escapeHtml(it.label) + '</div>' +
        '<div class="track"><div class="fill" style="width:' + pct + '%;"></div></div>' +
        '<div class="val num">' + fv(v) + '</div>' +
        '</div>';
    });
    html += '</div></div>';
    return html;
  }

  function htmlDiffBadge(diff, opts){
    opts = opts || {};
    const fv = opts.formatValeur || (v => fmt(v));
    const neutre = Math.abs(diff) < (opts.seuilNeutre || 0.5);
    const couleur = neutre ? "var(--ink-soft)" : (diff > 0 ? "var(--success)" : "var(--danger)");
    const signe = diff > 0 ? "+" : "";
    return '<span style="color:' + couleur + '; font-weight:700;">' + signe + fv(diff) + '</span>';
  }
