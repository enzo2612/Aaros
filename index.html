  // ---------------- Droits d'accès (Paramètres) ----------------
  // Catalogue des actions gateables par rôle. La direction a toujours tous les droits (colonne
  // affichée mais non modifiable). Facile à étendre : ajouter une entrée ici suffit, la table
  // permissions_role et l'UI s'adaptent automatiquement (chargerAdminPermissions les fusionne).
  const PERMISSIONS_CATALOGUE = [
    {cle:"modifier_ticket", label:"Corriger une fiche encaissée", detail:"Moyen de paiement, collaborateur d'une prestation"},
    {cle:"annuler_ticket", label:"Annuler une fiche encaissée", detail:"Erreur de manipulation — la fiche reste tracée, elle sort seulement des totaux"}
  ];
  async function chargerAdminPermissions(){
    ui.permissionsChargement = true; ui.permissionsMsg = ""; ui.permissionsMsgErr = false;
    try{
      const { data, error } = await supa.rpc("lister_permissions_role");
      if (error) throw error;
      ui.permissionsMatrice = data || [];
    }catch(err){
      ui.permissionsMsg = "Erreur de chargement : " + (err.message || err); ui.permissionsMsgErr = true;
    }
    ui.permissionsChargement = false;
  }
  function droitAutorise(role, cle){
    const row = ui.permissionsMatrice.find(r => r.role === role && r.cle === cle);
    return row ? !!row.autorise : false;
  }
  function htmlSectionDroits(){
    let html = '<h3>Droits d\'accès</h3>';
    html += '<p class="hint">Coche les actions autorisées pour les autres rôles — le changement s\'applique immédiatement à toute l\'équipe, sur les 14 salons.</p>';
    if (ui.permissionsChargement){
      html += '<p class="hint">Chargement…</p>';
      return html;
    }
    html += '<div class="table-scroll"><table class="collab-table"><thead><tr>' +
      '<th>Action</th><th style="text-align:center;">Collaborateur</th><th style="text-align:center;">Responsable</th><th style="text-align:center;">Direction</th>' +
      '</tr></thead><tbody>';
    PERMISSIONS_CATALOGUE.forEach(p => {
      html += '<tr><td>' + escapeHtml(p.label) + (p.detail ? '<div class="hint" style="margin-top:2px;">' + escapeHtml(p.detail) + '</div>' : '') + '</td>' +
        '<td style="text-align:center;"><input type="checkbox" class="droit-toggle" data-role="collaborateur" data-cle="' + p.cle + '"' + (droitAutorise("collaborateur", p.cle) ? ' checked' : '') + '></td>' +
        '<td style="text-align:center;"><input type="checkbox" class="droit-toggle" data-role="responsable" data-cle="' + p.cle + '"' + (droitAutorise("responsable", p.cle) ? ' checked' : '') + '></td>' +
        '<td style="text-align:center;"><input type="checkbox" checked disabled title="La direction a toujours tous les droits"></td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    if (ui.permissionsMsg) html += '<div class="' + (ui.permissionsMsgErr ? "err-toast" : "receipt-toast") + '" style="margin-top:14px;">' + escapeHtml(ui.permissionsMsg) + '</div>';
    return html;
  }
  function wireSectionDroits(el){
    el.querySelectorAll(".droit-toggle").forEach(chk => {
      chk.addEventListener("change", () => toggleDroit(chk.getAttribute("data-role"), chk.getAttribute("data-cle"), chk.checked));
    });
  }
  async function toggleDroit(role, cle, autorise){
    try{
      const { error } = await supa.rpc("definir_permission_role", { p_role: role, p_cle: cle, p_autorise: autorise, p_collaborateur_id: ui.collaborateurConnecte ? ui.collaborateurConnecte.id : null });
      if (error) throw error;
      const row = ui.permissionsMatrice.find(r => r.role === role && r.cle === cle);
      if (row) row.autorise = autorise; else ui.permissionsMatrice.push({role, cle, autorise});
      ui.permissionsMsg = "Enregistré."; ui.permissionsMsgErr = false;
      // Si la personne actuellement connectée est concernée, on rafraîchit son propre cache de
      // droits tout de suite (sinon elle ne verrait le changement qu'à sa prochaine connexion).
      if (ui.collaborateurConnecte && ui.collaborateurConnecte.role === role) await chargerMesPermissions(ui.collaborateurConnecte.id);
    }catch(err){
      ui.permissionsMsg = "Erreur : " + (err.message || err); ui.permissionsMsgErr = true;
    }
    renderAdminEquipe();
  }

  // ---------------- Suivi caisse (Paramètres, contrôle bureau) ----------------
  // Regroupe les deux outils de contrôle du bureau : le suivi des dépôts (tous salons, sur une
  // période libre) et la statistique de caisse mensuelle (un salon à la fois, export imprimable).
  // Une sous-navigation locale permet de basculer entre les deux sans repasser par le menu latéral.
  async function chargerSuiviCaisse(){
    if (ui.suiviCaisseOnglet === "stats") await chargerStatistiqueCaisse();
    else await chargerSuiviDepots();
  }
  function changerSousOngletCaisse(onglet){
    if (ui.suiviCaisseOnglet === onglet) return;
    ui.suiviCaisseOnglet = onglet;
    renderAdminEquipe();
    (onglet === "stats" ? chargerStatistiqueCaisse() : chargerSuiviDepots()).then(renderAdminEquipe);
  }
  function htmlSectionCaisseSuivi(){
    let html = '<div class="admin-nav" style="margin-bottom:16px;">' +
      '<button type="button" class="admin-nav-btn' + (ui.suiviCaisseOnglet !== "stats" ? ' active' : '') + '" data-souscaisse="depots">Suivi dépôts</button>' +
      '<button type="button" class="admin-nav-btn' + (ui.suiviCaisseOnglet === "stats" ? ' active' : '') + '" data-souscaisse="stats">Statistique de caisse</button>' +
      '</div>';

  function wireSectionCaisseSuivi(el){
    el.querySelectorAll("[data-souscaisse]").forEach(btn => {
      btn.addEventListener("click", () => changerSousOngletCaisse(btn.getAttribute("data-souscaisse")));

    else wireSectionDepots(el);

  // Suivi des dépôts en banque : vérifie qu'un dépôt physique reçu par le bureau (photo du
  // bordereau, ex. « 3500€ du 1er au 15 ») correspond bien à la somme des dépôts saisis en
  // clôture sur cette période, salon par salon. Le détail par clôture permet de retrouver
  // rapidement quel jour ne colle pas.
  async function chargerSuiviDepots(){
    if (!ui.suiviDepotsDebut){
      const d = new Date(); d.setDate(1);
      ui.suiviDepotsDebut = fmtDateInput(d);
    }
    if (!ui.suiviDepotsFin) ui.suiviDepotsFin = fmtDateInput(new Date());
    ui.suiviDepotsSalonOuvert = null;
    await rafraichirSuiviDepots();
  }
  async function rafraichirSuiviDepots(){
    ui.suiviDepotsChargement = true; renderAdminEquipe();
    try{
      const { data, error } = await supa.rpc("suivi_depots_periode", {p_debut: ui.suiviDepotsDebut, p_fin: ui.suiviDepotsFin});
      if (error) throw error;
      ui.suiviDepotsLignes = data || [];
    }catch(err){
      ui.suiviDepotsLignes = [];
      ui.adminMsg = "Erreur : " + (err.message || err); ui.adminMsgErr = true;
    }
    ui.suiviDepotsChargement = false;
    renderAdminEquipe();
  }
  async function ouvrirDetailSuiviDepots(salonId){
    if (ui.suiviDepotsSalonOuvert === salonId){ ui.suiviDepotsSalonOuvert = null; renderAdminEquipe(); return; }
    ui.suiviDepotsSalonOuvert = salonId;
    ui.suiviDepotsDetail = []; ui.suiviDepotsDetailChargement = true;
    renderAdminEquipe();
    try{
      const { data, error } = await supa.rpc("suivi_depots_detail", {p_salon_id: salonId, p_debut: ui.suiviDepotsDebut, p_fin: ui.suiviDepotsFin});
      if (!error) ui.suiviDepotsDetail = data || [];
    }catch(err){ /* la liste reste vide, pas bloquant */ }
    ui.suiviDepotsDetailChargement = false;
    renderAdminEquipe();
  }
  function htmlSectionDepots(){
    let html = '<h3>Suivi des dépôts en banque</h3>';
    html += '<div class="comptage-actions" style="margin:14px 0 18px; align-items:flex-end;">' +
      '<div class="comptage-autre" style="margin-top:0;"><label>Du</label><input type="date" id="depots-debut" value="' + ui.suiviDepotsDebut + '"></div>' +
      '<div class="comptage-autre" style="margin-top:0;"><label>Au</label><input type="date" id="depots-fin" value="' + ui.suiviDepotsFin + '" max="' + fmtDateInput(new Date()) + '"></div>' +
      '</div>';
    if (ui.suiviDepotsChargement){
      html += '<p class="hint">Chargement…</p>';
      return html;
    }
    const totalGeneral = ui.suiviDepotsLignes.reduce((s, l) => s + Number(l.total_depot || 0), 0);
    html += '<div class="table-scroll"><table class="collab-table"><thead><tr>' +
      '<th>Salon</th><th style="text-align:center;">Nb dépôts</th><th style="text-align:right;">Total déposé</th><th></th></tr></thead><tbody>';
    ui.suiviDepotsLignes.forEach(l => {
      const ouvert = ui.suiviDepotsSalonOuvert === l.salon_id;
      html += '<tr><td>' + escapeHtml(l.salon_nom) + '</td>' +
        '<td style="text-align:center;">' + l.nb_depots + '</td>' +
        '<td style="text-align:right;" class="num">' + fmt(l.total_depot) + '</td>' +
        '<td><button type="button" class="btn ghost sm" data-detail-depot="' + l.salon_id + '">' + (ouvert ? 'Fermer' : 'Détail') + '</button></td></tr>';
      if (ouvert){
        html += '<tr><td colspan="4">';
        if (ui.suiviDepotsDetailChargement){
          html += '<p class="hint">Chargement…</p>';
        } else if (ui.suiviDepotsDetail.length === 0){
          html += '<p class="hint">Aucun dépôt sur cette période pour ce salon.</p>';
        } else {
          html += '<div class="depense-liste">' + ui.suiviDepotsDetail.map(d =>
            '<div class="depense-item"><span>' + fmtTime(d.horodatage) + (d.depot_reference ? ' — ' + escapeHtml(d.depot_reference) : '') + '</span><span class="num">' + fmt(d.montant_depot) + '</span></div>'
          ).join('') + '</div>';
        }
        html += '</td></tr>';
      }
    });
    html += '</tbody></table></div>';
    html += '<div class="comptage-total" style="margin-top:10px; font-size:15px;">Total général sur la période : <b class="num">' + fmt(totalGeneral) + '</b></div>';
    return html;
  }
  function wireSectionDepots(el){
    const debutInp = el.querySelector("#depots-debut");
    if (debutInp) debutInp.addEventListener("change", () => { if (debutInp.value) { ui.suiviDepotsDebut = debutInp.value; ui.suiviDepotsSalonOuvert = null; rafraichirSuiviDepots(); } });
    const finInp = el.querySelector("#depots-fin");
    if (finInp) finInp.addEventListener("change", () => { if (finInp.value) { ui.suiviDepotsFin = finInp.value; ui.suiviDepotsSalonOuvert = null; rafraichirSuiviDepots(); } });
    el.querySelectorAll("[data-detail-depot]").forEach(btn => {

  // ---------------- Statistique de caisse mensuelle (export bureau, imprimable A4) ----------------
  // Un tableau jour par jour du mois (espèces / CB / chèques réellement encaissés) et un résumé
  // de contrôle : total espèces + fond de caisse du matin du 1er jour - fond de caisse du soir du
  // dernier jour - dépenses ± pertes/profits doit être égal au total déposé en banque sur le mois
  // -- sinon il y a un problème à vérifier avec le salon (signalé en rouge).
  const MOIS_NOMS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  const JOURS_SEMAINE_FR = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
  async function chargerStatistiqueCaisse(){
    if (!ui.statCaisseAnnee || !ui.statCaisseMois){
      const d = new Date();
      ui.statCaisseAnnee = d.getFullYear();
      ui.statCaisseMois = d.getMonth() + 1;
    }
    await rafraichirStatistiqueCaisse();
  }
  async function rafraichirStatistiqueCaisse(){
    ui.statCaisseChargement = true; renderAdminEquipe();
    try{
      const [{ data: jours, error: errJours }, { data: resume, error: errResume }] = await Promise.all([
        supa.rpc("statistique_caisse_jours", {p_salon_id: salon.id, p_annee: ui.statCaisseAnnee, p_mois: ui.statCaisseMois}),
        supa.rpc("statistique_caisse_resume", {p_salon_id: salon.id, p_annee: ui.statCaisseAnnee, p_mois: ui.statCaisseMois})
      ]);
      if (errJours) throw errJours;
      if (errResume) throw errResume;
      ui.statCaisseJours = jours || [];
      ui.statCaisseResume = (resume && resume[0]) || null;
    }catch(err){
      ui.statCaisseJours = []; ui.statCaisseResume = null;
      ui.adminMsg = "Erreur : " + (err.message || err); ui.adminMsgErr = true;
    }
    ui.statCaisseChargement = false;
    renderAdminEquipe();
  }
  function htmlSectionStatistiqueCaisse(){
    const annee = ui.statCaisseAnnee, mois = ui.statCaisseMois;
    let html = '<div class="no-print">' +
      '<h3>Statistique de caisse mensuelle</h3>' +
      '<p class="hint">Export mensuel pour le contrôle du bureau : détail jour par jour et contrôle de cohérence avec les dépôts en banque.</p>' +
      '<div class="comptage-actions" style="margin:14px 0 18px; align-items:flex-end;">' +
      '<div class="comptage-autre" style="margin-top:0;"><label>Mois</label>' +
      '<select id="statcaisse-mois">' + MOIS_NOMS_FR.map((n,i) => '<option value="' + (i+1) + '"' + (mois===i+1?' selected':'') + '>' + n.charAt(0).toUpperCase()+n.slice(1) + '</option>').join('') + '</select></div>' +
      '<div class="comptage-autre" style="margin-top:0;"><label>Année</label>' +
      '<input type="number" id="statcaisse-annee" value="' + annee + '" min="2020" max="2100" style="width:100px;"></div>' +
      '<button type="button" class="btn ghost" id="btn-imprimer-statcaisse">🖨️ Imprimer</button>' +
      '</div></div>';
    if (ui.statCaisseChargement){
      html += '<p class="hint">Chargement…</p>';
      return html;
    }
    const parJour = {};
    (ui.statCaisseJours || []).forEach(j => { parJour[j.jour] = j; });
    const nbJoursMois = new Date(annee, mois, 0).getDate();
    const r = ui.statCaisseResume || {};
    const totalEspece = Number(r.total_especes) || 0;
    const totalCb = Number(r.total_cb) || 0;
    const totalCheque = Number(r.total_cheque) || 0;
    const totalDepot = Number(r.total_depot) || 0;
    const totalDepenses = Number(r.total_depenses) || 0;
    const totalCaVentes = Number(r.total_ca_ventes) || 0;
    const totalPerteProfit = Number(r.total_perte_profit) || 0;
    const fondMatin = r.fond_caisse_matin_premier_jour === null || r.fond_caisse_matin_premier_jour === undefined ? null : Number(r.fond_caisse_matin_premier_jour);
    const fondSoir = r.fond_caisse_soir_dernier_jour === null || r.fond_caisse_soir_dernier_jour === undefined ? null : Number(r.fond_caisse_soir_dernier_jour);
    const controleOk = fondMatin !== null && fondSoir !== null;
    const depotAttendu = controleOk ? (totalEspece + fondMatin - fondSoir - totalDepenses + totalPerteProfit) : null;
    const ecartControle = controleOk ? (depotAttendu - totalDepot) : null;
    const coherent = controleOk && Math.abs(ecartControle) < 0.01;

    html += '<div class="stat-caisse-page">';
    html += '<div class="stat-caisse-entete"><h2>Statistique de caisse — ' + escapeHtml(salon.nom) + '</h2>' +
      '<p>' + MOIS_NOMS_FR[mois-1].charAt(0).toUpperCase() + MOIS_NOMS_FR[mois-1].slice(1) + ' ' + annee + '</p></div>';

    // Tableau en deux colonnes (1re/2e moitié du mois côte à côte) : indispensable pour que
    // les ~31 lignes tiennent sur une seule feuille A4 à l'impression -- une seule colonne de
    // 31 lignes déborderait toujours sur une deuxième page.
    function construireDemiTableJours(jjDebut, jjFin){
      let t = '<table class="stat-caisse-table"><thead><tr><th>Date</th><th>Esp.</th><th>Chq.</th><th>CB</th></tr></thead><tbody>';
      for (let jj = jjDebut; jj <= jjFin; jj++){
        const dateStr = annee + '-' + String(mois).padStart(2,'0') + '-' + String(jj).padStart(2,'0');
        const d = new Date(annee, mois-1, jj);
        const ligne = parJour[dateStr];
        t += '<tr><td>' + JOURS_SEMAINE_FR[d.getDay()] + ' ' + String(jj).padStart(2,'0') + '</td>' +
          '<td class="num">' + (ligne ? fmt(ligne.total_especes) : '—') + '</td>' +
          '<td class="num">' + (ligne ? fmt(ligne.total_cheque) : '—') + '</td>' +
          '<td class="num">' + (ligne ? fmt(ligne.total_cb) : '—') + '</td></tr>';
      }
      t += '</tbody></table>';
      return t;
    }
    const milieuMois = Math.ceil(nbJoursMois / 2);
    html += '<div class="stat-caisse-jours">' + construireDemiTableJours(1, milieuMois) + construireDemiTableJours(milieuMois + 1, nbJoursMois) + '</div>';

    html += '<div class="stat-caisse-resume"><h3>Résumé du mois</h3><div class="stat-caisse-grille">' +
      '<div><span>Total CB</span><b class="num">' + fmt(totalCb) + '</b></div>' +
      '<div><span>Total espèces</span><b class="num">' + fmt(totalEspece) + '</b></div>' +
      '<div><span>Total chèques</span><b class="num">' + fmt(totalCheque) + '</b></div>' +
      '<div><span>Total dépôts en banque</span><b class="num">' + fmt(totalDepot) + '</b></div>' +
      '<div><span>Total dépenses de caisse</span><b class="num">' + fmt(totalDepenses) + '</b></div>' +
      '<div><span>Total CA ventes (produits)</span><b class="num">' + fmt(totalCaVentes) + '</b></div>' +
      '<div><span>Total perte et profit</span>' + htmlEcartPerteProfitValeur(totalPerteProfit) + '</div>' +
      '<div><span>Fond de caisse au matin du 1er jour</span><b class="num">' + (fondMatin===null?'—':fmt(fondMatin)) + '</b></div>' +
      '<div><span>Fond de caisse au soir du dernier jour</span><b class="num">' + (fondSoir===null?'—':fmt(fondSoir)) + '</b></div>' +
      '</div></div>';

    html += '<div class="stat-caisse-controle' + (controleOk && !coherent ? ' stat-caisse-controle-alerte' : '') + '">';
    if (!controleOk){
      html += '<p>Aucune clôture enregistrée pour ce mois : contrôle impossible.</p>';
    } else {
      html += '<p>Contrôle : total espèces + fond du matin (1er jour) − fond du soir (dernier jour) − dépenses ± pertes et profits = <b class="num">' + fmt(depotAttendu) + '</b>, à comparer au total des dépôts enregistrés (<b class="num">' + fmt(totalDepot) + '</b>).</p>';
      if (coherent){
        html += '<p class="stat-caisse-ok">✓ Cohérent avec les dépôts en banque enregistrés.</p>';
      } else {
        html += '<p class="stat-caisse-alerte">⚠ Écart de ' + fmt(Math.abs(ecartControle)) + ' entre le contrôle et les dépôts enregistrés — à vérifier avec le salon.</p>';
      }
    }
    html += '</div>';

    html += '</div>'; // .stat-caisse-page
    return html;
  }
  function wireSectionStatistiqueCaisse(el){
    const moisSel = el.querySelector("#statcaisse-mois");
    if (moisSel) moisSel.addEventListener("change", () => { ui.statCaisseMois = Number(moisSel.value); rafraichirStatistiqueCaisse(); });
    const anneeInp = el.querySelector("#statcaisse-annee");

  // ---------------- Gestion : vue consolidée multi-salons (AAROS Gestion) ----------------
  // Un client AAROS a tous ses salons dans le même projet Supabase (un Supabase par client,
  // pas par salon) : cette section agrège donc simplement ce qui est déjà visible salon par
  // salon dans le tableau de bord, plutôt que d'avoir besoin d'une plateforme séparée.
  // Salon Pilote exclu (mêmes conventions que le classement du mois) : ses ventes sont
  // fictives/de test, les mélanger au CA réel n'aurait aucun sens.
  async function chargerGestionMultiSalons(){
    if (!ui.gestionDebut){
      const d = new Date(); d.setDate(1);
      ui.gestionDebut = fmtDateInput(d);
    }
    if (!ui.gestionFin) ui.gestionFin = fmtDateInput(new Date());
    await rafraichirGestionMultiSalons();
  }
  async function rafraichirGestionMultiSalons(){
    ui.gestionChargement = true; renderAdminEquipe();
    try{
      const d = new Date(ui.gestionDebut + "T00:00:00");
      const f = new Date(ui.gestionFin + "T00:00:00"); f.setDate(f.getDate() + 1);
      const { data, error } = await supa.rpc("gestion_salons_totaux", {p_debut: d.toISOString(), p_fin: f.toISOString()});
      if (error) throw error;
      ui.gestionLignes = data || [];
    }catch(err){
      ui.gestionLignes = [];
      ui.adminMsg = "Erreur : " + (err.message || err); ui.adminMsgErr = true;
    }
    ui.gestionChargement = false;
    renderAdminEquipe();
  }
  function htmlSectionGestion(){
    let html = '<h3>Gestion — vue consolidée multi-salons</h3>';
    html += '<p class="hint">Chiffre d\'affaires et indicateurs de tous les salons du groupe sur la période choisie (Salon Pilote exclu).</p>';
    html += '<div class="comptage-actions" style="margin:14px 0 18px; align-items:flex-end;">' +
      '<div class="comptage-autre" style="margin-top:0;"><label>Du</label><input type="date" id="gestion-debut" value="' + ui.gestionDebut + '"></div>' +
      '<div class="comptage-autre" style="margin-top:0;"><label>Au</label><input type="date" id="gestion-fin" value="' + ui.gestionFin + '" max="' + fmtDateInput(new Date()) + '"></div>' +
      '</div>';
    if (ui.gestionChargement){
      html += '<p class="hint">Chargement…</p>';
      return html;
    }
    const lignes = ui.gestionLignes || [];
    if (lignes.length === 0){
      html += '<p class="panier-empty">Aucune donnée sur cette période.</p>';
      return html;
    }
    const totalGroupe = lignes.reduce((s, l) => s + Number(l.ca_total || 0), 0);
    const ticketsGroupe = lignes.reduce((s, l) => s + Number(l.nb_tickets || 0), 0);
    html += '<div class="dash-kpi-band" style="margin-bottom:18px;">' +
      '<div class="dash-kpi"><div class="v">' + fmt(totalGroupe) + '</div><div class="k">CA total du groupe</div></div>' +
      '<div class="dash-kpi"><div class="v">' + ticketsGroupe + '</div><div class="k">Tickets (tous salons)</div></div>' +
      '<div class="dash-kpi"><div class="v">' + lignes.length + '</div><div class="k">Salons actifs sur la période</div></div>' +
      '</div>';
    html += '<div class="table-scroll"><table class="collab-table"><thead><tr>' +
      '<th>Salon</th><th class="num">CA</th><th class="num">% du groupe</th><th class="num">Tickets</th>' +
      '<th class="num">Panier moyen</th><th class="num">Taux de remise</th>' +
      '</tr></thead><tbody>';
    lignes.forEach(l => {
      const part = totalGroupe > 0 ? Math.round((Number(l.ca_total) / totalGroupe) * 1000) / 10 : 0;
      html += '<tr>' +
        '<td class="name-cell">' + escapeHtml(l.nom) + '</td>' +
        '<td class="num">' + fmt(l.ca_total) + '</td>' +
        '<td class="num">' + part + ' %</td>' +
        '<td class="num">' + l.nb_tickets + '</td>' +
        '<td class="num">' + fmt(l.panier_moyen) + '</td>' +
        '<td class="num">' + l.taux_remise + ' %</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    return html;
  }
  function wireSectionGestion(el){
    const d = el.querySelector("#gestion-debut");

  function activerSidebarItem(cle){

  // Statistiques calculées à la volée depuis l'historique de tickets déjà chargé pour la fiche
  // (ui.ficheClientHistorique) : aucun appel réseau supplémentaire, uniquement des données
  // réelles. Les tickets annulés sont exclus des totaux (mais restent visibles dans l'onglet
  // Historique, comme partout ailleurs dans l'appli).
  function ficheClientStats(tickets){
    const actifs = (tickets || []).filter(t => !t.annule);
    const nbVisites = actifs.length;
    const caTotal = actifs.reduce((s,t) => s + t.total, 0);
    const panierMoyen = nbVisites ? caTotal / nbVisites : 0;
    let dernierePassage = null;
    actifs.forEach(t => { if (!dernierePassage || new Date(t.horodatage) > new Date(dernierePassage)) dernierePassage = t.horodatage; });
    return { nbVisites, caTotal, panierMoyen, dernierePassage };
  }
  // Regroupe les lignes de type "produit" des tickets non annulés, par nom de produit.
  function ficheClientProduitsAchetes(tickets){
    const map = {};
    (tickets || []).filter(t => !t.annule).forEach(t => {
      (t.lignes_ticket || []).filter(l => l.type_item === "produit").forEach(l => {
        if (!map[l.nom_prestation]) map[l.nom_prestation] = { nom:l.nom_prestation, quantite:0, total:0, dernierAchat:t.horodatage };
        const e = map[l.nom_prestation];
        e.quantite += 1;
        e.total += l.prix;
        if (new Date(t.horodatage) > new Date(e.dernierAchat)) e.dernierAchat = t.horodatage;
      });
    });
    return Object.values(map).sort((a,b) => b.total - a.total);
  }

  function catalogueTout(){
    return catalogue.map(i => Object.assign({type:"prestation"}, i))
      .concat(forfaitsCatalogue.map(i => Object.assign({type:"forfait"}, i)));
  }
  // ordre d'affichage demandé pour les catégories les plus utilisées ; le reste suit, par ordre alphabétique
  const CATEGORIES_PRIORITAIRES = ["Brushing / Coiffage", "Coupe", "Couleur", "Soins"];
  function comparerCategories(a, b){
    const ia = CATEGORIES_PRIORITAIRES.indexOf(a), ib = CATEGORIES_PRIORITAIRES.indexOf(b);
    if (ia > -1 || ib > -1){
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    }
    return a.localeCompare(b, "fr");
  }
  function parPrixCroissant(items){ return items.slice().sort((a,b) => a.prix - b.prix); }
  // Couleur stable et déterministe par nom (même texte = même couleur à chaque affichage,
  // sans configuration à maintenir) -- utilisée pour le badge de salon, pas pour les
  // catégories de prestations/forfaits (voir iconeCategorie ci-dessous pour celles-ci).
  const PALETTE_CATEGORIES = ["#E20613","#0f6e8c","#b45309","#1c7a4d","#6d28d9","#c2410c","#0e7490","#be185d","#4d7c0f","#7c3aed","#a16207","#0369a1"];
  function couleurCategorie(cat){
    let h = 0;
    for (let i = 0; i < cat.length; i++){ h = (h * 31 + cat.charCodeAt(i)) >>> 0; }
    return PALETTE_CATEGORIES[h % PALETTE_CATEGORIES.length];
  }
  // Repère visuel par catégorie de prestation/forfait : une icône plutôt qu'une couleur
  // (plus lisible, ne dépend pas de la distinction des couleurs). Reconnaît les catégories
  // courantes par mot-clé (insensible aux accents/majuscules) ; une catégorie inconnue --
  // salon avec un nom différent, nouvelle catégorie ajoutée plus tard -- retombe sur une
  // icône neutre plutôt que de ne rien afficher.
  const ICONES_CATEGORIES = [
    [["coupe"], "✂️"],
    [["couleur", "color", "meche", "balayage"], "🎨"],
    [["brushing", "coiffage", "chignon"], "💇"],
    [["soin"], "💆"],
    [["extension"], "🪢"],
    [["barbier", "homme", "barbe"], "💈"],
    [["manucure", "ongle"], "💅"],
    [["maquillage"], "💄"],
    [["epilation"], "🪒"]
  ];
  function iconeCategorie(cat){
    const k = normKey(cat);
    const trouve = ICONES_CATEGORIES.find(([mots]) => mots.some(m => k.indexOf(m) > -1));
    return trouve ? trouve[1] : "🏷️";
  }
  // Extensions : regroupe par élément reconnu dans le nom (gamme GL Natural/WEFT, pose, repose, frais…)
  function sousGroupeExtension(nom){
    if (nom.indexOf("GL WEFT Natural") > -1) return "GL WEFT Natural";
    if (nom.indexOf("GL WEFT Rooted") > -1) return "GL WEFT Rooted";
    if (nom.indexOf("GL Natural") > -1) return "GL Natural";
    if (nom.indexOf("Frais de Livraison") > -1) return "Frais de livraison";
    if (nom.indexOf("Pose Double Bande") > -1) return "Pose double bande";
    if (nom.indexOf("Repose") > -1) return "Repose";
    if (nom.indexOf("Mèches") > -1) return "Suppléments (comptage de mèches)";
    if (nom.indexOf("Pose") > -1 && nom.indexOf("Dépose") > -1) return "Pose / dépose";
    if (nom.indexOf("Retrait") > -1) return "Retrait";
    if (/^Extensions? [\d"\/]/.test(nom)) return "GL Natural";
    return "Autres extensions";
  }
  function grouperParSousGroupeExtension(items){
    const groupes = {};
    items.forEach(it => {
      const g = sousGroupeExtension(it.nom);
      if (!groupes[g]) groupes[g] = [];
      groupes[g].push(it);
    });
    Object.keys(groupes).forEach(g => { groupes[g] = parPrixCroissant(groupes[g]); });
    return Object.keys(groupes)
      .sort((a,b) => groupes[a][0].prix - groupes[b][0].prix)
      .map(label => ({label, items:groupes[label]}));
  }
  function blocItemsHtml(items, categorie){
    if (categorie === "Extensions"){
      return grouperParSousGroupeExtension(items).map(g =>
        '<div class="extension-groupe"><div class="extension-groupe-titre">' + escapeHtml(g.label) + '</div><div class="tile-list">' +
          g.items.map(tileHtml).join('') + '</div></div>'
      ).join('');
    }
    return '<div class="tile-list">' + parPrixCroissant(items).map(tileHtml).join('') + '</div>';
  }
  function trouverItemCatalogue(cle){
    const [type, id] = [cle.slice(0, cle.indexOf(":")), cle.slice(cle.indexOf(":")+1)];
    return catalogueTout().find(i => i.type === type && i.id === id);
  }
  function tileHtml(item){
    return '<button type="button" class="row-item' + (item.type === "forfait" ? ' forfait' : '') + '" data-add="' + item.type + ':' + item.id + '">' +
      '<span class="row-name"><span class="row-icon">' + iconeCategorie(item.categorie) + '</span>' + escapeHtml(item.nom) + (item.type === "forfait" ? ' <span class="row-tag">Forfait</span>' : '') + '</span>' +
      '<span class="row-price num">' + fmt(item.prix) + '</span></button>';
  }
  function wireTiles(el, apresAjout){
    el.querySelectorAll("[data-add]").forEach(btn => {
      btn.addEventListener("click", () => {
        const item = trouverItemCatalogue(btn.getAttribute("data-add"));
        if (item){
          addToPanier(item);
          // Dans une fenêtre de catégorie/forfaits, on referme après l'ajout : une fois une
          // prestation ou un forfait choisi, l'étape suivante est généralement un autre choix
          // ailleurs dans le catalogue (pas forcément la même catégorie), donc pas besoin de
          // garder la fenêtre ouverte -- on revient directement sur la page globale.
          if (apresAjout) apresAjout();
        }
      });
    });
  }

      html += '</div>';
    } else {
      html += '<div class="actions-catalogue"><button type="button" class="action-shortcut" id="btn-carte-cadeau"><span class="emoji">🎁</span> Carte cadeau</button>' +
        '<button type="button" class="action-shortcut" id="btn-produits"><span class="emoji">🧴</span> Produits' +
        (produitsCatalogue.length ? '' : ' <span class="hint-sm">(aucun produit de vente configuré)</span>') + '</button></div>';
      // Les forfaits ont leur propre bouton d'accès (traversent toutes les catégories) ;
      // les onglets de catégorie ne listent donc que les prestations.
      const forfaitsTous = tous.filter(i => i.type === "forfait");
      const byCat = {};
      tous.filter(i => i.type === "prestation").forEach(item => {
        byCat[item.categorie] = (byCat[item.categorie] || 0) + 1;
      });
      const cats = Object.keys(byCat).sort(comparerCategories);

      // Chaque case ouvre une fenêtre dédiée au clic (plutôt que d'afficher les items en
      // dessous) : ça garde l'écran d'entrée court et lisible, quelle que soit la taille
      // de la catégorie choisie.
      html += '<div class="categorie-tabs">';
      if (forfaitsTous.length){
        html += '<button type="button" class="categorie-tab forfaits-tab" data-cat="' + FORFAITS_TAB + '">' +
          '<span class="cat-label">🎟️ Forfaits</span><span class="cat-count">' + forfaitsTous.length + '</span></button>';
      }
      cats.forEach(cat => {
        html += '<button type="button" class="categorie-tab" data-cat="' + escapeHtml(cat) + '">' +
          '<span class="cat-label"><span class="cat-icon">' + iconeCategorie(cat) + '</span>' + escapeHtml(cat) + '</span><span class="cat-count">' + byCat[cat] + ' prestation' + (byCat[cat] > 1 ? 's' : '') + '</span></button>';
      });
      html += '</div>';
    }
    el.innerHTML = html;
    wireTiles(el);
    el.querySelectorAll("[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => ouvrirCatalogueCategorieModal(btn.getAttribute("data-cat")));
    });
    const btnCarteCadeau = document.getElementById("btn-carte-cadeau");
    if (btnCarteCadeau) btnCarteCadeau.addEventListener("click", ouvrirCarteCadeauModal);
    renderCarteCadeauModal();
    const btnProduits = document.getElementById("btn-produits");
    if (btnProduits) btnProduits.addEventListener("click", ouvrirProduitsModal);
    renderProduitsModal();
    renderCatalogueCategorieModal();
  }

    document.getElementById("catalogue-categorie-modal-backdrop").addEventListener("click", (e) => {

  // ---------------- produits (vente en caisse) : rangés par marque puis par gamme ----------------
  function ajouterProduitAuPanier(produitId){
    if (ui.confirming) return;
    const item = produitsCatalogue.find(p => p.id === produitId);
    if (!item) return;
    ui.panier.push({id:item.id, nom:item.nom, prix:Number(item.prix), type:"produit", categorie:null, collaborateurId: ui.prestataireActifId, produitId:item.id});
    ui.produitsModalOuvert = false;
    ui.produitsRecherche = "";
    render();
  }
  function grouperProduitsParMarqueGamme(items){
    const parMarque = {};
    items.forEach(p => {
      const marque = p.marque || "Autres marques";
      if (!parMarque[marque]) parMarque[marque] = {};
      const gamme = p.gamme || "Autres produits";
      if (!parMarque[marque][gamme]) parMarque[marque][gamme] = [];
      parMarque[marque][gamme].push(p);
    });
    return Object.keys(parMarque).sort((a,b) => a.localeCompare(b, "fr")).map(marque => ({
      marque,
      gammes: Object.keys(parMarque[marque]).sort((a,b) => a.localeCompare(b, "fr")).map(gamme => ({
        gamme, items: parMarque[marque][gamme].slice().sort((a,b) => a.nom.localeCompare(b.nom, "fr"))
      }))
    }));
  }
  function produitTileHtml(item){
    return '<button type="button" class="row-item" data-add-produit="' + item.id + '">' +
      '<span class="row-name">' + escapeHtml(item.nom) + (item.code_barre ? ' <span class="item-extra">' + escapeHtml(item.code_barre) + '</span>' : '') + '</span>' +
      '<span class="row-price num">' + fmt(item.prix) + '</span></button>';
  }
  function ouvrirProduitsModal(){
    ui.produitsModalOuvert = true;
    ui.produitsRecherche = "";
    ui.produitsModalFiltre = {marque:null, gamme:null, categorie:null};
    render();
  }
  function fermerProduitsModal(){
    ui.produitsModalOuvert = false;
    ui.produitsRecherche = "";
    render();
  }
  function renderProduitsModal(){
    let modalEl = document.getElementById("produits-modal-root");
    if (!ui.produitsModalOuvert){
      if (modalEl) modalEl.remove();
      return;
    }
    if (!modalEl){
      modalEl = document.createElement("div");
      modalEl.id = "produits-modal-root";
      document.body.appendChild(modalEl);
    }
    let html = '<div class="modal-backdrop" id="produits-modal-backdrop"><div class="modal-panel">' +
      '<div class="modal-head"><h2>Produits</h2><button type="button" class="btn ghost sm" id="produits-modal-fermer">✕ Fermer</button></div>' +
      '<div class="modal-recherche"><input type="text" id="produits-modal-recherche" placeholder="Nom, marque, gamme ou scan du code-barre…" value="' + escapeHtml(ui.produitsRecherche) + '"></div>' +
      '<div id="produits-modal-items"></div>' +
      '</div></div>';
    modalEl.innerHTML = html;

    renderProduitsModalItems();

    const rechModal = document.getElementById("produits-modal-recherche");
    rechModal.focus();
    rechModal.addEventListener("input", () => {
      ui.produitsRecherche = rechModal.value;
      // une scanette code-barre tape le code puis valide très vite : si le texte saisi
      // correspond exactement au code-barre d'un produit, on l'ajoute directement au panier
      const q = rechModal.value.trim();
      const matchExact = q && produitsCatalogue.find(p => p.code_barre && p.code_barre === q);
      if (matchExact){
        ajouterProduitAuPanier(matchExact.id);
        return;
      }
      renderProduitsModalItems();
    });
    document.getElementById("produits-modal-fermer").addEventListener("click", fermerProduitsModal);
    document.getElementById("produits-modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "produits-modal-backdrop") fermerProduitsModal();
    });
  }
  function renderProduitsModalItems(){
    const itemsEl = document.getElementById("produits-modal-items");
    if (!itemsEl || !ui.produitsModalOuvert) return;
    const q = normKey(ui.produitsRecherche);
    let html = "";
    if (produitsCatalogue.length === 0){
      html = '<p class="hint">Aucun produit de vente configuré pour ce salon pour l\'instant (à ajouter depuis Paramètres → Produits).</p>';
    } else if (q){
      const resultats = produitsCatalogue.filter(p =>
        normKey(p.nom).indexOf(q) > -1 || normKey(p.marque).indexOf(q) > -1 ||
        normKey(p.gamme).indexOf(q) > -1 || (p.code_barre || "").indexOf(q) > -1
      ).sort((a,b) => a.nom.localeCompare(b.nom, "fr"));
      html += '<div class="cat-block"><div class="cat-title">' + resultats.length + ' résultat(s)</div>';
      if (resultats.length === 0){
        html += '<p class="hint">Aucun résultat pour « ' + escapeHtml(ui.produitsRecherche) + ' ».</p>';
      } else {
        html += '<div class="tile-list">' + resultats.map(produitTileHtml).join('') + '</div>';
      }
      html += '</div>';
    } else {
      // sans recherche : on choisit d'abord une marque (comme dans l'admin Produits/Stock),
      // pour ne pas noyer la caisse sous des centaines de produits d'un coup
      const filtre = ui.produitsModalFiltre;
      const info = calculerFiltreMarque(produitsCatalogue, filtre);
      html += htmlFiltreMarque(info, filtre, "encaissement");
      if (filtre.marque !== null){
        grouperProduitsParMarqueGamme(info.affiches).forEach(bloc => {
          html += '<div class="modal-sub-block"><div class="modal-sub-title">' + escapeHtml(bloc.marque) + '</div>';
          bloc.gammes.forEach(g => {
            html += '<div class="extension-groupe"><div class="extension-groupe-titre">' + escapeHtml(g.gamme) + '</div><div class="tile-list">' +
              g.items.map(produitTileHtml).join('') + '</div></div>';
          });
          html += '</div>';
        });
      }
    }
    itemsEl.innerHTML = html;
    wireFiltreMarque(itemsEl, renderProduitsModalItems);
    itemsEl.querySelectorAll("[data-add-produit]").forEach(btn => {
      btn.addEventListener("click", () => ajouterProduitAuPanier(btn.getAttribute("data-add-produit")));
    });
  }

  // ---------------- stock (accès rapide depuis l'encaissement, à côté de Client) ----------------
  // Réutilise les mêmes données/RPC que l'admin Stock (ui.stockAdmin, admin_lister_stock_salon,
  // stock_enregistrer_mouvement…) mais dans un modal accessible sans code direction, pour qu'un
  // mouvement (réception, casse…) puisse être noté directement pendant le service.
  function ouvrirStockModal(){
    ui.stockModalOuvert = true;
    ui.stockModal.onglet = "niveaux";
    ui.stockAdmin.filtre = {marque:null, gamme:null, categorie:null, type:null};
    ui.stockAdmin.mouvementProduitId = null;
    ui.stockAdmin.modalRecherche = "";
    ui.stockAdmin.historiqueProduitId = null; ui.stockAdmin.historique = [];
    ui.stockModalMsg = ""; ui.stockModalMsgErr = false;
    render();
    chargerStockModal();
  }
  function fermerStockModal(){
    ui.stockModalOuvert = false;
    render();
  }
  async function chargerStockModal(){
    ui.stockAdmin.chargement = true;
    renderStockModal();
    try{
      const [{data: items, error: e1}, {data: cats, error: e2}] = await Promise.all([
        supa.rpc("admin_lister_stock_salon", {p_salon_id: salon.id}),
        supa.rpc("admin_lister_categories_mouvement_stock", {})
      ]);
      if (e1) throw e1;
      if (e2) throw e2;
      ui.stockAdmin.items = items || [];
      ui.stockAdmin.categories = cats || [];
    }catch(err){
      ui.stockModalMsg = "Erreur de chargement du stock : " + (err.message || err); ui.stockModalMsgErr = true;
    }
    ui.stockAdmin.chargement = false;
    renderStockModal();
  }
  async function chargerHistoriqueStockModal(produitId){
    ui.stockAdmin.historiqueProduitId = produitId || null;
    const row = produitId ? ui.stockAdmin.items.find(i => i.produit_id === produitId) : null;
    ui.stockAdmin.historiqueProduitNom = row ? row.nom : "";
    try{
      const { data, error } = await supa.rpc("admin_lister_mouvements_stock", { p_salon_id: salon.id, p_produit_id: produitId || null, p_limite: 200 });
      if (error) throw error;
      ui.stockAdmin.historique = data || [];
    }catch(err){
      ui.stockModalMsg = "Erreur : " + (err.message || err); ui.stockModalMsgErr = true;
    }
    renderStockModal();
  }
  async function validerMouvementStockModal(){
    const produitId = ui.stockAdmin.mouvementProduitId;
    if (!produitId) return;
    const categorieId = document.getElementById("stockmodal-mvt-categorie").value;
    const quantite = Number(document.getElementById("stockmodal-mvt-quantite").value);
    const commentaire = document.getElementById("stockmodal-mvt-commentaire").value.trim();
    if (!categorieId){ ui.stockModalMsg = "Choisis une catégorie."; ui.stockModalMsgErr = true; renderStockModal(); return; }
    if (!quantite || quantite <= 0){ ui.stockModalMsg = "La quantité doit être supérieure à 0."; ui.stockModalMsgErr = true; renderStockModal(); return; }
    try{
      const { error } = await supa.rpc("stock_enregistrer_mouvement", {
        p_produit_id: produitId, p_salon_id: salon.id, p_categorie_id: categorieId, p_quantite: quantite,
        p_collaborateur_id: ui.collaborateurConnecte ? ui.collaborateurConnecte.id : null, p_commentaire: commentaire || null
      });
      if (error) throw error;
      ui.stockAdmin.mouvementProduitId = null;
      ui.stockModalMsg = "Mouvement enregistré."; ui.stockModalMsgErr = false;
      await chargerStockModal();
    }catch(err){
      ui.stockModalMsg = "Erreur : " + (err.message || err); ui.stockModalMsgErr = true;
      renderStockModal();
    }
  }
  function renderStockModal(){
    let modalEl = document.getElementById("stock-modal-root");
    if (!ui.stockModalOuvert){
      if (modalEl) modalEl.remove();
      return;
    }
    if (!modalEl){
      modalEl = document.createElement("div");
      modalEl.id = "stock-modal-root";
      document.body.appendChild(modalEl);
    }
    let html = '<div class="modal-backdrop" id="stock-modal-backdrop"><div class="modal-panel">' +
      '<div class="modal-head"><h2>Gestion du stock</h2><button type="button" class="btn ghost sm" id="stock-modal-fermer">✕ Fermer</button></div>';
    if (ui.stockModalMsg){
      html += '<div class="' + (ui.stockModalMsgErr ? "err-toast" : "receipt-toast") + '" style="margin:0 0 10px;">' + escapeHtml(ui.stockModalMsg) + '</div>';
    }
    html += '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">' +
      ['niveaux','mouvements'].map(o => '<button type="button" class="btn ' + (ui.stockModal.onglet===o?'primary':'ghost') + ' sm" data-stockmodal-onglet="' + o + '">' +
        (o==='niveaux'?'Niveaux de stock':'Mouvements') + '</button>').join('') + '</div>';
    html += '<div id="stock-modal-corps"></div>';
    html += '</div></div>';
    modalEl.innerHTML = html;

    renderStockModalCorps();

    document.getElementById("stock-modal-fermer").addEventListener("click", fermerStockModal);
    document.getElementById("stock-modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "stock-modal-backdrop") fermerStockModal();
    });
    modalEl.querySelectorAll("[data-stockmodal-onglet]").forEach(btn => btn.addEventListener("click", () => {
      ui.stockModal.onglet = btn.getAttribute("data-stockmodal-onglet");
      ui.stockAdmin.mouvementProduitId = null;
      if (ui.stockModal.onglet === "mouvements" && ui.stockAdmin.historique.length === 0) chargerHistoriqueStockModal(ui.stockAdmin.historiqueProduitId);
      renderStockModal();
    }));
  }
  function renderStockModalCorps(){
    const el = document.getElementById("stock-modal-corps");
    if (!el) return;
    let html = "";
    if (ui.stockAdmin.chargement){
      html = '<p class="panier-empty">Chargement…</p>';
    } else if (ui.stockModal.onglet === "niveaux"){
      if (ui.stockAdmin.items.length === 0){
        html = '<p class="panier-empty">Aucun produit de stock configuré pour ce salon.</p>';
      } else {
        html += '<div class="modal-recherche"><input type="text" id="stockmodal-recherche" placeholder="Nom, marque, gamme ou scan du code-barre…" value="' + escapeHtml(ui.stockAdmin.modalRecherche || "") + '"></div>';
        const filtre = ui.stockAdmin.filtre;
        const info = calculerFiltreMarque(ui.stockAdmin.items, filtre);
        html += htmlFiltreMarque(info, filtre, "stock");
        if (filtre.marque !== null){
          if (info.affiches.length === 0){
            html += '<p class="panier-empty">Aucun produit pour cette sélection.</p>';
          } else {
            html += '<div class="ticket-list">';
            info.affiches.forEach(it => {
              const ouvert = ui.stockAdmin.mouvementProduitId === it.produit_id;
              html += '<div class="ticket-row" style="flex-wrap:wrap;">' +
                '<span class="badge' + (it.type_stock==='technique' ? ' vip' : '') + '">' + (it.type_stock==='technique'?'Technique':'Vente') + '</span>' +
                '<span class="tdetail">' + escapeHtml(it.nom) + '<br><span class="lreal">' + escapeHtml(it.marque||'—') + ' · ' + escapeHtml(it.gamme||'—') + (it.categorie ? ' · ' + escapeHtml(it.categorie) : '') + '</span></span>' +
                '<span class="num"' + (it.alerte ? ' style="color:var(--danger);font-weight:700;"' : '') + '>Stock : ' + it.stock + (it.seuil_alerte!=null ? ' (seuil ' + it.seuil_alerte + ')' : '') + (it.alerte ? ' ⚠' : '') + '</span>' +
                '<button type="button" class="btn ghost sm" data-stockmodal-mvt="' + it.produit_id + '">' + (ouvert ? "Fermer" : "Entrée / Sortie") + '</button>' +
                '</div>';
              if (ouvert){
                const cats = ui.stockAdmin.categories.filter(c => c.actif);
                html += '<div class="client-form" style="margin:0 0 12px;">' +
                  '<select id="stockmodal-mvt-categorie"><option value="">— Catégorie —</option>' +
                  cats.map(c => '<option value="' + c.id + '"' + (ui.stockAdmin.mouvementCategorieId===c.id?' selected':'') + '>' + (c.sens==='entree'?'Entrée — ':'Sortie — ') + escapeHtml(c.libelle) + '</option>').join('') +
                  '</select>' +
                  '<input type="number" step="1" min="1" id="stockmodal-mvt-quantite" placeholder="Quantité" value="' + escapeHtml(ui.stockAdmin.mouvementQuantite) + '">' +
                  '<input type="text" id="stockmodal-mvt-commentaire" placeholder="Commentaire (optionnel)" value="' + escapeHtml(ui.stockAdmin.mouvementCommentaire) + '">' +
                  '<div class="full"><button type="button" class="btn ghost" id="stockmodal-mvt-annuler">Annuler</button><button type="button" class="btn primary" id="stockmodal-mvt-valider">Valider le mouvement</button></div>' +
                  '</div>';
              }
            });
            html += '</div>';
          }
        }
      }
    } else if (ui.stockModal.onglet === "mouvements"){
      html += '<div class="client-form" style="margin-bottom:10px;"><select id="stockmodal-hist-produit"><option value="">Tous les produits</option>' +
        ui.stockAdmin.items.map(it => '<option value="' + it.produit_id + '"' + (ui.stockAdmin.historiqueProduitId===it.produit_id?' selected':'') + '>' + escapeHtml(it.nom) + '</option>').join('') +
        '</select></div>';
      if (ui.stockAdmin.historique.length === 0){
        html += '<p class="panier-empty">Aucun mouvement pour l\'instant.</p>';
      } else {
        html += '<div class="ticket-list">';
        ui.stockAdmin.historique.forEach(m => {
          html += '<div class="ticket-row"><span class="tnum num">' + (m.sens==='entree'?'+ '+m.quantite:'− '+m.quantite) + '</span>' +
            '<span class="tdetail">' + escapeHtml(m.produit_nom) + ' — ' + escapeHtml(m.categorie_libelle) +
            (m.commentaire ? '<br><span class="lreal">' + escapeHtml(m.commentaire) + '</span>' : '') +
            '<br><span class="lreal">Par ' + escapeHtml(m.collaborateur_nom) + '</span></span>' +
            '<span class="tdetail num">' + fmtTime(m.horodatage) + '</span>' +
            '<span class="num">Stock après : ' + m.stock_apres + '</span></div>';
        });
        html += '</div>';
      }
    }
    el.innerHTML = html;

    const rechModal = document.getElementById("stockmodal-recherche");
    if (rechModal) rechModal.addEventListener("input", () => {
      ui.stockAdmin.modalRecherche = rechModal.value;
      const q = rechModal.value.trim();
      const matchExact = q && ui.stockAdmin.items.find(it => it.code_barre && it.code_barre === q);
      if (matchExact){
        ui.stockAdmin.modalRecherche = "";
        ui.stockAdmin.filtre = { marque:"__TOUS__", gamme:null, categorie:null, type:null };
        ui.stockAdmin.mouvementProduitId = matchExact.produit_id;
        ui.stockAdmin.mouvementProduitNom = matchExact.nom;
        ui.stockAdmin.mouvementCategorieId = ""; ui.stockAdmin.mouvementQuantite = ""; ui.stockAdmin.mouvementCommentaire = "";
        renderStockModalCorps();
      }
    });

    wireFiltreMarque(el, renderStockModalCorps);
    el.querySelectorAll("[data-stockmodal-mvt]").forEach(btn => btn.addEventListener("click", () => {
      const produitId = btn.getAttribute("data-stockmodal-mvt");
      if (ui.stockAdmin.mouvementProduitId === produitId){
        ui.stockAdmin.mouvementProduitId = null;
      } else {
        const row = ui.stockAdmin.items.find(i => i.produit_id === produitId);
        ui.stockAdmin.mouvementProduitId = produitId;
        ui.stockAdmin.mouvementProduitNom = row ? row.nom : "";
        ui.stockAdmin.mouvementCategorieId = ""; ui.stockAdmin.mouvementQuantite = ""; ui.stockAdmin.mouvementCommentaire = "";
      }
      renderStockModalCorps();
    }));
    const mvtCategorie = document.getElementById("stockmodal-mvt-categorie"); if (mvtCategorie) mvtCategorie.addEventListener("change", () => { ui.stockAdmin.mouvementCategorieId = mvtCategorie.value; });
    const mvtQuantite = document.getElementById("stockmodal-mvt-quantite"); if (mvtQuantite) mvtQuantite.addEventListener("input", () => { ui.stockAdmin.mouvementQuantite = mvtQuantite.value; });
    const mvtCommentaire = document.getElementById("stockmodal-mvt-commentaire"); if (mvtCommentaire) mvtCommentaire.addEventListener("input", () => { ui.stockAdmin.mouvementCommentaire = mvtCommentaire.value; });
    const mvtAnnuler = document.getElementById("stockmodal-mvt-annuler"); if (mvtAnnuler) mvtAnnuler.addEventListener("click", () => { ui.stockAdmin.mouvementProduitId = null; renderStockModalCorps(); });
    const mvtValider = document.getElementById("stockmodal-mvt-valider"); if (mvtValider) mvtValider.addEventListener("click", validerMouvementStockModal);

  function renderReceptionModal(){
    const sa = ui.stockAdmin;
    let modalEl = document.getElementById("reception-modal-root");
    if (!sa.receptionOuverte){
      if (modalEl) modalEl.remove();
      return;
    }
    if (!modalEl){
      modalEl = document.createElement("div");
      modalEl.id = "reception-modal-root";
      document.body.appendChild(modalEl);
    }
    const nbUnites = sa.receptionLignes.reduce((s,l) => s + (Number(l.quantite) || 0), 0);
    let html = '<div class="modal-backdrop" id="reception-modal-backdrop"><div class="modal-panel">' +
      '<div class="modal-head"><h2>Réception commande</h2><button type="button" class="btn ghost sm" id="reception-modal-fermer"' + (sa.receptionEnCours ? ' disabled' : '') + '>✕ Fermer</button></div>' +
      '<p class="hint" style="margin:0 0 10px;">Scanne chaque produit reçu (la quantité par défaut est 1, modifiable), puis valide en une fois à la fin.</p>' +
      '<div class="modal-recherche"><input type="text" id="reception-scan" placeholder="Scanner un code-barre…" value="' + escapeHtml(sa.receptionScan) + '" autocomplete="off"' + (sa.receptionEnCours ? ' disabled' : '') + '></div>' +
      '<div class="modal-recherche" style="margin-top:-6px;"><input type="text" id="reception-reference" placeholder="Référence (bon de livraison, fournisseur…) — optionnel" value="' + escapeHtml(sa.receptionReference) + '"' + (sa.receptionEnCours ? ' disabled' : '') + '></div>';
    if (sa.receptionMsg) html += '<p class="hint" style="color:' + (sa.receptionMsgErr ? 'var(--danger)' : 'var(--ink-soft)') + ';">' + escapeHtml(sa.receptionMsg) + '</p>';
    html += '<div class="reception-liste">';
    html += sa.receptionLignes.length === 0
      ? '<p class="panier-empty">Aucun produit scanné pour l\'instant.</p>'
      : sa.receptionLignes.map(htmlReceptionModalLigne).join('');
    html += '</div>';
    html += '<div class="correction-actions" style="margin-top:14px;">' +
      '<button type="button" class="btn primary" id="reception-valider"' + (sa.receptionEnCours || sa.receptionLignes.length === 0 ? ' disabled' : '') + '>' +
      (sa.receptionEnCours ? 'Enregistrement…' : 'Valider la réception (' + sa.receptionLignes.length + ' produit(s), ' + nbUnites + ' unité(s))') +
      '</button></div>' +
      '</div></div>';
    modalEl.innerHTML = html;

    const scanInp = document.getElementById("reception-scan");
    if (!sa.receptionEnCours) scanInp.focus();
    scanInp.addEventListener("input", () => {
      sa.receptionScan = scanInp.value;
      // une scanette code-barre tape le code puis valide très vite : si le texte saisi
      // correspond exactement au code-barre d'un produit suivi dans ce salon, on l'ajoute
      // directement à la liste de réception (même mécanisme que les autres écrans de scan).
      const q = scanInp.value.trim();
      const matchExact = q && sa.items.find(it => it.code_barre && it.code_barre === q);
      if (matchExact) ajouterLigneReception(matchExact.produit_id);
    });
    scanInp.addEventListener("keydown", (ev) => {
      if (ev.key !== "Enter") return;
      const q = scanInp.value.trim();
      if (!q) return;
      const matchExact = sa.items.find(it => it.code_barre && it.code_barre === q);
      if (matchExact){ ajouterLigneReception(matchExact.produit_id); return; }
      sa.receptionMsg = "Code-barre non reconnu : " + q + " — vérifie qu'il est bien enregistré sur ce produit (Paramètres → Produits).";
      sa.receptionMsgErr = true;
      sa.receptionScan = "";
      renderReceptionModal();
    });
    const refInp = document.getElementById("reception-reference");
    refInp.addEventListener("input", () => { sa.receptionReference = refInp.value; });
    const btnFermer = document.getElementById("reception-modal-fermer");
    if (btnFermer) btnFermer.addEventListener("click", fermerReceptionModal);
    document.getElementById("reception-modal-backdrop").addEventListener("click", (e) => {
      if (e.target.id === "reception-modal-backdrop") fermerReceptionModal();
    });
    modalEl.querySelectorAll("[data-reception-retirer]").forEach(btn => btn.addEventListener("click", () => retirerLigneReception(btn.getAttribute("data-reception-retirer"))));
    modalEl.querySelectorAll("[data-reception-qte]").forEach(inp => inp.addEventListener("input", () => {
      const val = Math.max(1, parseInt(inp.value, 10) || 1);
      const ligne = sa.receptionLignes.find(l => l.produit_id === inp.getAttribute("data-reception-qte"));
      if (ligne) ligne.quantite = val;
      const btn = document.getElementById("reception-valider");
      if (btn && !sa.receptionEnCours){
        const nb = sa.receptionLignes.reduce((s,l) => s + (Number(l.quantite) || 0), 0);
        btn.textContent = "Valider la réception (" + sa.receptionLignes.length + " produit(s), " + nb + " unité(s))";
      }
    }));
    const btnValider = document.getElementById("reception-valider");
    if (btnValider) btnValider.addEventListener("click", validerReceptionStock);
  }

  function ajouterCarteCadeauAuPanier(){
    const a = ui.carteCadeauAdmin;
    const code = (a.code || "").trim();
    const depot = Number(a.montantDepot);
    const factureBrut = a.montantFacturer === "" || a.montantFacturer == null ? depot : Number(a.montantFacturer);

    if (!code){ a.msg = "Le code de la carte est obligatoire."; a.msgErr = true; renderCarteCadeauContenu(); return; }
    if (!depot || depot <= 0){ a.msg = "Le montant à déposer doit être supérieur à 0."; a.msgErr = true; renderCarteCadeauContenu(); return; }
    if (isNaN(factureBrut) || factureBrut < 0){ a.msg = "Le montant à facturer est invalide."; a.msgErr = true; renderCarteCadeauContenu(); return; }
    if (ui.panier.some(function(l){ return l.type === "carte_cadeau"; })){
      a.msg = "Une seule carte cadeau peut être vendue par fiche."; a.msgErr = true; renderCarteCadeauContenu(); return;
    }
    if (ui.carteCadeauAppliquee){
      a.msg = "Impossible de vendre une carte cadeau sur une fiche déjà réglée (en partie) par une autre carte cadeau."; a.msgErr = true; renderCarteCadeauContenu(); return;
    }

    ui.panier.push({
      id:"cc-"+code, nom:"Carte cadeau — "+code, prix: Math.round(factureBrut*100)/100,
      type:"carte_cadeau", categorie:null, collaborateurId:null,
      carteCadeauCode: code, carteCadeauDepot: Math.round(depot*100)/100
    });
    ui.carteCadeauModalOuvert = false;
    render();
  }

  async function rechercherCarteCadeauAdmin(){
    const a = ui.carteCadeauAdmin;
    if (!a.rechercheCode || !a.rechercheCode.trim()){ a.rechercheMsg = "Saisis un code."; renderCarteCadeauContenu(); return; }
    a.rechercheMsg = ""; a.rechercheEnCours = true; a.carteInfo = null; a.mouvements = []; renderCarteCadeauContenu();
    try{
      const { data, error } = await supa.rpc("rechercher_carte_cadeau", { p_code: a.rechercheCode.trim() });
      if (error) throw error;
      const carte = (data || [])[0];
      if (!carte){
        a.rechercheMsg = "Aucune carte avec ce code.";
      } else {
        a.carteInfo = carte;
        const { data: mvts } = await supa.rpc("lister_mouvements_carte_cadeau", { p_carte_id: carte.id });
        a.mouvements = mvts || [];
      }
    }catch(err){
      a.rechercheMsg = err.message || String(err);
    }
    a.rechercheEnCours = false;
    renderCarteCadeauContenu();
  }

  const ACTIVITE_LABELS = {

  // ---------------- droits d'accès (remplacent l'ancien code responsable) ----------------
  // La direction a toujours tous les droits, sans passer par la table permissions_role.
  // Pour les autres rôles, on se fie au cache ui.permissions chargé au login — ce cache ne sert
  // qu'à afficher/masquer les actions, le contrôle qui compte est refait côté serveur dans
  // chaque fonction SQL (modifier_paiement_ticket, modifier_collaborateur_ligne, annuler_ticket).
  function peut(cle){
    const c = ui.collaborateurConnecte;
    if (!c) return false;
    if (c.role === "direction") return true;
    return !!(ui.permissions && ui.permissions[cle]);
  }
  async function chargerMesPermissions(collaborateurId){
    try{
      const { data, error } = await supa.rpc("mes_permissions", { p_collaborateur_id: collaborateurId });
      if (error) throw error;
      const p = {};
      (data || []).forEach(row => { p[row.cle] = !!row.autorise; });
      ui.permissions = p;
    }catch(err){
      ui.permissions = {};
    }
    render();
  }

  // ---------------- fonction école (mode formation) ----------------
  // Bascule au niveau du poste/session (pas du salon) : un poste peut être en formation
  // pendant que les autres encaissent normalement. Activation/désactivation journalisées
  // (qui, quand) pour la traçabilité exigée par le BOI (§150).
  async function activerModeFormation(){
    if (!peut("activer_formation") || !ui.collaborateurConnecte) return;
    ui.modeFormation = true;
    ui.clientSelectionne = null;
    ui.showNouveauClient = false;
    try{
      await supa.rpc("journaliser_activite", {
        p_salon_id: salon.id, p_collaborateur_id: ui.collaborateurConnecte.id,
        p_type_action: "mode_formation_active", p_details: null
      });
    }catch(err){ /* la bascule visuelle reste acquise même si la journalisation échoue */ }
    render();
  }
  async function desactiverModeFormation(){
    if (!ui.modeFormation || !ui.collaborateurConnecte) return;
    ui.modeFormation = false;
    try{
      await supa.rpc("journaliser_activite", {
        p_salon_id: salon.id, p_collaborateur_id: ui.collaborateurConnecte.id,
        p_type_action: "mode_formation_desactive", p_details: null
      });
    }catch(err){ /* idem */ }
    render();
  }
  function renderFormationBanner(){
    const el = document.getElementById("formation-banner");
    if (!el) return;
    if (!ui.modeFormation){ el.hidden = true; el.innerHTML = ""; return; }
    el.hidden = false;
    el.innerHTML = '🎓 MODE FORMATION — transactions fictives, non comptabilisées' +
      '<button type="button" class="btn ghost sm" id="btn-desactiver-formation" style="border-color:var(--ink);">Désactiver</button>';
    const btn = document.getElementById("btn-desactiver-formation");
    if (btn) btn.addEventListener("click", desactiverModeFormation);
  }

  async function imprimerDocumentEtMarquer(typeDocument, documentId, appliquerMention){
    try{

        p_type_document: typeDocument,

  // ---- Envoi d'un ticket/facture par email (Edge Function Supabase -- jamais la clé Brevo
  // côté navigateur, voir supabase/functions/envoyer-document-email) ----
  // Le Journal ne charge pas la fiche client associée à chaque ticket (seulement client_id) --
  // on va chercher l'email à la demande, uniquement à l'ouverture du panneau d'envoi.
  async function resoudreEmailClient(clientId){
    if (!clientId) return "";
    try{
      const { data } = await supa.from("clients").select("email").eq("id", clientId).limit(1);
      return (data && data[0] && data[0].email) || "";
    }catch(e){ return ""; }
  }

  function ouvrirEnvoiEmail(typeDocument, documentId, numero, emailConnu){
    ui.emailForm = {typeDocument, documentId, numero, email: emailConnu || "", enCours:false, erreur:null, succes:false};
    render();
  }
  function fermerEnvoiEmail(){ ui.emailForm = null; render(); }

  async function envoyerEmailDocument(){
    const f = ui.emailForm;
    if (!f || f.enCours) return;
    const email = (document.getElementById("email-destinataire") || {}).value || f.email || "";
    f.email = email.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)){
      f.erreur = "Adresse email invalide.";
      render();
      return;
    }
    f.enCours = true; f.erreur = null; f.succes = false;
    render();
    try{
      const res = await fetch(SUPABASE_URL + "/functions/v1/envoyer-document-email", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({
          type_document: f.typeDocument,
          document_id: f.documentId,
          destinataire: f.email,
          salon_id: salon.id,
          collaborateur_id: ui.collaborateurConnecte ? ui.collaborateurConnecte.id : null
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) throw new Error(data.error || "Échec de l'envoi.");
      f.enCours = false; f.succes = true;
    }catch(err){
      f.enCours = false;
      f.erreur = err.message || String(err);
    }
    render();
  }
